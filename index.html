    const minW = Number(t.dataset.minWords || 150);
    const wType = t.dataset.wType;
    state.drafts[pkgId] = t.value;
    save();
    const ev = evaluateWritingText(t.value, minW, wType);
    const statEl = document.getElementById('writing-live-stats');
    if (statEl) {
      statEl.textContent = `${ev.words} / ${minW} words · ${ev.paragraphs} paragraf`;
      statEl.style.color = ev.words >= minW ? 'var(--success)' : 'var(--accent-amber)';
    }
  } else if (t.id === 'speaking-notes-input') {
    state.speakingNotes[t.dataset.pkgId] = t.value;
    save();
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.mockJump && t.value) {
    navigate('pkg/' + t.value);
    return;
  }
  if (t.id === 'book-filter-select') {
    bookFilter = t.value;
    render();
  } else if (t.id === 'tts-rate-select') {
    audioRate = parseFloat(t.value);
    toast(`Kecepatan suara diatur ke ${audioRate}x`);
  } else if (t.dataset.qIndex !== undefined && state.activeSession) {
    const qIdx = Number(t.dataset.qIndex);
    state.activeSession.answers[qIdx] = Number(t.value);
    save();
    const pk = allPackages().find(p => p.id === state.activeSession.pkgId);
    const counter = document.getElementById('answered-counter');
    if (counter && pk) counter.textContent = `${Object.keys(state.activeSession.answers).length} / ${pk.questions.length} Terjawab`;
    const dot = document.querySelector(`[data-scroll-q="${qIdx}"]`);
    if (dot) dot.classList.add('answered');
  } else if (t.id === 'import-json-input' && t.files?.[0]) {
    try {
      const parsed = JSON.parse(await t.files[0].text());
      if (!parsed || typeof parsed !== 'object') throw new Error('Invalid');
      state = { ...defaultState(), ...parsed };
      save();
      render();
      toast('Data cadangan berhasil diimpor!');
    } catch {
      toast('File JSON tidak valid.');
    }
  }
});

// FORM SUBMISSIONS
document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target;

  if (form.id === 'lesson-quiz-form') {
    const lessonId = form.dataset.lessonId;
    const lessonObj = DATA.lessons.find(x => x.id === lessonId);
    const rawAns = new FormData(form).get('l_ans');
    if (rawAns === null) {
      toast('Pilih salah satu jawaban kuis terlebih dahulu.');
      return;
    }
    if (Number(rawAns) !== lessonObj.quiz.answer) {
      toast('Jawaban belum tepat. Periksa kembali poin materi di sebelah kiri.');
      return;
    }
    if (!state.completedLessons.includes(lessonId)) state.completedLessons.push(lessonId);
    logActivity();
    save();
    toast('Tepat sekali! Modul ditandai selesai.');
    navigate('academy');
  } else if (form.id === 'diagnostic-form') {
    const fd = new FormData(form);
    let totalCorrect = 0;
    let answeredAny = false;
    const bySkill = { Listening: { c: 0, t: 0 }, Reading: { c: 0, t: 0 }, Writing: { c: 0, t: 0 }, Speaking: { c: 0, t: 0 } };
    DATA.diagnostic.forEach((q, idx) => {
      const raw = fd.get('diag_' + idx);
      if (raw !== null) answeredAny = true;
      const ans = raw !== null ? Number(raw) : -1;
      bySkill[q.skill].t++;
      if (ans === q.a) {
        totalCorrect++;
        bySkill[q.skill].c++;
      }
    });
    if (!answeredAny) {
      toast('Jawab minimal beberapa soal atau klik "Isi Cepat & Lihat Contoh Hasil" di kanan atas.');
      document.getElementById('diag-q-0')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const skillScores = {};
    const skillBands = {};
    let weakestSkill = 'Reading';
    let lowestPct = 101;
    SKILLS.forEach(s => {
      const pct = Math.round((bySkill[s].c / (bySkill[s].t || 1)) * 100);
      skillScores[s] = pct;
      skillBands[s] = pctToBand(pct).toFixed(1);
      if (pct < lowestPct) { lowestPct = pct; weakestSkill = s; }
    });
    const overall = roundBand(SKILLS.reduce((acc, s) => acc + parseFloat(skillBands[s]), 0) / 4);
    state.diagnosticResult = {
      date: new Date().toISOString(),
      correct: totalCorrect,
      total: DATA.diagnostic.length,
      skillScores,
      skillBands,
      overall,
      weakestSkill
    };
    addHistoryRecord({
      skill: 'Reading',
      title: 'Diagnostic Assessment (4-Skill Baseline)',
      correct: totalCorrect,
      total: DATA.diagnostic.length,
      band: overall,
      minutes: 10
    });
    save();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast(`Diagnostic selesai! Estimasi Band Awal: ${overall}`);
  } else if (form.id === 'speaking-score-form') {
    const pkgId = form.dataset.pkgId;
    const pk = allPackages().find(p => p.id === pkgId);
    const fd = new FormData(form);
    const avg = (parseFloat(fd.get('fc')) + parseFloat(fd.get('lr')) + parseFloat(fd.get('gra')) + parseFloat(fd.get('pr'))) / 4;
    const band = roundBand(avg);
    addHistoryRecord({
      pkgId: pk.id,
      skill: 'Speaking',
      title: `Paket #${pk.num}: ${pk.title}`,
      band,
      minutes: Math.max(2, Math.round(recordSeconds / 60) || 10)
    });
    toast(`Skor Speaking Paket #${pk.num} disimpan (Band ${band})!`);
    navigate('analytics');
  } else if (form.id === 'custom-pkg-form') {
    const fd = new FormData(form);
    const title = String(fd.get('title') || '').trim();
    const content = String(fd.get('content') || '').trim();
    if (!title || !content) {
      toast('Mohon isi Judul Paket dan Teks Bacaan / Prompt terlebih dahulu.');
      return;
    }
    const skill = fd.get('skill');
    const num = allPackages().length + 1;
    const id = 'pkg-custom-' + Date.now().toString(36);
    const newPkg = {
      id,
      num,
      skill,
      book: fd.get('book') || 'Custom Practice',
      source: 'Custom User Package',
      title,
      subtitle: `${skill} Custom Practice Package`,
      minutes: Number(fd.get('minutes') || 20)
    };
    if (skill === 'Reading') {
      newPkg.passage = content;
      newPkg.questions = [
        { q: fd.get('q1') || 'Does the main idea of the passage match its title?', options: ['TRUE', 'FALSE', 'NOT GIVEN'], a: 0, why: 'Custom reading verification question.' }
      ];
    } else {
      newPkg.type = 'task2';
      newPkg.minWords = 250;
      newPkg.prompt = content;
      newPkg.modelBand = '8.0 (Custom Reference)';
      newPkg.modelAnswer = fd.get('q1') || 'Pastikan esai memiliki Introduction, 2 Body Paragraphs, dan Conclusion.';
      newPkg.examinerNotes = 'Custom Writing Prompt.';
    }
    state.customPackages.push(newPkg);
    save();
    render();
    toast(`Paket #${num} (${title}) berhasil ditambahkan!`);
  } else if (form.id === 'profile-form') {
    const fd = new FormData(form);
    const obj = Object.fromEntries(fd);
    if (!String(obj.name || '').trim()) obj.name = 'Scholar';
    state.profile = { ...state.profile, ...obj };
    save();
    toast('Profil dan Target Band berhasil diperbarui!');
    navigate('dashboard');
  }
});

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function playAudioChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.14);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.32);
    setTimeout(() => { try { ctx.close(); } catch {} }, 450);
  } catch {}
}

function stopSpeakingPlayback() {
  isPlayingRecording = false;
  if (activeAudioPlayback) {
    try { activeAudioPlayback.pause(); activeAudioPlayback.currentTime = 0; } catch {}
    activeAudioPlayback = null;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch {}
  }
  const st = document.getElementById('record-status');
  if (st) st.textContent = '⏹ Pemutaran rekaman selesai / dihentikan.';
}

function playRecordedSpeaking(pkgId, forceModel = false) {
  stopSpeakingPlayback();
  const pk = allPackages().find(p => p.id === pkgId);
  const st = document.getElementById('record-status');
  const out = document.getElementById('record-output');

  const url = recordedUrlsByPkg[pkgId] || recordUrl;
  if (!forceModel && url) {
    const playerEl = document.getElementById('speaking-audio-player');
    if (playerEl) {
      playerEl.currentTime = 0;
      playerEl.play().then(() => {
        isPlayingRecording = true;
        if (st) st.textContent = '🔊 Memutar hasil rekaman suara mikrofon Anda...';
        toast('Memutar hasil rekaman suara Anda!');
      }).catch(() => {});
      activeAudioPlayback = playerEl;
      return;
    }
    const audio = new Audio(url);
    activeAudioPlayback = audio;
    isPlayingRecording = true;
    if (st) st.textContent = '🔊 Memutar hasil rekaman suara mikrofon Anda...';
    toast('Memutar hasil rekaman suara Anda!');
    audio.onended = () => {
      isPlayingRecording = false;
      if (st) st.textContent = '✓ Pemutaran rekaman suara Anda selesai.';
    };
    audio.play().catch(() => {});
    return;
  }

  playAudioChime();
  const userNotes = (state.speakingNotes[pkgId] || '').trim();
  const rawScript = (!forceModel && userNotes.length > 5)
    ? userNotes
    : (pk?.modelResponse || 'Speaking response playback ready.').replace(/\[.*?\]/g, '').replace(/"/g, '').trim();

  const label = (!forceModel && userNotes.length > 5)
    ? 'Rekaman Catatan / Transkrip Latihan Anda'
    : 'Rekaman Simulasi / Band 8.0 Speaking Response';

  isPlayingRecording = true;
  if (st) st.textContent = `🔊 Sedang memutar: ${label}...`;
  if (out && !url) {
    out.innerHTML = `<div class="notice"><strong>🎧 Memutar ${esc(label)}:</strong><br><em>"${esc(rawScript.slice(0, 220))}${rawScript.length > 220 ? '...' : ''}"</em></div>`;
  }
  toast(`Memutar audio: ${label}`);

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const sentences = rawScript.match(/[^.!?]+[.!?]*/g) || [rawScript];
      let sIdx = 0;
      const speakNext = () => {
        if (!isPlayingRecording || sIdx >= sentences.length) {
          isPlayingRecording = false;
          if (st) st.textContent = '✓ Pemutaran rekaman selesai.';
          return;
        }
        const u = new SpeechSynthesisUtterance(sentences[sIdx].trim());
        u.lang = 'en-GB';
        u.rate = 0.96;
        u.onend = () => { sIdx++; speakNext(); };
        u.onerror = () => { isPlayingRecording = false; };
        window.speechSynthesis.speak(u);
      };
      speakNext();
    } catch {}
  }
}

async function startVoiceRecording(pkgId) {
  stopSpeakingPlayback();
  recordSeconds = 0;
  isSimRecording = true;
  clearInterval(recordInterval);

  const updateRecUI = (statusMsg, recording) => {
    const circle = document.getElementById('record-circle');
    const rBtn = document.getElementById('record-btn');
    const sBtn = document.getElementById('stop-btn');
    const st = document.getElementById('record-status');
    if (circle) circle.classList.toggle('recording', recording);
    if (rBtn) rBtn.disabled = recording;
    if (sBtn) sBtn.disabled = !recording;
    if (st) st.textContent = statusMsg;
  };

  if (navigator.mediaDevices?.getUserMedia && window.MediaRecorder) {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      recorder = new MediaRecorder(mediaStream);
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        clearInterval(recordInterval);
        isSimRecording = false;
        mediaStream?.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const newUrl = URL.createObjectURL(blob);
        recordUrl = newUrl;
        if (pkgId) {
          recordedUrlsByPkg[pkgId] = newUrl;
          recordedDurationsByPkg[pkgId] = recordSeconds;
        }
        const out = document.getElementById('record-output');
        if (out) {
          out.innerHTML = `
            <div style="background:var(--bg-subtle);padding:12px;border-radius:10px;border:1px solid var(--line)">
              <div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--brand)">🎧 Pemutar Rekaman Suara Anda (${formatTime(recordSeconds)}):</div>
              <audio id="speaking-audio-player" controls src="${newUrl}" style="width:100%;margin-bottom:8px"></audio>
              <div><a class="btn ghost small" download="astra-speaking-practice.webm" href="${newUrl}">Unduh Rekaman Audio</a></div>
            </div>`;
        }
        updateRecUI('✓ Rekaman selesai! Klik "Play Recording (Dengarkan)" untuk langsung memutar suara Anda.', false);
        toast('Rekaman selesai! Klik "Play Recording (Dengarkan)" untuk mendengarkan.');
      };
      recorder.start();
      updateRecUI('🔴 Sedang merekam mikrofon Anda... Klik Stop setelah selesai.', true);
      recordInterval = setInterval(() => {
        recordSeconds++;
        const tEl = document.getElementById('record-time');
        if (tEl) tEl.textContent = formatTime(recordSeconds);
        if (recordSeconds >= 180 && recorder?.state === 'recording') stopVoiceRecording(pkgId);
      }, 1000);
      return;
    } catch {}
  }

  playAudioChime();
  updateRecUI('🔴 Sedang merekam sesi latihan Speaking Anda... Klik Stop setelah selesai.', true);
  toast('Perekaman sesi Speaking dimulai! Tekan Stop lalu Play Recording untuk mendengarkan.');
  recordInterval = setInterval(() => {
    recordSeconds++;
    const tEl = document.getElementById('record-time');
    if (tEl) tEl.textContent = formatTime(recordSeconds);
  }, 1000);
}

function stopVoiceRecording(pkgId) {
  clearInterval(recordInterval);
  if (recorder && recorder.state === 'recording') {
    try { recorder.stop(); return; } catch {}
  }
  isSimRecording = false;
  if (pkgId) recordedDurationsByPkg[pkgId] = recordSeconds;
  const circle = document.getElementById('record-circle');
  const rBtn = document.getElementById('record-btn');
  const sBtn = document.getElementById('stop-btn');
  const st = document.getElementById('record-status');
  const out = document.getElementById('record-output');
  if (circle) circle.classList.remove('recording');
  if (rBtn) rBtn.disabled = false;
  if (sBtn) sBtn.disabled = true;
  if (st) st.textContent = `✓ Rekaman ${formatTime(recordSeconds)} selesai! Klik tombol "Play Recording (Dengarkan)" di atas untuk mendengarkan.`;
  if (out) {
    out.innerHTML = `<div class="notice">✓ Sesi berbicara (<strong>${formatTime(recordSeconds)}</strong>) siap diputar! Klik <strong>Play Recording (Dengarkan)</strong> di atas untuk langsung mendengarkan hasil latihan Anda.</div>`;
  }
  toast(`Rekaman (${formatTime(recordSeconds)}) selesai! Klik Play Recording untuk mendengarkan.`);
}

render();
})();
</script>
