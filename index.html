, "Do you think children should learn to play a musical instrument at school?", "How easy would it be to learn to play an instrument without a teacher? [Why?]"], "part2": {"topic": "Describe something healthy you enjoy doing.", "bullets": ["what you do", "where you do it", "who you do it with", "and explain why you think doing this is healthy."]}, "part3": ["What do most people do to keep fit in your country?", "How important is it for people to do some regular physical exercise?", "Why do some people think that modern lifestyles are not healthy?", "Should individuals or governments be responsible for making people's lifestyle healthy?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"One healthy habit I genuinely look forward to every week is early-morning cycling around the coastal park near my home. I started doing this about two years ago because I was spending far too many hours sitting in front of a laptop.\n\nUsually, I ride along a dedicated 15-kilometre bike lane that winds through a tree-lined park and overlooks the beach. On weekdays I tend to go on my own at around six in the morning when the air is crisp and the roads are quiet, whereas on Saturday mornings I meet up with two close friends from university, and we grab coffee together afterwards.\n\nI consider this activity tremendously beneficial for both physical and mental well-being. Physically, it's a low-impact cardiovascular workout that builds stamina and leg strength without putting excessive strain on my joints. Mentally, being outdoors in natural light before checking my phone clears my head and lowers my stress levels for the entire day.\" "}, {"id": "pkg-s2", "num": 70, "skill": "Speaking", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Speaking Parts 1–3", "title": "Games, Open-Air Markets & Shopping Habits", "subtitle": "Part 1: Games · Part 2: An open-air or street market · Part 3: Markets vs shops & advertising", "minutes": 14, "part1": ["What games are popular in your country? [Why?]", "Do you play any games? [Why/Why not?]", "How do people learn to play games in your country?", "Do you think it's important for people to play games? [Why/Why not?]"], "part2": {"topic": "Describe an open-air or street market which you enjoyed visiting.", "bullets": ["where the market is", "what the market sells", "how big the market is", "and explain why you enjoyed visiting this market."]}, "part3": ["Do people in your country enjoy going to open-air markets that sell things like food or clothes or old objects? Which type of market is more popular? Why?", "Do you think young people feel the same about shopping at markets as older people? Why is that?", "What do you think are the advantages of buying things from shops rather than markets?", "How does advertising influence what people choose to buy? Is this true for everyone?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"I'd love to talk about the Sunday farmers' and street market in Bukittinggi, West Sumatra, which I visited a few months ago. It's located right in the heart of the highland town, stretching across several bustling streets near the historic clock tower.\n\nIt's a sprawling market with hundreds of colourful stalls under canvas tarpaulins. One section is devoted to fresh highland produce — everything from ripe avocados and cinnamon bark to freshly ground coffee — while another section sells traditional woven textiles, brassware, and sizzling street food.\n\nWhat made the visit so memorable was the vibrant sensory atmosphere. Unlike a sterile supermarket where everything is wrapped in plastic, you can chat directly with the local farmers, sample warm traditional snacks, and bargain good-naturedly with the vendors. It felt like a genuine community gathering rather than just a commercial transaction.\" "}, {"id": "pkg-s3", "num": 71, "skill": "Speaking", "book": "Cambridge 9", "source": "Cam 9 · Test 4 · Speaking Parts 1–3", "title": "Bicycles, Helping People & Community Services", "subtitle": "Part 1: Bicycles · Part 2: A person who has helped people · Part 3: Community support", "minutes": 14, "part1": ["How popular are bicycles in your home town? [Why?]", "How often do you ride a bicycle? [Why/Why not?]", "Do you think that bicycles are suitable for all ages? [Why/Why not?]", "What are the advantages of a bicycle compared to a car? [Why?]"], "part2": {"topic": "Describe a person who has done a lot of work to help people.", "bullets": ["who this person is/was", "where this person lives/lived", "what he/she has done to help people", "and explain how you know about this person."]}, "part3": ["What are some of the ways people can help others in the community? Which is most important?", "Why do you think some people like to help other people?", "Some people say that people help others in the community more now than they did in the past. Do you agree or disagree? Why?", "Who do you think should pay for the services that are available to the people in a community? Should it be the government or individual people?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"A person I deeply admire for her dedication to helping others is Dr. Rini, a retired paediatrician who lives in my neighbourhood. I first got to know her when I volunteered at a community literacy event three years ago.\n\nInstead of simply enjoying a quiet retirement, she converted the garage of her home into a free weekend clinic and reading corner for low-income families in our district. Every Saturday morning, she provides basic health check-ups and nutritional advice for young mothers, and in the afternoon she coordinates university volunteers to tutor primary school children in reading and mathematics.\n\nWhat strikes me most about her work is its consistency and humility. She never seeks publicity; she simply saw a gap in local public services and took practical action to bridge it, improving dozens of children's health and educational confidence.\" "}, {"id": "pkg-s4", "num": 72, "skill": "Speaking", "book": "Cambridge 13", "source": "Cam 13 · Test 2 · Speaking Parts 1–3", "title": "Age, New Technological Devices & Digital Society", "subtitle": "Part 1: Age · Part 2: Starting to use a new tech device · Part 3: Technology in education & society", "minutes": 14, "part1": ["Are you happy to be the age you are now? [Why/Why not?]", "When you were a child, did you think a lot about your future? [Why/Why not?]", "Do you think you have changed as you have got older? [Why/Why not?]", "What will be different about your life in the future? [Why?]"], "part2": {"topic": "Describe a time when you started using a new technological device (e.g. a new computer or phone).", "bullets": ["what device you started using", "why you started using this device", "how easy or difficult it was to use", "and explain how helpful this device was to you."]}, "part3": ["What is the best age for children to start computer lessons?", "Do you think that schools should use more technology to help children learn?", "Do you agree or disagree that computers will replace teachers one day?", "Could you suggest some reasons why some people are deciding to reduce their use of technology?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"About a year ago, I started using an e-ink digital tablet with a stylus specifically for reading academic PDFs and taking handwritten study notes. I decided to invest in it because I was preparing for my exams and my desk was overflowing with printed Cambridge past papers and notebooks.\n\nAt first, there was a slight learning curve in organising folders and getting used to the palm-rejection feature on the screen, which took me two or three days to master. However, once I customized the templates, it became second nature.\n\nIt has been remarkably helpful for my productivity. Because the screen has no backlight and blocks social media notifications, I can read dense articles for hours without eye strain or distraction, and all my annotations are searchable in one place.\" "}, {"id": "pkg-s5", "num": 73, "skill": "Speaking", "book": "Cambridge 5", "source": "Cam 5 · Test 1 · Speaking Parts 1–3", "title": "Hometown, Famous Person You Admire & Celebrity Culture", "subtitle": "Part 1: Hometown · Part 2: A famous person you would like to meet · Part 3: Fame & privacy", "minutes": 14, "part1": ["Let's talk about your home town or village. What kind of place is it?", "What's the most interesting part of your town/village?", "What kind of jobs do the people in your town/village do?", "Would you say it's a good place to live? [Why?]"], "part2": {"topic": "Describe a famous person you would like to meet.", "bullets": ["who the person is", "why this person is famous", "what you would do if you met this person", "and explain why you would like to meet this person."]}, "part3": ["Under what circumstances do people become famous in your country?", "What are the differences between the people who were famous a few decades ago and those who are famous today?", "Do you think famous people have a right to privacy, or is media intrusion part of the price of fame?", "Why do you think young people are so influenced by celebrities?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"A famous public figure I would love to meet in person is Sir David Attenborough, the renowned British natural historian and documentary broadcaster. For more than six decades, his voice has brought the wonders of the natural world into millions of living rooms through landmark series like Planet Earth and Blue Planet.\n\nIf I ever had the privilege of meeting him over a cup of tea, I would ask him about his memories of filming uncontacted wildlife in the 1950s and how we can communicate environmental urgency to younger generations without causing despair.\n\nI admire him deeply because he combines scientific rigour with poetic storytelling. Even in his nineties, he remains tirelessly committed to biodiversity conservation and climate awareness.\" "}, {"id": "pkg-s6", "num": 74, "skill": "Speaking", "book": "Cambridge 5", "source": "Cam 5 · Test 2 · Speaking Parts 1–3", "title": "Colours, Memorable Song & The Music Industry", "subtitle": "Part 1: Colours · Part 2: A song or piece of music you like · Part 3: Music in society", "minutes": 14, "part1": ["What's your favourite colour? [Why?]", "Do you like the same colours now as you did when you were younger? [Why/Why not?]", "What can you learn about a person from the colours they like?", "Do any colours have a special meaning in your culture?"], "part2": {"topic": "Describe a song or a piece of music you like.", "bullets": ["what the song or music is", "what kind of song or music it is", "where you first heard it", "and explain why you like it."]}, "part3": ["Is music an important subject in schools in your country?", "How do the musical tastes of young people differ from those of older generations?", "In what ways are supermarkets, restaurants, and airports using background music to influence people?", "How has digital streaming changed the way musicians earn a living?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"One piece of music that holds a very special place in my life is 'Clair de Lune' by the French composer Claude Debussy. It is an impressionist solo piano composition written in the late nineteenth century, characterized by gentle, flowing arpeggios and a dreamy, contemplative melody.\n\nI first heard it when I was fifteen, sitting in my school auditorium while a senior student rehearsed for an evening recital. The hall was completely quiet, and the music seemed to suspend time.\n\nWhenever I feel overwhelmed by exam preparation or tight deadlines, putting on headphones and listening to this five-minute piece instantly lowers my stress levels and restores my focus.\" "}, {"id": "pkg-s7", "num": 75, "skill": "Speaking", "book": "Cambridge 5", "source": "Cam 5 · Test 4 · Speaking Parts 1–3", "title": "Clothes, National Festivals & Preserving Cultural Traditions", "subtitle": "Part 1: Clothes · Part 2: An important festival in your country · Part 3: Globalization & traditions", "minutes": 14, "part1": ["How important are clothes and fashion to you? [Why/Why not?]", "What kind of clothes do you dislike? [Why?]", "How different are the clothes you wear now from those you wore 10 years ago?", "What do you think the clothes we wear say about us?"], "part2": {"topic": "Describe an important festival that is celebrated in your country.", "bullets": ["when the festival takes place", "what people do during this festival", "what special food or clothes are associated with it", "and explain why this festival is important in your country."]}, "part3": ["Do you think traditional festivals are losing their original meaning in modern society?", "Why is it important for communities to preserve their cultural heritage and customs?", "Are international celebrations replacing local festivals among young people?", "Should governments spend public money on public festivals and cultural events?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"The most cherished celebration in Indonesia is Idul Fitri, or Lebaran, which marks the culmination of the fasting month of Ramadan. Every year, tens of millions of people participate in 'mudik'—travelling back to their ancestral hometowns to reunite with parents and extended family.\n\nDuring the festival, families wear freshly tailored modest attire, visit neighbours to ask for forgiveness for any past misunderstandings, and share iconic dishes such as ketupat rice cakes simmered with rich beef rendang and opor ayam.\n\nIt is deeply meaningful because in our fast-paced urban lives, Lebaran serves as an annual anchor of gratitude, generosity, and family reconciliation.\" "}, {"id": "pkg-s8", "num": 76, "skill": "Speaking", "book": "Cambridge 7", "source": "Cam 7 · Test 1 · Speaking Parts 1–3", "title": "Transport, Memorable Party/Celebration & Family Gatherings", "subtitle": "Part 1: Daily transport · Part 2: A party you enjoyed · Part 3: Family & national celebrations", "minutes": 14, "part1": ["How did you come here today?", "What is the most popular form of public transport in your town?", "How could public transport in your area be improved?", "Do you prefer travelling by train or by bus on long journeys? [Why?]"], "part2": {"topic": "Describe a party or celebration that you enjoyed.", "bullets": ["what the party or celebration was for", "where it took place and who was there", "what you did at the party", "and explain why you enjoyed it so much."]}, "part3": ["What are the main reasons why people organize family parties in your culture?", "Do some people spend too much money on weddings and birthday celebrations nowadays?", "How do national celebrations help create a sense of unity in a country?", "Why do some people dislike crowded social gatherings?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"A celebration I remember fondly was a surprise golden wedding anniversary dinner that my cousins and I organized for my grandparents two summers ago. We booked a cosy garden pavilion at a traditional restaurant overlooking the hills and invited forty close relatives and lifelong neighbours.\n\nInstead of formal speeches, we projected digitized photographs from their wedding in the 1970s onto a screen and played acoustic songs from their youth. My grandfather was so moved that he told stories none of us grandchildren had ever heard before.\n\nWhat made the evening unforgettable was the genuine warmth and cross-generational connection—everyone put their phones away and simply celebrated five decades of resilience and family love.\" "}, {"id": "pkg-s9", "num": 77, "skill": "Speaking", "book": "Cambridge 7", "source": "Cam 7 · Test 3 · Speaking Parts 1–3", "title": "Weather, Educational TV Programme & Media Influence", "subtitle": "Part 1: Weather & seasons · Part 2: An educational TV programme · Part 3: Television vs online learning", "minutes": 14, "part1": ["What's the weather like in your country at different times of the year?", "Which season do you like best? [Why?]", "Do you usually pay attention to the weather forecast?", "Does the weather affect your mood or daily activities?"], "part2": {"topic": "Describe an educational television programme or documentary that you found interesting.", "bullets": ["what the programme was about", "when and where you watched it", "what you learned from it", "and explain why you found it so interesting."]}, "part3": ["How popular are educational documentaries compared with entertainment shows in your country?", "In what ways can visual media make complex scientific topics easier for children to grasp?", "Do you think online video platforms have improved the quality of self-study?", "Should governments regulate the amount of advertising shown during children's programmes?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"An educational documentary series that completely captivated me was 'Cosmos: A Spacetime Odyssey', hosted by astrophysicist Neil deGrasse Tyson. I watched it on my laptop over a rainy weekend last year when I was curious about the history of astronomy.\n\nOne episode traced how seventeenth-century scientists like Edmond Halley and Isaac Newton overcame superstition to calculate the orbits of comets and the laws of gravity. Through vivid animation and clear analogies, it explained concepts like the speed of light and stellar evolution without overwhelming jargon.\n\nI found it fascinating because it showed science not as a dry list of formulas, but as a thrilling human detective story driven by curiosity and courage.\" "}, {"id": "pkg-s10", "num": 78, "skill": "Speaking", "book": "Cambridge 8", "source": "Cam 8 · Test 1 · Speaking Parts 1–3", "title": "Neighbours, An Exhibition/Museum You Visited & Public Art", "subtitle": "Part 1: Neighbours · Part 2: An interesting exhibition · Part 3: Museums & gallery admission", "minutes": 14, "part1": ["How well do you know the people who live next door to you?", "How often do you see them?", "What kinds of problems can people sometimes have with their neighbours?", "How do you think neighbours can help each other?"], "part2": {"topic": "Describe an interesting exhibition or museum that you have visited.", "bullets": ["where the exhibition or museum was", "what was on display", "who you went with", "and explain why you found the exhibition interesting."]}, "part3": ["Should admission to national museums and art galleries be free for everyone?", "How can museums make historical exhibits more interactive and engaging for young children?", "Do you think virtual online museum tours will ever replace visiting physical galleries?", "Why do cities invest in public sculptures and architecture?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"Last year, I visited a fascinating maritime and spice-trade exhibition at the National Museum in Jakarta with two university friends. The exhibition showcased centuries-old navigational astrolabes, ancient maps of the Indonesian archipelago, ceramic cargo recovered from shipwrecks, and aromatic jars of nutmeg, cloves, and cinnamon.\n\nWhat made the exhibition truly memorable was its interactive design: visitors could smell the raw spices, listen to audio diaries of sixteenth-century sailors, and trace how trade routes connected Southeast Asia with Venice and Amsterdam.\n\nIt brought history alive in a tangible way, helping me appreciate how geography and botanical resources shaped global civilization.\" "}, {"id": "pkg-s11", "num": 79, "skill": "Speaking", "book": "Cambridge 8", "source": "Cam 8 · Test 2 · Speaking Parts 1–3", "title": "Newspapers/Magazines, A Childhood Friend & Social Media Friendships", "subtitle": "Part 1: Reading news · Part 2: A friend you knew as a child · Part 3: Maintaining friendships", "minutes": 14, "part1": ["Which magazines and newspapers do you read regularly? [Why?]", "What kind of articles are you most interested in?", "Have you ever read a newspaper or magazine in a foreign language?", "Do you think reading news in a foreign language is a good way to learn it?"], "part2": {"topic": "Describe a friend who you remember from your childhood.", "bullets": ["who the person was", "how you knew this person", "what you used to do together", "and explain why you remember this friend so well."]}, "part3": ["Do you think childhood friendships are stronger than friendships formed in adulthood?", "How have social media and messaging apps affected the quality of modern friendships?", "Why do people sometimes drift apart from old friends as they get older?", "What qualities are most important in a long-lasting friendship?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"A childhood friend I remember vividly is Fajar, who lived three houses down from me when we were in primary school. We met on the very first day of grade one because we both wore the exact same oversized backpack and ended up sharing a desk.\n\nEvery afternoon after school, we would ride our bicycles around the neighbourhood, build makeshift treehouses, and trade comic books. Whenever I struggled with mathematics homework, Fajar had a patient, humorous way of explaining fractions using marbles.\n\nAlthough his family moved to another province when we were twelve, I still remember him fondly because his loyalty and sense of adventure made my early school years joyful.\" "}, {"id": "pkg-s12", "num": 80, "skill": "Speaking", "book": "Cambridge 8", "source": "Cam 8 · Test 4 · Speaking Parts 1–3", "title": "Daily Routine, A Successful Small Business & Entrepreneurship", "subtitle": "Part 1: Daily routine · Part 2: A successful small business you know · Part 3: Small vs large companies", "minutes": 14, "part1": ["What is your favourite time of the day? [Why?]", "What do you usually do at that time?", "Do you follow the same routine every day of the week?", "If you could change one thing about your daily routine, what would it be?"], "part2": {"topic": "Describe a small business that you know and think is successful.", "bullets": ["what the business is", "where it is located", "who runs the business and how you know about it", "and explain why you think this small business is so successful."]}, "part3": ["What are the main challenges faced by people starting a small business today?", "How can local independent shops compete with giant supermarket chains and e-commerce platforms?", "What personal qualities does an entrepreneur need to succeed?", "Would you prefer to run your own business or work for a large organization?"], "modelResponse": "[Part 2 Band 8.0 Model Script]\n\"A thriving small business in my city that I really admire is 'Kopi Pustaka', an independent specialty coffee roastery and quiet study café located a ten-minute walk from the university campus. It was founded four years ago by a young couple who used to work as agricultural engineers.\n\nThey source Arabica beans directly from smallholder farmers in West Sumatra and roast them in small batches on-site. Half of the shop is a lively espresso bar, while the back room is a silent reading lounge equipped with power outlets and reference books.\n\nI believe it succeeds despite competition from big chains because of its authentic product quality, fair partnerships with local farmers, and deep understanding of what students and remote workers actually need.\" "}], "diagnostic": [{"skill": "Listening", "q": "[Audio Context: 'We initially advertised Tuesday 12th, but the workshop has been moved to Thursday 14th at 6.30 pm.'] On which day will the workshop take place?", "options": ["Tuesday", "Thursday", "Saturday"], "a": 1, "why": "Speaker corrects the initial Tuesday advertisement to Thursday."}, {"skill": "Listening", "q": "[Audio Context: 'Full membership is $260 including races, whereas Recreational is $108. Both include $20 club fee and insurance.'] What is included in both memberships?", "options": ["Race entry fees", "Club fee and insurance", "Free cycling kit"], "a": 1, "why": "Both membership tiers include the $20 club fee and accident insurance."}, {"skill": "Listening", "q": "[Audio Context: 'In 1623, the ruler of Constantinople demanded the destruction of all coffee houses, though new ones opened after his death.'] What happened in 1623?", "options": ["Coffee was approved as medicine", "Coffee houses were ordered to be destroyed", "Coffee plantations opened in Java"], "a": 1, "why": "The ruler ordered the destruction of all coffee houses in 1623."}, {"skill": "Reading", "q": "Passage: 'At the turn of the 20th century, international commerce was dominated by raw materials such as wheat and iron ore, which were heavy and costly to transport. Today, finished manufactured products with lightweight components dominate.' Statement: 'Transporting goods today requires more shipping capacity per dollar of value than in 1900.'", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Contradicts the passage: lightweight manufactured goods require LESS transportation for every dollar's worth of trade."}, {"skill": "Reading", "q": "Passage: 'In 1891 Marie Curie went to Paris to study at the Sorbonne, financed by her sister Bronia, whom Marie had previously supported through medical school.' Statement: 'Marie Curie studied medicine at the Sorbonne.'", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Bronia studied medicine; Marie studied physical and mathematical sciences at the Sorbonne."}, {"skill": "Reading", "q": "Passage: 'While seven-month-old infants responded to all speech sounds regardless of language, the brains of eleven-month-old infants worked harder at motor activations of non-native sounds.' What did the study show about older infants?", "options": ["They ignored non-native sounds completely", "Their brains distinguished between native and non-native speech sounds", "They could already speak two languages fluently"], "a": 1, "why": "Older infants' brains worked harder on non-native sounds compared to native sounds."}, {"skill": "Reading", "q": "Passage: 'More than a third of the world's soil is endangered. Microorganisms within soil digest dead plants and lock in carbon content, holding three times the amount of carbon as does the entire atmosphere.' Why is soil an ally against climate change?", "options": ["It reflects sunlight back into space", "Its microorganisms store three times more carbon than the atmosphere", "It prevents chemical fertilisers from evaporating"], "a": 1, "why": "Soil microorganisms lock in carbon, holding three times the carbon of the atmosphere."}, {"skill": "Writing", "q": "Which of the following is the best Overview sentence for an Academic Task 1 map showing an island before and after resort construction?", "options": ["In my opinion, building huts on the island ruined its natural beauty for local fishermen.", "Overall, the previously uninhabited island was transformed into a tourist resort with accommodation, dining facilities, and a pier, while its eastern tip remained natural.", "First, there are six huts on the left and nine huts in the middle of the map."], "a": 1, "why": "An effective overview summarises the main transformation without personal opinion or micro-listing."}, {"skill": "Writing", "q": "In a Task 2 essay ('Do the advantages outweigh the disadvantages?'), which approach scores highest on Task Response?", "options": ["Only discussing the advantages in detail and ignoring disadvantages", "Examining both advantages and disadvantages, while making a clear, reasoned judgement on which side is stronger", "Listing 10 bullet points without paragraphs"], "a": 1, "why": "The prompt requires weighing both sides and demonstrating clearly why one outweighs the other."}, {"skill": "Speaking", "q": "When the examiner asks a Part 3 question ('Why do some people prefer shopping at open-air markets?'), which response strategy is strongest?", "options": ["Answering in two words: 'It's cheaper.'", "Generalising about consumer groups, contrasting freshness/social atmosphere with supermarket convenience, and giving an example", "Repeating your Part 2 story word for word"], "a": 1, "why": "Part 3 assesses the ability to discuss abstract ideas, compare perspectives, and justify opinions."}, {"skill": "Writing", "q": "Choose the grammatically accurate complex sentence suitable for Band 7.5+ Writing:", "options": ["Although public transport requires substantial initial investment, it significantly reduces urban congestion and carbon emissions in the long run.", "Although public transport requires substantial initial investment, but it reduces urban congestion.", "Public transport is good, it reduces traffic jams every day."], "a": 0, "why": "'Although' cannot be paired with 'but' in the same sentence, and option C is a comma splice."}, {"skill": "Speaking", "q": "In Speaking Part 2 (1–2 minute long turn), what should you do if you finish covering the four bullet points after 65 seconds?", "options": ["Stop talking immediately and stare at the examiner", "Elaborate on the final bullet point with a specific memory, example, or future reflection until the examiner stops you", "Ask the examiner if your grammar was good"], "a": 1, "why": "Speaking for the full 1.5–2 minutes by extending with examples or reflections demonstrates strong fluency and coherence."}], "coach": [{"q": "Bagaimana cara membedakan FALSE dan NOT GIVEN di Reading?", "tag": "Reading", "a": "Gunakan uji kontradiksi: Jika Anda bisa menunjuk satu kalimat di teks yang membantah langsung pernyataan soal (misal teks bilang 'hanya di musim panas', soal bilang 'sepanjang tahun'), jawabannya FALSE. Jika teks tidak menyebutkan informasi pembandingnya sama sekali (misal teks bilang 'Perkin masuk Royal College usia 15', soal bilang 'Faraday yang menyarankan Perkin masuk Royal College'), jawabannya NOT GIVEN."}, {"q": "Bagaimana rumus menghitung Overall Band Score IELTS?", "tag": "Band Score", "a": "Rata-rata dari 4 komponen (Listening + Reading + Writing + Speaking dibagi 4) dibulatkan ke 0.5 terdekat:\n• .00 s/d .24 → turun ke .0 (contoh: 6.125 → 6.0)\n• .25 s/d .74 → menjadi .5 (contoh: 6.25 → 6.5, 6.625 → 6.5)\n• .75 s/d .99 → naik ke .0 berikutnya (contoh: 6.75 → 7.0).\nUntuk Listening & Academic Reading (40 soal): 16=5.0, 23=6.0, 27=6.5, 30=7.0, 33=7.5, 35=8.0, 37=8.5, 39=9.0."}, {"q": "Bagaimana struktur ideal Writing Task 2 agar dapat Band 7.0+?", "tag": "Writing", "a": "Gunakan 4 paragraf (260–310 kata):\n1. Introduction (2 kalimat): Parafrase topik + Thesis Statement yang menjawab pertanyaan secara eksplisit.\n2. Body Paragraph 1 (5 kalimat): Topic sentence (argumen 1) → Penjelasan sebab-akibat → Contoh spesifik → Kalimat penutup yang mengaitkan ke topik.\n3. Body Paragraph 2 (5 kalimat): Topic sentence (argumen 2 atau pandangan lawan + sanggahan) → Penjelasan mendalam → Contoh konkret.\n4. Conclusion (1–2 kalimat): Rangkum posisi utama dengan kata-kata berbeda ('In conclusion, while..., I contend that...')."}, {"q": "Apa yang harus ditulis pada 1 menit persiapan Speaking Part 2 (Cue Card)?", "tag": "Speaking", "a": "Jangan pernah menulis kalimat penuh! Buat 4 kuadran di kertas buram:\n1. WHO/WHAT & WHERE (2–3 kata kunci + 2 adjective tingkat lanjut, misal 'sprawling highland market').\n2. PAST STORY (Kapan pertama kali ke sana / latar belakang singkat menggunakan Past Tense).\n3. PRESENT DETAILS (Apa yang dilihat, didengar, dirasakan).\n4. WHY / FEELING (Mengapa berkesan + idiom alami seperti 'a breath of fresh air' atau 'second nature')."}, {"q": "Bagaimana cara mengatasi kehabisan waktu di Reading (60 menit untuk 3 Passage)?", "tag": "Reading", "a": "Bagi waktu dengan disiplin ketat: 15 menit untuk Passage 1 (paling mudah), 20 menit untuk Passage 2, dan 25 menit untuk Passage 3 (paling kompleks). Jangan membaca seluruh teks dari awal sampai akhir sebelum melihat soal! Baca judul → lihat jenis soal → lakukan skimming/scanning paralel sambil menjawab soal yang berurutan (seperti T/F/NG dan Note Completion) terlebih dahulu."}, {"q": "Bagaimana cara menulis Overview untuk Map Comparison di Writing Task 1?", "tag": "Writing", "a": "Lihat perubahan makro dari peta pertama ke peta kedua: Apakah pulau/area berubah dari 'undeveloped/rural' menjadi 'commercial tourist resort'? Apakah akses jalan ditingkatkan kapasitasnya? Apakah ada area yang tetap alami ('remained untouched')? Tulis 2 kalimat di paragraf kedua yang merangkum perubahan terbesar tersebut tanpa menyebutkan detail mikro."}, {"q": "Tips menghadapi Listening Section 4 (Academic Monologue) agar tidak ketinggalan audio?", "tag": "Listening", "a": "Section 4 tidak memiliki jeda di tengah. Sebelum audio mulai, garis bawahi kata benda di sebelah kiri dan kanan titik-titik kosong (31–40), serta tandai Sub-headings tebal. Jika Anda terlewat satu nomor, langsung fokus ke baris di bawahnya—jangan terpaku memikirkan nomor yang lewat karena Anda bisa kehilangan 3 nomor berikutnya."}]};

function pctToBand(pct) {
  if (pct === null || pct === undefined || Number.isNaN(pct)) return null;
  if (pct >= 95) return 9.0;
  if (pct >= 88) return 8.5;
  if (pct >= 80) return 8.0;
  if (pct >= 72) return 7.5;
  if (pct >= 65) return 7.0;
  if (pct >= 55) return 6.5;
  if (pct >= 45) return 6.0;
  if (pct >= 35) return 5.5;
  if (pct >= 25) return 5.0;
  return 4.5;
}

function roundBand(val) {
  return (Math.round(val * 2) / 2).toFixed(1);
}

function skillAccuracy(skill) {
  const attempts = state.history.filter(h => h.skill === skill && h.total > 0);
  if (!attempts.length) return null;
  const c = attempts.reduce((s, x) => s + x.correct, 0);
  const t = attempts.reduce((s, x) => s + x.total, 0);
  return Math.round((c / t) * 100);
}

function skillEstimatedBand(skill) {
  const attempts = state.history.filter(h => h.skill === skill);
  if (!attempts.length) {
    if (state.diagnosticResult && state.diagnosticResult.skillBands && state.diagnosticResult.skillBands[skill]) {
      return state.diagnosticResult.skillBands[skill];
    }
    return null;
  }
  const withBand = attempts.filter(h => h.band);
  if (withBand.length) {
    const avg = withBand.reduce((s, x) => s + parseFloat(x.band), 0) / withBand.length;
    return roundBand(avg);
  }
  const acc = skillAccuracy(skill);
  return acc !== null ? pctToBand(acc).toFixed(1) : null;
}

function overallEstimatedBand() {
  const bands = SKILLS.map(s => skillEstimatedBand(s)).filter(Boolean).map(parseFloat);
  if (!bands.length) return state.diagnosticResult?.overall || null;
  const avg = bands.reduce((a, b) => a + b, 0) / bands.length;
  return roundBand(avg);
}

function completedPackageIds() {

function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function wordCount(text) {
  const t = String(text || '').trim();
  return t ? t.split(/\s+/u).length : 0;
}

// Heuristic Writing Analyzer
function evaluateWritingText(text, minWords, type) {
  const words = wordCount(text);
  const paragraphs = String(text || '').trim().split(/\n\s*\n/).filter(Boolean).length;
  const sentences = String(text || '').split(/[.!?]+/).filter(s => s.trim().length > 3).length || 1;
  const avgSentenceLen = Math.round(words / sentences);
  const lower = String(text || '').toLowerCase();

  const linkers = ['overall', 'however', 'furthermore', 'moreover', 'consequently', 'in contrast', 'conversely', 'for instance', 'for example', 'in conclusion', 'although', 'while', 'whereas', 'therefore', 'nevertheless'];
  const usedLinkers = linkers.filter(l => lower.includes(l));

  const academicLexis = ['significant', 'substantial', 'demonstrate', 'illustrate', 'transform', 'infrastructure', 'facility', 'beneficial', 'detrimental', 'proliferation', 'accommodate', 'fundamental', 'predominantly', 'subsequently', 'contribute', 'environment'];
  const usedLexis = academicLexis.filter(w => lower.includes(w));

  let tr = words >= minWords ? 7.0 : words >= minWords * 0.75 ? 6.0 : 5.0;
  if (type === 'task1_academic' && lower.includes('overall')) tr = Math.min(8.5, tr + 0.5);
  let cc = paragraphs >= 3 && usedLinkers.length >= 3 ? 7.5 : paragraphs >= 2 ? 6.5 : 5.5;
  let lr = usedLexis.length >= 4 ? 7.5 : usedLexis.length >= 2 ? 6.5 : 6.0;
  let gra = avgSentenceLen >= 14 && (lower.includes('which') || lower.includes('although') || lower.includes('whereas') || lower.includes('while')) ? 7.5 : 6.5;

  if (words < 80) { tr = 4.5; cc = 5.0; lr = 5.0; gra = 5.0; }
  const overall = roundBand((tr + cc + lr + gra) / 4);

  const tips = [];
  if (words < minWords) tips.push(`Tambahkan minimal ${minWords - words} kata lagi untuk memenuhi batas minimum ${minWords} kata.`);
  if (type === 'task1_academic' && !lower.includes('overall')) tips.push('Sertakan kata sinyal "Overall," pada paragraf Overview untuk memperjelas tren utama grafik/peta.');
  if (paragraphs < 3) tips.push('Bagi tulisan Anda menjadi minimal 3–4 paragraf yang rapi (Introduction, Overview/Body 1, Body 2, Conclusion).');
  if (usedLinkers.length < 3) tips.push('Perkaya kohesi antar-kalimat dengan penghubung seperti "Conversely,", "Furthermore,", atau "For instance,".');
  if (tips.length === 0) tips.push('Struktur paragraf, jumlah kata, dan variasi penghubung sudah sangat solid. Bandingkan argumen Anda dengan Official Model Answer di bawah.');

  return { words, paragraphs, sentences, avgSentenceLen, usedLinkers, usedLexis, tr: tr.toFixed(1), cc: cc.toFixed(1), lr: lr.toFixed(1), gra: gra.toFixed(1), overall, tips };
}

// Highlighting helper that works on any text selection inside #reading-passage-body
function applySelectionHighlight(colorName) {
  const pBody = document.getElementById('reading-passage-body');
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !pBody) return false;
  const text = sel.toString().trim();
  if (text.length < 2) return false;
  if (!pBody.contains(sel.anchorNode) && !pBody.contains(sel.focusNode)) return false;

  const colorClass = 'hl-' + (colorName || activeHighlightColor || 'yellow');
  try {
    const range = sel.getRangeAt(0);
    const mark = document.createElement('mark');
    mark.className = colorClass;
    range.surroundContents(mark);
  } catch {
    const safeText = esc(text);
    pBody.innerHTML = pBody.innerHTML.replace(safeText, `<mark class="${colorClass}">${safeText}</mark>`);
  }
  sel.removeAllRanges();
  if (state.activeSession) {
    state.highlights[state.activeSession.pkgId] = pBody.innerHTML;
    save();
  }
  toast(`Teks ditandai dengan Stabilo ${colorName === 'green' ? 'Hijau' : colorName === 'pink' ? 'Pink' : 'Kuning'}.`);
  return true;
}

// Multi-line Listening Audio Player
function startListeningAudio(pk, startIndex = 0) {
  stopListeningAudio(false);
  audioLines = String(pk.transcript || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (!audioLines.length) return;
  isPlayingAudio = true;
  currentAudioLine = Math.max(0, Math.min(startIndex, audioLines.length - 1));
  updateAudioUI();
  playCurrentAudioLine();
}

function playCurrentAudioLine() {
  if (!isPlayingAudio || currentAudioLine >= audioLines.length) {
    isPlayingAudio = false;
    updateAudioUI('✓ Audio selesai diputar. Periksa kembali jawaban Anda.');
    return;
  }
  const lineText = audioLines[currentAudioLine];
  updateAudioUI(`🔊 Memutar baris ${currentAudioLine + 1} / ${audioLines.length} (${audioRate}x)...`);

  const lineEl = document.getElementById('dlg-line-' + currentAudioLine);
  if (lineEl) {
    document.querySelectorAll('.dialogue-line.active-line').forEach(el => el.classList.remove('active-line'));
    lineEl.classList.add('active-line');
  }

  let ttsStarted = false;
  clearTimeout(audioSimTimer);

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(lineText);
      u.lang = 'en-GB';
      u.rate = audioRate;
      const voices = window.speechSynthesis.getVoices();
      const gbVoice = voices.find(v => v.lang && v.lang.includes('en-GB')) || voices.find(v => v.lang && v.lang.includes('en'));
      if (gbVoice) u.voice = gbVoice;

      u.onstart = () => { ttsStarted = true; };
      u.onend = () => {
        if (!isPlayingAudio) return;
        currentAudioLine++;
        playCurrentAudioLine();
      };
      u.onerror = () => {
        if (!isPlayingAudio) return;
        runFallbackLineTimer(lineText);
      };
      window.speechSynthesis.speak(u);

      audioSimTimer = setTimeout(() => {
        if (isPlayingAudio && !ttsStarted && !window.speechSynthesis.speaking) {
          runFallbackLineTimer(lineText);
        }
      }, 1200);
      return;
    } catch {}
  }
  runFallbackLineTimer(lineText);
}

function runFallbackLineTimer(lineText) {
  const words = lineText.split(/\s+/).length;
  const durationMs = Math.max(1800, Math.round((words / (2.6 * audioRate)) * 1000));
  clearTimeout(audioSimTimer);
  audioSimTimer = setTimeout(() => {
    if (!isPlayingAudio) return;
    currentAudioLine++;
    playCurrentAudioLine();
  }, durationMs);
}

function stopListeningAudio(resetLine = true) {
  isPlayingAudio = false;
  clearTimeout(audioSimTimer);
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch {}
  }
  if (resetLine) currentAudioLine = 0;
  updateAudioUI('⏹ Audio dihentikan. Klik Play atau klik baris dialog untuk memutar.');
}

function updateAudioUI(statusText) {
  const st = document.getElementById('audio-status');
  if (st && statusText) st.textContent = statusText;
  const prog = document.getElementById('audio-progress-bar');
  if (prog && audioLines.length) {
    const pct = Math.round(((currentAudioLine + (isPlayingAudio ? 0.5 : 0)) / audioLines.length) * 100);
    prog.style.width = Math.min(100, pct) + '%';
  }
  const playBtn = document.getElementById('tts-play-btn');
  if (playBtn) {
    playBtn.innerHTML = `${icon('headphones', 16)} ${isPlayingAudio ? 'Restart Audio' : currentAudioLine > 0 ? 'Lanjutkan Audio' : 'Play Audio'}`;
  }
}

// 2. PRACTICE CENTER (ALL 80 PACKAGES)
function viewPracticeCenter() {
  const donePkgs = completedPackageIds();
  const allPkgs = allPackages();
  const filtered = allPkgs.filter(pk => {
    const matchSkill = skillFilter === 'All' || pk.skill === skillFilter;
    const matchBook = bookFilter === 'All Books' || pk.book === bookFilter;
    const q = searchQuery.trim().toLowerCase();
    const matchQuery = !q || pk.title.toLowerCase().includes(q) || pk.subtitle.toLowerCase().includes(q) || pk.source.toLowerCase().includes(q) || pk.book.toLowerCase().includes(q);
    return matchSkill && matchBook && matchQuery;
  });

  const counts = {
    All: allPkgs.length,
    Reading: allPkgs.filter(p => p.skill === 'Reading').length,
    Listening: allPkgs.filter(p => p.skill === 'Listening').length,
    Writing: allPkgs.filter(p => p.skill === 'Writing').length,
    Speaking: allPkgs.filter(p => p.skill === 'Speaking').length
  };

  return `
  <div class="pagehead">
    <div>
      <span class="eyebrow">PRACTICE CENTER · 80 CAMBRIDGE PACKAGES</span>
      <h1>Bank Latihan 80 Paket IELTS Terpadu</h1>
      <p>Pilih dari 28 Paket Reading, 24 Paket Listening, 16 Paket Writing, dan 12 Paket Speaking yang diambil dari Cambridge IELTS 5, 6, 7, 8, 9, dan 13.</p>
    </div>
    <button type="button" class="btn ghost small" data-nav="bank">+ Tambah Paket Kustom</button>
  </div>

  <div class="toolbar">
    <div class="filters">
      ${['All', 'Reading', 'Listening', 'Writing', 'Speaking'].map(s => `
        <button type="button" class="filter-btn ${skillFilter === s ? 'selected' : ''}" data-skill-filter="${s}">
          ${s === 'All' ? 'Semua Paket' : s} (${counts[s]})
        </button>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;justify-content:flex-end">
      <select id="book-filter-select" aria-label="Filter Sumber Buku" style="padding:8px 12px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg-elev);font-size:12.5px;font-weight:600">
        ${BOOKS.map(b => `<option value="${esc(b)}" ${bookFilter === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}
      </select>
      <input type="search" id="pkg-search-input" class="search-input" placeholder="Cari topik (mis. Bakelite, Pagodas, Perkin, MSG)..." value="${esc(searchQuery)}" aria-label="Cari paket">
    </div>
  </div>

  <div class="grid3">
    ${filtered.length ? filtered.map(pk => renderPackageCard(pk, donePkgs.has(pk.id))).join('') : '<div class="card" style="grid-column:1/-1;text-align:center;padding:40px">Tidak ada paket yang cocok dengan filter pencarian Anda.</div>'}
  </div>`;
}

// 3. INDIVIDUAL PACKAGE WORKSPACE
function viewPackageWorkspace(pkgId) {
  const pk = allPackages().find(p => p.id === pkgId);
  if (!pk) return `<div class="card">Paket tidak ditemukan. <button type="button" class="btn small" data-nav="practice">Kembali</button></div>`;

  if (pk.skill === 'Writing') return renderWritingWorkspace(pk);
  if (pk.skill === 'Speaking') return renderSpeakingWorkspace(pk);
  return renderObjectiveWorkspace(pk);
}

function renderObjectiveWorkspace(pk) {
  if (!state.activeSession || state.activeSession.pkgId !== pk.id) {
    state.activeSession = {
      pkgId: pk.id,
      started: Date.now(),
      deadline: Date.now() + pk.minutes * 60000,
      answers: {},
      flagged: {}
    };
    save();
  }
  const sess = state.activeSession;
  const answeredCount = Object.keys(sess.answers).length;
  const totalQ = pk.questions.length;
  const savedPassageHtml = state.highlights[pk.id] || esc(pk.passage || '');
  const transcriptLines = pk.transcript ? pk.transcript.split(/\n+/).map(s => s.trim()).filter(Boolean) : [];

  return `
  <div class="pagehead" style="margin-bottom:14px">
    <div>
      <span class="eyebrow">PAKET #${String(pk.num).padStart(2, '0')} · ${esc(pk.source)}</span>
      <h1>${esc(pk.title)}</h1>
      <p>${esc(pk.subtitle)}</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn ghost small" data-action="toggle-study-key">${showStudyAnswers ? 'Sembunyikan Kunci' : '👁 Mode Belajar (Kunci)'}</button>
      <button type="button" class="btn ghost small" data-action="restart-pkg">↻ Reset Paket</button>
      <button type="button" class="btn ghost small" data-nav="practice">← Daftar 80 Paket</button>
    </div>
  </div>

  <div class="testbar">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0">
      <span class="chip ${pk.skill}">${pk.skill}</span>
      <span id="answered-counter" class="tabular" style="font-weight:700;font-size:13px">${answeredCount} / ${totalQ} Terjawab</span>
      <div class="q-palette" id="q-palette">
        ${pk.questions.map((_, i) => `
          <button type="button" class="q-dot ${sess.answers[i] !== undefined ? 'answered' : ''} ${sess.flagged[i] ? 'flagged' : ''}" data-scroll-q="${i}" title="Ke Soal ${i + 1}">${i + 1}</button>
        `).join('')}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="timer-pill mono" id="active-timer">${formatTime(Math.ceil((sess.deadline - Date.now()) / 1000))}</div>
      <button type="button" class="btn small" data-action="submit-pkg">Kumpulkan & Nilai ${icon('check', 15)}</button>
    </div>
  </div>

  ${renderPaneSwitcher(pk.skill === 'Reading' ? 'Bacaan (Passage)' : 'Audio & Transkrip', `Soal (${totalQ})`)}

  <div class="workspace mode-${workspacePaneMode}">
    <div class="card passage-pane workspace-left">
      ${pk.skill === 'Reading' ? `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span style="font-size:11.5px;font-weight:700" class="muted">STABILO:</span>
            <button type="button" class="btn ghost small ${activeHighlightColor === 'yellow' ? 'active-tool' : ''}" style="background:#fef08a;color:#111" data-hl="yellow">Kuning</button>
            <button type="button" class="btn ghost small ${activeHighlightColor === 'green' ? 'active-tool' : ''}" style="background:#bbf7d0;color:#111" data-hl="green">Hijau</button>
            <button type="button" class="btn ghost small ${activeHighlightColor === 'pink' ? 'active-tool' : ''}" style="background:#fbcfe8;color:#111" data-hl="pink">Pink</button>
            <button type="button" class="btn ghost small" data-action="clear-hl">Hapus</button>
          </div>
          <div style="display:flex;gap:4px">
            <button type="button" class="btn ghost small" data-font="-1">A-</button>
            <button type="button" class="btn ghost small" data-font="1">A+</button>
          </div>
        </div>
        <div id="reading-passage-body" class="passage-text" style="--passage-size:${passageFontSize}px">${savedPassageHtml}</div>
      ` : `
        <span class="eyebrow">INTERACTIVE LISTENING STUDIO</span>
        <h2 style="margin:8px 0">Putar Audio Dialog & Monolog</h2>
        <p class="muted" style="font-size:13px">Tekan <strong>Play Audio</strong> atau klik langsung baris percakapan di bawah untuk memutar dari bagian tersebut.</p>
        <div style="background:var(--bg-subtle);padding:16px;border-radius:12px;margin:14px 0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn" id="tts-play-btn" data-action="play-tts">${icon('headphones', 16)} Play Audio</button>
            <button type="button" class="btn ghost" data-action="stop-tts">Stop</button>
            <label style="font-size:12px;font-weight:700;margin-left:auto;display:flex;align-items:center;gap:6px">
              Speed:
              <select id="tts-rate-select" style="padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev)">
                ${[0.8, 0.9, 0.95, 1.0, 1.1].map(r => `<option value="${r}" ${audioRate === r ? 'selected' : ''}>${r}x</option>`).join('')}
              </select>
            </label>
          </div>
          <div class="progress" style="margin:12px 0 8px"><i id="audio-progress-bar" style="width:0%"></i></div>
          <div id="audio-status" class="muted" style="font-size:12.5px;font-weight:600" role="status">Siap memutar (${transcriptLines.length} segmen dialog).</div>
        </div>
        <div style="margin-top:14px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <strong style="font-size:12.5px">Interactive Audioscript (Klik baris untuk dengar):</strong>
          </div>
          <div style="border:1px solid var(--line);border-radius:10px;padding:10px;max-height:46vh;overflow-y:auto">
            ${transcriptLines.map((line, lIdx) => `
              <div class="dialogue-line ${currentAudioLine === lIdx && isPlayingAudio ? 'active-line' : ''}" id="dlg-line-${lIdx}" data-play-line="${lIdx}">
                <span class="mono muted" style="font-size:11px;margin-right:6px">[${String(lIdx + 1).padStart(2, '0')}]</span>${esc(line)}
              </div>
            `).join('')}
          </div>
        </div>
      `}
    </div>

    <div class="card questions-pane workspace-right">
      ${pk.questions.map((q, idx) => `
        <div class="q-item" id="q-block-${idx}">
          <div class="q-head">
            <h3><span class="mono" style="color:var(--brand)">Q${idx + 1}.</span> ${esc(q.q)}</h3>
            <button type="button" class="flag-btn ${sess.flagged[idx] ? 'active' : ''}" data-flag-q="${idx}">⚑ ${sess.flagged[idx] ? 'Ditandai' : 'Tandai'}</button>
          </div>
          ${q.options.map((opt, oIdx) => `
            <label class="choice">
              <input type="radio" name="q_${idx}" data-q-index="${idx}" value="${oIdx}" ${sess.answers[idx] === oIdx ? 'checked' : ''}>
              <span>${esc(opt)}</span>
            </label>
          `).join('')}
          ${showStudyAnswers ? `
            <div class="explanation" style="border-left:3px solid var(--success)">
              <strong style="color:var(--success)">✓ Kunci: ${esc(q.options[q.a])}</strong><br>
              <span>${esc(q.why)}</span>
            </div>
          ` : ''}
        </div>
      `).join('')}
      <div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <span class="muted" style="font-size:12px">Klik Submit untuk melihat skor Band dan pembahasan lengkap.</span>
        <button type="button" class="btn" data-action="submit-pkg">Submit Jawaban & Lihat Pembahasan ${icon('arrow', 16)}</button>
      </div>
    </div>
  </div>`;
}

  return `

        <span class="eyebrow">HEURISTIC 4-CRITERIA RUBRIC EVALUATOR</span>
        <h3 style="margin-top:2px">Estimasi Skor Tulisan Saat Ini: <span class="mono" style="color:var(--brand)">Band ${ev.overall}</span></h3>
      </div>
      <span class="chip Orientation">${ev.words} kata · Rata-rata ${ev.avgSentenceLen} kata/kalimat</span>
    </div>
    <div class="stats-grid" style="margin:10px 0">
      <div class="stat-card" style="padding:10px"><small class="muted">Task Response</small><div class="mono" style="font-size:18px;font-weight:800">${ev.tr}</div></div>
      <div class="stat-card" style="padding:10px"><small class="muted">Coherence (CC)</small><div class="mono" style="font-size:18px;font-weight:800">${ev.cc}</div></div>

// 4. RESULT & EVIDENCE REVIEW PAGE
function viewResult(attId) {
  const att = state.history.find(h => h.id === attId);
  if (!att) return `<div class="card">Hasil tidak ditemukan. <button type="button" class="btn small" data-nav="analytics">Ke Analytics</button></div>`;
  const pk = allPackages().find(p => p.id === att.pkgId);
  if (!pk || !pk.questions) return viewAnalytics();

  const pct = Math.round((att.correct / att.total) * 100);
  return `
  <div class="pagehead">
    <div>
      <span class="eyebrow">${esc(att.skill)} RESULT · ${esc(pk.source)}</span>
      <h1>Hasil & Pembahasan: ${esc(pk.title)}</h1>

    <div style="display:flex;gap:8px;flex-wrap:wrap">

    </div>
  </div>

  <div class="card" style="margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
    <div>
      <span class="chip ${att.skill}">${att.skill} Band Equivalent</span>
      <div style="font-size:clamp(30px, 4vw, 44px);font-weight:800;color:var(--brand);line-height:1.1;margin-top:6px" class="tabular">
        ${att.correct} / ${att.total} <span style="font-size:20px;color:var(--muted)">(${pct}% · Est. Band ${att.band})</span>
      </div>
      <p class="muted" style="margin:4px 0 0;font-size:13px">Diselesaikan dalam ${att.minutes || 1} menit pada ${new Date(att.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}.</p>
    </div>
    <button type="button" class="btn ghost small" data-nav="analytics">Lihat Grafik Perkembangan ↗</button>
  </div>

  <div class="card">
    <h2>Pembahasan Eviden per Soal</h2>
    ${pk.questions.map((q, i) => {
      const userAns = att.answers ? att.answers[i] : undefined;

      return `
      <div class="q-item">
        <h3>
          <span class="${isCorrect ? 'correct-badge' : 'wrong-badge'}">${isCorrect ? '✓ BENAR' : '✗ KURANG TEPAT'}</span>

        <p style="font-size:13px;margin:6px 0">
          Jawaban Anda: <strong>${esc(q.options[userAns] ?? 'Tidak dijawab')}</strong> |

        </p>
        <div class="explanation"><strong>Bukti & Penjelasan:</strong> ${esc(q.why)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// 7. ACADEMIC VOCABULARY FLASHCARDS (200 WORDS)
function viewFlashcards() {
  const q = flashcardSearch.trim().toLowerCase();

      || (flashcardFilter === 'Mastered' && isMastered)
      || (flashcardFilter === 'Unmastered' && !isMastered)

    return matchStatus && matchQ;

  return `

      <span class="eyebrow">LEXICAL RESOURCE BUILDER · 200 WORDS</span>

        ['Unmastered', `Belum Hafal (${DATA.flashcards.length - state.masteredCards.length})`],
        ['Mastered', `Sudah Hafal (${state.masteredCards.length})`],

      `).join('')}
    </div>
    <input type="search" id="flashcard-search-input" class="search-input" placeholder="Cari dari 200 kata / arti Indonesia..." value="${esc(flashcardSearch)}" aria-label="Cari flashcard">
  </div>

  <div class="grid3">
    ${filtered.length ? filtered.map(fc => {
      const isFlipped = !!flippedCards[fc.id];
      const isMastered = state.masteredCards.includes(fc.id);
      return `
      <div class="card flashcard-box" data-flip-card="${fc.id}">

          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="chip ${isMastered ? 'Orientation' : 'Reading'}">${esc(fc.cat)}</span>
            <small class="muted">${isFlipped ? 'Arti & Contoh Cambridge' : `Kata #${fc.id.replace('v','')} · Klik balik ↻`}</small>

            <h3 style="margin:14px 0 6px;color:var(--brand)">${esc(fc.word)} — ${esc(fc.meaning)}</h3>

        <div class="pkg-foot">
          <span style="font-size:12px;font-weight:700;color:${isMastered ? 'var(--success)' : 'var(--muted)'}">${isMastered ? '✓ Sudah Dikuasai' : 'Belum Dikuasai'}</span>

      <small class="muted">Kosakata Dikuasai</small>
      <div class="stat-num tabular">${state.masteredCards.length} / ${DATA.flashcards.length}</div>
      <small class="muted">200 Academic Words</small>

          <tr>
            <th>Keterampilan</th>
            <th>Paket Selesai</th>
            <th>Akurasi / Evaluasi</th>
            <th>Estimasi Band</th>
            <th>Target Band</th>
            <th>Status</th>

                <td><strong>${esc(h.title)}</strong></td>
                <td><span class="chip ${h.skill}">${esc(h.skill)}</span></td>
                <td class="mono">${h.total ? `${h.correct}/${h.total} benar (Band ${h.band})` : h.words ? `${h.words} kata (Band ${h.band})` : `Band ${h.band || '7.0'}`}</td>

                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : '<p class="muted" style="padding:20px 0">Belum ada riwayat sesi latihan. Kerjakan salah satu dari 80 paket untuk melihat analitik Anda.</p>'}
  </div>`;
}

// SUBMIT OBJECTIVE PACKAGE
function submitActivePackage() {
  const sess = state.activeSession;
  if (!sess) return;
  const pk = allPackages().find(p => p.id === sess.pkgId);
  if (!pk || !pk.questions) return;

  const correct = pk.questions.reduce((acc, q, idx) => acc + (sess.answers[idx] === q.a ? 1 : 0), 0);
  const total = pk.questions.length;
  const pct = Math.round((correct / total) * 100);
  const band = pctToBand(pct).toFixed(1);
  const mins = Math.max(1, Math.round((Date.now() - sess.started) / 60000));

  const attId = addHistoryRecord({
    pkgId: pk.id,
    skill: pk.skill,
    title: `Paket #${pk.num}: ${pk.title}`,
    correct,
    total,
    band,
    answers: { ...sess.answers },
    minutes: mins
  });

  state.activeSession = null;
  save();
  toast(`Paket selesai! Skor: ${correct}/${total} (Est. Band ${band})`);
  navigate('result/' + attId);
}

// STOP MEDIA / TIMERS
function stopMediaAndTimers() {
  clearInterval(timerInterval);
  clearInterval(prepInterval);
  clearInterval(recordInterval);
  stopListeningAudio(true);
  stopSpeakingPlayback();
  if (recorder && recorder.state === 'recording') {
    try { recorder.stop(); } catch {}
  }
  isSimRecording = false;

// MAIN RENDER ROUTER
function render() {
  clearInterval(timerInterval);
  const rawHash = currentHash || (location.hash && location.hash.slice(1)) || 'dashboard';
  const [route, param] = rawHash.split('/');

  let content = '';
  if (route === 'dashboard') content = viewDashboard();
  else if (route === 'practice') content = viewPracticeCenter();
  else if (route === 'pkg') content = viewPackageWorkspace(param);
  else if (route === 'result') content = viewResult(param);
  else if (route === 'diagnostic') content = viewDiagnostic();
  else if (route === 'academy') content = viewAcademy();
  else if (route === 'lesson') content = viewLesson(param);
  else if (route === 'flashcards') content = viewFlashcards();
  else if (route === 'mock') content = viewMockExam();
  else if (route === 'coach') content = viewCoach();
  else if (route === 'analytics') content = viewAnalytics();
  else if (route === 'bank') content = viewBankManager();
  else if (route === 'deploy') content = viewDeployCenter();
  else if (route === 'profile') content = viewProfile();
  else content = viewDashboard();

  const navRoute = route === 'pkg' ? 'practice' : route === 'lesson' ? 'academy' : route === 'result' ? 'analytics' : route;
  app.innerHTML = renderShell(content, navRoute);

  if (route === 'pkg' && state.activeSession && state.activeSession.pkgId === param) {
    timerInterval = setInterval(() => {
      const el = document.getElementById('active-timer');
      if (!el || !state.activeSession) { clearInterval(timerInterval); return; }
      const rem = Math.ceil((state.activeSession.deadline - Date.now()) / 1000);
      el.textContent = formatTime(rem);
      if (rem <= 0) {
        clearInterval(timerInterval);
        submitActivePackage();
      }
    }, 500);
  }
}

window.addEventListener('hashchange', () => {
  const newHash = location.hash.slice(1) || 'dashboard';
  if (newHash !== currentHash) {
    stopMediaAndTimers();
    currentHash = newHash;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// DELEGATED CLICK HANDLERS
document.addEventListener('click', async e => {
  // 1. Close sidebar when clicking backdrop or close button
  if (e.target.closest('[data-action="close-sidebar"]')) {
    mobileSidebarOpen = false;
    render();
    return;
  }

  // 2. Intercept any navigation link or button with [data-nav] or [href^="#"]
  const navEl = e.target.closest('[data-nav], a[href^="#"]');
  if (navEl) {
    e.preventDefault();
    const target = navEl.dataset.nav || navEl.getAttribute('href').slice(1);
    navigate(target);
    return;
  }

  // 3. Click on dialogue line in Listening studio
  const dlgLine = e.target.closest('[data-play-line]');
  if (dlgLine && state.activeSession) {
    const pk = allPackages().find(p => p.id === state.activeSession.pkgId);
    if (pk) startListeningAudio(pk, Number(dlgLine.dataset.playLine));
    return;
  }

  const btn = e.target.closest('button, [data-flip-card]');
  if (!btn) return;

  // Viewport mode switcher (Auto / Mobile / Desktop)
  if (btn.dataset.viewportMode) {
    viewportMode = btn.dataset.viewportMode;
    document.body.setAttribute('data-viewport', viewportMode);
    if (viewportMode === 'mobile') {
      workspacePaneMode = 'left';
      toast('📱 Mode Tampilan Mobile aktif (Lengkap dengan Bottom Bar & Tab Layar).');
    } else if (viewportMode === 'desktop') {
      workspacePaneMode = 'both';
      sidebarCollapsedDesktop = false;
      toast('💻 Mode Tampilan Desktop Lebar aktif.');
    } else {
      workspacePaneMode = window.innerWidth <= 860 ? 'left' : 'both';
      toast('✨ Mode Auto-Responsive aktif.');
    }
    render();
    return;
  }

  // Workspace pane tab switcher (Both / Left / Right)
  if (btn.dataset.paneTab) {
    workspacePaneMode = btn.dataset.paneTab;
    render();
    return;
  }

  // Flip flashcard
  if (btn.dataset.flipCard && !e.target.closest('[data-master-card]')) {
    const id = btn.dataset.flipCard;
    flippedCards[id] = !flippedCards[id];
    render();
    return;
  }

  // Master flashcard
  if (btn.dataset.masterCard) {
    e.stopPropagation();
    const id = btn.dataset.masterCard;
    const idx = state.masteredCards.indexOf(id);
    if (idx >= 0) state.masteredCards.splice(idx, 1);
    else state.masteredCards.push(id);
    logActivity();
    save();
    render();
    toast(idx >= 0 ? 'Status hafal dibatalkan.' : 'Kata ditandai sudah dikuasai!');
    return;
  }

  // Flashcard category filter
  if (btn.dataset.fcFilter) {
    flashcardFilter = btn.dataset.fcFilter;
    render();
    return;
  }

  // Skill filter in Practice Center
  if (btn.dataset.skillFilter) {
    skillFilter = btn.dataset.skillFilter;
    render();
    return;
  }

  // Jump to skill in Practice Center
  if (btn.dataset.action === 'jump-skill') {
    skillFilter = btn.dataset.skill || 'All';
    navigate('practice');
    return;
  }

  // Academy filter
  if (btn.dataset.academyFilter) {
    academyFilter = btn.dataset.academyFilter;
    render();
    return;
  }

  // Speaking part tab
  if (btn.dataset.speakingPart) {
    stopMediaAndTimers();
    speakingPart = Number(btn.dataset.speakingPart);
    render();
    return;
  }

  // Scroll to question (and switch to right pane if currently viewing only left pane on mobile)
  if (btn.dataset.scrollQ !== undefined) {
    const qNum = btn.dataset.scrollQ;
    if (workspacePaneMode === 'left') {
      workspacePaneMode = 'right';
      render();
    }
    const target = document.getElementById('q-block-' + qNum);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  // Flag question
  if (btn.dataset.flagQ !== undefined && state.activeSession) {
    const qIdx = Number(btn.dataset.flagQ);
    state.activeSession.flagged[qIdx] = !state.activeSession.flagged[qIdx];
    save();
    render();
    return;
  }

  // Passage font size
  if (btn.dataset.font) {
    passageFontSize = Math.min(22, Math.max(12, passageFontSize + Number(btn.dataset.font)));
    const pBody = document.getElementById('reading-passage-body');
    if (pBody) pBody.style.setProperty('--passage-size', passageFontSize + 'px');
    toast(`Ukuran huruf bacaan: ${passageFontSize}px`);
    return;
  }

  // Highlight selected text or switch active highlight color
  if (btn.dataset.hl) {
    activeHighlightColor = btn.dataset.hl;
    const didHighlight = applySelectionHighlight(activeHighlightColor);
    if (!didHighlight) {
      render();
      toast(`Mode Stabilo ${activeHighlightColor === 'green' ? 'Hijau' : activeHighlightColor === 'pink' ? 'Pink' : 'Kuning'} aktif — blok teks pada bacaan untuk menandai otomatis!`);
    }
    return;
  }

  const action = btn.dataset.action;
  if (!action) return;

  if (action === 'clear-hl' && state.activeSession) {
    delete state.highlights[state.activeSession.pkgId];
    save();
    render();
    toast('Stabilo pada bacaan ini telah dihapus.');
  } else if (action === 'toggle-study-key') {
    showStudyAnswers = !showStudyAnswers;
    render();
    toast(showStudyAnswers ? 'Mode Belajar aktif: Kunci jawaban & bukti ditampilkan.' : 'Kunci jawaban disembunyikan.');
  } else if (action === 'restart-pkg' && state.activeSession) {
    state.activeSession = null;
    save();
    render();
    toast('Timer dan jawaban paket telah direset.');
  } else if (action === 'toggle-sidebar') {
    if (window.innerWidth <= 860 || viewportMode === 'mobile') {
      mobileSidebarOpen = !mobileSidebarOpen;
    } else {
      sidebarCollapsedDesktop = !sidebarCollapsedDesktop;
    }
    render();
  } else if (action === 'toggle-theme') {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.theme);
    save();
    toast(state.theme === 'dark' ? 'Mode Gelap aktif' : 'Mode Terang aktif');
  } else if (action === 'submit-pkg') {
    submitActivePackage();
  } else if (action === 'play-tts' && state.activeSession) {
    const pk = allPackages().find(p => p.id === state.activeSession.pkgId);
    if (pk) startListeningAudio(pk, isPlayingAudio ? 0 : currentAudioLine);
  } else if (action === 'stop-tts') {
    stopListeningAudio(false);
  } else if (action === 'load-sample-writing') {
    const pkgId = btn.dataset.pkgId;
    const pk = allPackages().find(p => p.id === pkgId);
    if (pk) {
      state.drafts[pkgId] = pk.modelAnswer;
      if (workspacePaneMode === 'left') workspacePaneMode = 'right';
      save();
      render();
      toast('Contoh jawaban resmi Cambridge telah dimuat ke editor!');
    }
  } else if (action === 'save-writing-pkg') {
    const pkgId = btn.dataset.pkgId;
    const pk = allPackages().find(p => p.id === pkgId);
    const text = state.drafts[pkgId] || '';
    const ev = evaluateWritingText(text, pk.minWords, pk.type);
    if (ev.words < 5) {
      toast('Ketik jawaban Anda terlebih dahulu atau klik "Muat Contoh Band 8 ke Editor".');
      return;
    }
    addHistoryRecord({
      pkgId: pk.id,
      skill: 'Writing',
      title: `Paket #${pk.num}: ${pk.title}`,
      words: ev.words,
      band: ev.overall,
      minutes: pk.minutes
    });
    toast(`Tulisan disimpan! Estimasi Skor: Band ${ev.overall}`);
    render();
  } else if (action === 'analyze-writing-pkg') {
    const pkgId = btn.dataset.pkgId;
    const pk = allPackages().find(p => p.id === pkgId);
    const text = state.drafts[pkgId] || '';
    const ev = evaluateWritingText(text, pk.minWords, pk.type);
    const box = document.getElementById('writing-analysis-box');
    if (box) box.innerHTML = renderWritingEvaluationCard(ev);
    toast(`Analisis selesai: Estimasi Band ${ev.overall} (${ev.words} kata)`);
  } else if (action === 'download-writing-pkg') {
    const pkgId = btn.dataset.pkgId;
    const pk = allPackages().find(p => p.id === pkgId);
    const text = state.drafts[pkgId] || pk?.modelAnswer || '';
    downloadFile(`${pkgId}-writing.txt`, text, 'text/plain');
    toast('File .txt diunduh.');
  } else if (action === 'start-prep-timer') {
    clearInterval(prepInterval);
    prepSeconds = 60;
    const el = document.getElementById('prep-timer-display');
    if (el) el.textContent = 'Prep: ' + formatTime(prepSeconds);
    toast('Timer 1 menit persiapan Cue Card dimulai!');
    prepInterval = setInterval(() => {
      prepSeconds--;
      const d = document.getElementById('prep-timer-display');
      if (d) d.textContent = 'Prep: ' + formatTime(prepSeconds);
      if (prepSeconds <= 0) {
        clearInterval(prepInterval);
        toast('Waktu persiapan 1 menit selesai! Silakan mulai berbicara.');
      }
    }, 1000);
  } else if (action === 'start-record') {
    await startVoiceRecording(btn.dataset.pkgId);
  } else if (action === 'stop-record') {
    stopVoiceRecording(btn.dataset.pkgId);
  } else if (action === 'play-recording') {
    playRecordedSpeaking(btn.dataset.pkgId, false);
  } else if (action === 'play-model-speaking') {
