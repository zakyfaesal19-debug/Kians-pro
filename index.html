<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2e24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Astra IELTS Pro — Responsive Mobile & Desktop IELTS Learning Platform with 80 Authentic Cambridge Practice Packages (Cam 5, 6, 7, 8, 9 & 13), 200 Vocabulary Flashcards, Diagnostic Assessment, Academy, Writing & Speaking Studio with Play Recording, Mock Exam, and Analytics.">
<title>Astra IELTS Pro — 80 Paket Latihan Cambridge & 200 Kosakata (Mobile & Desktop Ready)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f0;
  --bg-elev: #ffffff;
  --bg-subtle: #ebf0e4;
  --bg-glass: rgba(244, 246, 240, 0.92);
  --ink: #122921;
  --ink-secondary: #4a5d54;
  --muted: #6e7f76;
  --line: #dce3d5;
  --brand: #133b2e;
  --brand-hover: #1b5240;
  --brand-deep: #0b241c;
  --lime: #c8ec7c;
  --lime-soft: #e5f5c4;
  --accent-amber: #d97706;
  --accent-amber-bg: #fef3c7;
  --accent-purple: #6d28d9;
  --accent-purple-bg: #ede9fe;
  --accent-blue: #0284c7;
  --accent-blue-bg: #e0f2fe;
  --accent-rose: #e11d48;
  --accent-rose-bg: #ffe4e6;
  --success: #15803d;
  --success-bg: #dcfce7;
  --danger: #b91c1c;
  --danger-bg: #fee2e2;
  --shadow-sm: 0 2px 8px rgba(18, 41, 33, 0.04);
  --shadow-md: 0 10px 28px rgba(18, 41, 33, 0.07);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0b1612;
  --bg-elev: #12221c;
  --bg-subtle: #182e26;
  --bg-glass: rgba(11, 22, 18, 0.92);
  --ink: #ecfdf5;
  --ink-secondary: #b5cfc3;
  --muted: #7fa192;
  --line: #213d32;
  --brand: #c8ec7c;
  --brand-hover: #daf59e;
  --brand-deep: #15352a;
  --lime: #c8ec7c;
  --lime-soft: #213d29;
  --accent-amber-bg: #3b280c;
  --accent-purple-bg: #2a1a4a;
  --accent-blue-bg: #0f2c40;
  --accent-rose-bg: #3f1221;
  --success-bg: #0f331d;
  --danger-bg: #3d1414;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.6 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  transition: background 0.2s ease, color 0.2s ease;
  overflow-x: hidden;
  min-height: 100vh;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.25; font-weight: 700; letter-spacing: -0.025em; }
h1 { font-size: clamp(21px, 2.4vw, 31px); font-weight: 800; }
h2 { font-size: clamp(17px, 1.8vw, 22px); }
h3 { font-size: 15.5px; }
p { margin: 0 0 12px; line-height: 1.7; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
.serif-italic { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: 0; }
.mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Adaptive Shell (Desktop + Mobile + Forced Preview Mode) */
.shell {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
  transition: grid-template-columns 0.22s ease;
}
.shell.sidebar-collapsed {
  grid-template-columns: 0px minmax(0, 1fr);
}
.shell.sidebar-collapsed .sidebar {
  transform: translateX(-100%);
}
.sidebar-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11, 22, 18, 0.52);
  backdrop-filter: blur(3px);
  z-index: 45;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.sidebar-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: 260px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-elev);
  border-right: 1px solid var(--line);
  padding: 20px 16px calc(20px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  z-index: 50;
  overflow-y: auto;
  transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
}
.sidebar-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.sidebar-close-btn {
  display: none;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--bg-subtle);
  place-items: center;
  font-weight: 800;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 6px;
  font-weight: 800;
  font-size: 21px;
  letter-spacing: -0.04em;
}
.brandmark {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #133b2e;
  color: #c8ec7c;
  display: grid;
  place-items: center;
  font-size: 21px;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(19, 59, 46, 0.25);
  flex-shrink: 0;
}
.brand small {
  display: block;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}
.nav-section {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 10px 8px;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.nav a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--ink-secondary);
  font-weight: 600;
  font-size: 13.5px;
  transition: all 0.15s ease;
}
.nav a .nav-left {
  display: flex;
  align-items: center;
  gap: 11px;
}
.nav a:hover {
  background: var(--bg-subtle);
  color: var(--ink);
}
.nav a.active {
  background: #133b2e;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(19, 59, 46, 0.18);
}
[data-theme="dark"] .nav a.active {
  background: #c8ec7c;
  color: #0b1612;
}
.nav-pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--bg-subtle);
  color: var(--ink-secondary);
}
.nav a.active .nav-pill {
  background: rgba(200, 236, 124, 0.22);
  color: #c8ec7c;
}
[data-theme="dark"] .nav a.active .nav-pill {
  background: rgba(11, 22, 18, 0.18);
  color: #0b1612;
}
.sidebar-card {
  margin-top: auto;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px;
  font-size: 12px;
}
.sidebar-card strong {
  display: block;
  margin-bottom: 4px;
  font-size: 12.5px;
}

.main {
  grid-column: 2;
  padding: 0 32px calc(48px + var(--safe-bottom));
  max-width: 1500px;
  width: 100%;
  margin: 0 auto;
  min-width: 0;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 25;
  min-height: 68px;
  padding: 8px 0;
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 10px;
  flex-wrap: wrap;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  min-width: 0;
}
.breadcrumb strong {
  color: var(--ink);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.viewport-switcher {
  display: inline-flex;
  align-items: center;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 2px;
  gap: 2px;
}
.vp-btn {
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink-secondary);
  transition: all 0.14s ease;
}
.vp-btn.active {
  background: var(--bg-elev);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  font-size: 11.5px;
  font-weight: 600;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  display: inline-grid;
  place-items: center;
  color: var(--ink);
  flex-shrink: 0;
  transition: transform 0.15s ease, background 0.15s ease;
}
.icon-btn:hover { background: var(--bg-subtle); }
.avatar {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #133b2e;
  color: #c8ec7c;
  display: inline-grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  flex-shrink: 0;
}

/* Buttons & Badges */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  min-height: 40px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  background: var(--brand);
  color: #ffffff;
  transition: all 0.15s ease;
  line-height: 1.3;
  cursor: pointer;
  user-select: none;
}
[data-theme="dark"] .btn {
  color: #0b1612;
}
.btn:hover:not(:disabled) {
  background: var(--brand-hover);
  transform: translateY(-1px);
}
.btn:active:not(:disabled) {
  transform: translateY(0);
}
.btn.lime {
  background: var(--lime);
  color: #0f2e24;
}
.btn.lime:hover:not(:disabled) {
  filter: brightness(0.96);
}
.btn.ghost {
  background: var(--bg-elev);
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn.ghost:hover:not(:disabled) {
  background: var(--bg-subtle);
}
.btn.small {
  padding: 7px 12px;
  min-height: 34px;
  font-size: 12px;
  border-radius: 8px;
}
.btn.active-tool {
  outline: 2.5px solid #133b2e;
  box-shadow: 0 0 0 3px rgba(200, 236, 124, 0.5);
  font-weight: 800;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Cards & Grids */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.pagehead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.pagehead p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13.5px;
}
.eyebrow {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brand);
}
[data-theme="dark"] .eyebrow { color: var(--lime); }

/* Hero Banner */
.hero {
  background: linear-gradient(135deg, #0f2e24 0%, #1b4d3c 100%);
  border-radius: var(--radius-lg);
  padding: 28px;
  color: #ffffff;
  display: grid;
  grid-template-columns: 1fr 200px;
  gap: 20px;
  align-items: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.hero::after {
  content: '';
  position: absolute;
  right: -60px;
  bottom: -60px;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,236,124,0.18) 0%, transparent 70%);
  pointer-events: none;
}
.hero .eyebrow { color: #c8ec7c; }
.hero h2 {
  font-size: clamp(21px, 2.5vw, 31px);
  line-height: 1.2;
  margin: 8px 0 12px;
  color: #ffffff;
}
.hero p {
  color: rgba(255, 255, 255, 0.84);
  font-size: 13.5px;
  max-width: 560px;
  margin-bottom: 18px;
}
.orbit-box {
  width: 168px;
  height: 168px;
  border-radius: 50%;
  border: 1.5px dashed rgba(200, 236, 124, 0.45);
  display: grid;
  place-items: center;
  margin: 0 auto;
  position: relative;
}
.orbit-inner {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.orbit-inner strong {
  font-size: 40px;
  font-weight: 800;
  color: #c8ec7c;
  line-height: 1;
}
.orbit-inner span {
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.8);
  margin-top: 6px;
}

/* Dashboard Layout */
.dash-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 305px;
  gap: 22px;
  align-items: start;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin: 18px 0;
}
.stat-card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  min-width: 0;
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.stat-num {
  font-size: clamp(22px, 2vw, 26px);
  font-weight: 800;
  margin: 8px 0 4px;
  letter-spacing: -0.03em;
}
.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.skill-card {
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.skill-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  background: var(--bg-subtle);
  color: var(--ink-secondary);
  white-space: nowrap;
}
.chip.Reading { background: var(--accent-purple-bg); color: var(--accent-purple); }
.chip.Listening { background: var(--accent-blue-bg); color: var(--accent-blue); }
.chip.Writing { background: var(--accent-amber-bg); color: var(--accent-amber); }
.chip.Speaking { background: var(--accent-rose-bg); color: var(--accent-rose); }
.chip.Orientation { background: var(--lime-soft); color: #15803d; }

.progress {
  height: 7px;
  background: var(--bg-subtle);
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0;
}
.progress > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #133b2e, #65a30d);
  border-radius: 99px;
  transition: width 0.3s ease;
}
[data-theme="dark"] .progress > i {
  background: linear-gradient(90deg, #84cc16, #c8ec7c);
}

/* Filters & Search */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 16px 0 20px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.filter-btn {
  padding: 8px 14px;
  min-height: 36px;
  border-radius: 9px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--ink-secondary);
  font-weight: 600;
  font-size: 12.5px;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.filter-btn:hover { background: var(--bg-subtle); }
.filter-btn.selected {
  background: var(--brand);
  color: #ffffff;
  border-color: var(--brand);
}
[data-theme="dark"] .filter-btn.selected {
  color: #0b1612;
}
.search-input {
  padding: 9px 14px;
  min-height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  min-width: 220px;
  font-size: 13.5px;
}

/* 3-Column Responsive Auto-Fit Package Grid */
.grid3 {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.pkg-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
}
.pkg-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}
.pkg-num {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.06em;
}
.pkg-card h3 {
  margin: 12px 0 6px;
  font-size: 16px;
}
.pkg-card p {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 16px;
}
.pkg-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  gap: 8px;
}

/* Workspace Pane Switcher (Useful on Mobile & Compact Screens) */
.pane-switcher {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  margin-bottom: 14px;
}
.pane-switcher-tabs {
  display: flex;
  flex: 1;
  gap: 4px;
}
.pane-tab {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-secondary);
  text-align: center;
  transition: all 0.15s ease;
}
.pane-tab.active {
  background: var(--brand);
  color: #ffffff;
}
[data-theme="dark"] .pane-tab.active {
  color: #0b1612;
}

/* Split Workspace for Reading / Listening / Writing / Speaking */
.testbar {
  position: sticky;
  top: 68px;
  z-index: 15;
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 11px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  box-shadow: var(--shadow-sm);
}
.timer-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 13px;
  border-radius: 8px;
  background: var(--bg-subtle);
  font-weight: 700;
  font-size: 14.5px;
}
.q-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  max-width: 100%;
  overflow-x: auto;
  padding-bottom: 2px;
}
.q-dot {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  font-size: 11.5px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.q-dot.answered {
  background: var(--brand);
  color: #ffffff;
  border-color: var(--brand);
}
[data-theme="dark"] .q-dot.answered { color: #0b1612; }

.workspace.mode-right {

.passage-pane {

}

  height: 136px;

  margin: 14px 0;

 11, "level": "Foundation", "summary": "Cara membedakan fakta kontradiktif (FALSE/NO) dan informasi yang tidak disebutkan (NOT GIVEN).", "body": ["TRUE / YES berarti pernyataan di soal memiliki makna yang ekuivalen (melalui sinonim/parafrase) dengan bukti eksplisit di teks.", "FALSE / NO berarti teks secara langsung membantah atau menyatakan kebalikan dari pernyataan soal. Contoh: soal menyebut 'semua rumah tangga memiliki anak', sedangkan teks menyatakan 'hanya sebagian kecil yang memiliki anak'.", "NOT GIVEN berarti informasi tersebut tidak dapat diverifikasi dari teks—baik karena topiknya tidak dibahas maupun karena ada kata pembanding/kuantitas (seperti 'more than', 'mainly', 'the first') yang tidak ada buktinya di teks.", "Urutan jawaban T/F/NG dan Y/N/NG selalu berurutan (in progressive order) mengikuti paragraf di bacaan!"], "quiz": {"q": "Teks menyatakan: 'Perkin masuk Royal College of Chemistry pada usia 15 tahun setelah didorong gurunya Thomas Hall.' Soal: 'Michael Faraday menyarankan Perkin mendaftar ke Royal College of Chemistry.' Jawabannya adalah:", "choices": ["TRUE", "FALSE", "NOT GIVEN"], "answer": 2}}, {"id": "m5", "skill": "Reading", "title": "Matching Headings & Paragraph Information", "time": 12, "level": "Core Skills", "summary": "Strategi membedakan ide pokok paragraf (List of Headings) dari rincian spesifik (Which paragraph contains...).", "body": ["Untuk 'List of Headings', baca kalimat pertama, kedua, dan terakhir paragraf untuk menangkap payung besar (main idea) paragraf tersebut. Jangan memilih heading hanya karena ada satu kata yang cocok di tengah paragraf.", "Sebaliknya, untuk 'Which paragraph contains the following information', jawaban bisa berada di satu kalimat detail di tengah paragraf, dan urutan soal TIDAK berurutan.", "Kerjakan soal Matching Headings dengan membaca paragraf satu per satu lalu mencocokkannya ke daftar heading, bukan sebaliknya.", "Coret contoh heading yang sudah digunakan di 'Example' agar tidak terpilih dua kali secara tidak sengaja."], "quiz": {"q": "Apa perbedaan utama antara soal 'List of Headings' dan 'Which paragraph contains the following information'?", "choices": ["Headings mencari ide pokok paragraf; Which paragraph mencari lokasi detail spesifik", "Keduanya selalu berurutan dari paragraf A sampai akhir", "Headings boleh menggunakan huruf yang sama lebih dari sekali"], "answer": 0}}, {"id": "m6", "skill": "Writing", "title": "Academic Task 1: Maps, Charts & Process Overview", "time": 14, "level": "Core Skills", "summary": "Cara menyusun Paragraf Overview yang tajam dan membandingkan data tanpa opini pribadi.", "body": ["Dalam Academic Task 1 (minimum 150 kata, waktu ideal 20 menit), penilai mencari 4 hal: Task Achievement (termasuk Overview yang jelas), Coherence & Cohesion, Lexical Resource, dan Grammatical Range & Accuracy.", "Paragraf 1 (Introduction): Parafrase kalimat soal dalam 1–2 kalimat. Paragraf 2 (Overview): Rangkum 2–3 tren utama atau perubahan paling mencolok tanpa mencantumkan angka detail terlebih dahulu.", "Untuk Map Comparison (seperti Pulau Wisata di Cam 9 Test 1 atau Rumah Sakit di Cam 13 Test 1), gunakan kosakata arah mata angin (to the north-west, in the central area) dan kata kerja perubahan (was converted into, was expanded, remained unchanged, was constructed).", "Jangan pernah memasukkan opini pribadi atau spekulasi di luar grafik/peta pada Task 1."], "quiz": {"q": "Komponen apakah yang wajib ada di Academic Task 1 untuk bisa meraih skor Band 6.0 ke atas pada kriteria Task Achievement?", "choices": ["Opini pribadi tentang penyebab data", "Sebuah Overview yang jelas tentang tren/perubahan utama", "Daftar seluruh angka tanpa terkecuali"], "answer": 1}}, {"id": "m7", "skill": "Writing", "title": "Task 2 Essay Architecture for Band 7.5+", "time": 15, "level": "Advanced", "summary": "Struktur 4 paragraf (Introduction, Body 1, Body 2, Conclusion) dan teknik PEEL untuk argumen yang matang.", "body": ["Writing Task 2 memiliki bobot 2x lipat dari Task 1 (minimum 250 kata, waktu ideal 40 menit). Kenali tipe pertanyaannya: Agree/Disagree, Discuss Both Views + Opinion, Advantages Outweigh Disadvantages, atau Problem & Solution.", "Gunakan struktur 4 paragraf: Introduction (Background paraphrase + Thesis Statement/posisi yang jelas), Body Paragraph 1 (Argumen utama 1), Body Paragraph 2 (Argumen utama 2 / pandangan lawan + sanggahan), dan Conclusion (Rangkuman posisi tanpa ide baru).", "Gunakan rumus PEEL di setiap Body Paragraph: Point (Topic sentence yang jelas), Explanation (Mengapa hal itu terjadi/penting), Example (Contoh konkret/nyata), dan Link (Kaitkan kembali ke pertanyaan esai).", "Hindari menghafal template klise yang kaku; gunakan cohesive devices secara alami seperti 'Consequently', 'By contrast', 'A compelling illustration of this is', dan 'Granted, some argue that...'."], "quiz": {"q": "Dalam esai 'Discuss both views and give your own opinion', apa yang terjadi jika Anda hanya membahas satu sisi pandangan?", "choices": ["Tetap bisa mendapat Band 8 jika grammar sempurna", "Skor Task Response tertahan maksimal di Band 5.0 karena hanya menjawab sebagian tugas", "Tidak berpengaruh selama jumlah kata lebih dari 300"], "answer": 1}}, {"id": "m8", "skill": "Speaking", "title": "Speaking Part 1, 2 & 3: Fluency, Cue Card & Depth", "time": 12, "level": "Core Skills", "summary": "Strategi berbicara lancar tanpa jeda panjang, menguasai 1 menit persiapan Part 2, dan analisis abstrak Part 3.", "body": ["Part 1 (4–5 menit): Pertanyaan tentang diri Anda, rumah, pekerjaan, atau hobi. Jawab dalam 2–4 kalimat menggunakan pola Direct Answer + Reason + Short Detail.", "Part 2 (3–4 menit): Anda diberi Cue Card dan 1 menit persiapan untuk berbicara 1–2 menit. Gunakan 1 menit untuk mencatat kata kunci (bukan kalimat penuh) menggunakan metode PPF (Past context, Present description, Future reflection/feeling).", "Part 3 (4–5 menit): Diskusi mendalam dan abstrak terkait topik Part 2. Jangan gunakan contoh diri sendiri terus-menerus; bahas masyarakat luas (general society), bandingkan kelompok usia/negara, dan jelaskan sebab-akibat.", "Kunci skor tinggi pada Fluency & Coherence adalah berbicara dengan alur logis tanpa sering berhenti untuk mencari kata (self-correction wajar diperbolehkan)."], "quiz": {"q": "Bagaimana cara terbaik menjawab pertanyaan Speaking Part 3 seperti 'Why do some people like doing new things?'", "choices": ["Menjawab 1 kalimat pendek 'Because it is fun'", "Menceritakan pengalaman liburan pribadi selama 2 menit", "Memberikan alasan umum di masyarakat, contoh konkret, serta membandingkan tipe kepribadian yang berbeda"], "answer": 2}}, {"id": "m9", "skill": "Writing", "title": "General Training Task 1: Formal, Semi-Formal & Informal Letters", "time": 10, "level": "Core Skills", "summary": "Panduan memilih nada surat (tone), salam pembuka/penutup, dan menjawab ketiga bullet point secara merata.", "body": ["Pada General Training Task 1 (misal Cam 9 GT Test A: meminta izin cuti kepada manajer, atau Test B: klaim asuransi perjalanan), Anda wajib menulis surat minimal 150 kata.", "Tentukan Tone sejak awal: Formal (Dear Sir or Madam -> Yours faithfully, tanpa kontraksi), Semi-formal untuk manajer/tetangga yang dikenal (Dear Mr/Ms [Nama] -> Yours sincerely / Best regards), atau Informal untuk teman (Dear [Nama Depan] -> Best wishes / Warm regards).", "Dedikasikan satu paragraf pendek yang jelas untuk setiap bullet point pada soal agar penguji langsung melihat bahwa ketiga poin terjawab tuntas.", "Buka surat formal/semi-formal dengan kalimat tujuan langsung: 'I am writing to request...' atau 'I am writing to bring to your attention...'."], "quiz": {"q": "Jika surat GT Task 1 diawali dengan 'Dear Sir or Madam,', bagaimanakah penutup (sign-off) standar yang tepat?", "choices": ["Yours sincerely,", "Yours faithfully,", "Best wishes,"], "answer": 1}}, {"id": "m10", "skill": "Reading", "title": "Summary Completion & Diagram Labelling Precision", "time": 10, "level": "Core Skills", "summary": "Cara menaklukkan soal rangkuman dengan kotak pilihan kata (word bank) maupun langsung dari bacaan.", "body": ["Ada dua jenis Summary Completion: (1) Memilih kata langsung dari bacaan (perhatikan batas kata seperti NO MORE THAN TWO WORDS), dan (2) Memilih huruf A–K dari kotak daftar kata (sering kali berupa sinonim dari kata di teks).", "Prediksi kelas kata (part of speech) untuk setiap celah kosong: apakah membutuhkan kata benda (noun), kata sifat (adjective), kata kerja (verb), atau kata keterangan (adverb).", "Pada Diagram Labelling (seperti Turbin Bawah Laut di Cam 9 Test 3 atau Kura-kura di Cam 9 Test 1), perhatikan petunjuk visual seperti tanda panah, urutan langkah (Step 1–4), dan kata-kata posisi.", "Pastikan ejaan dan bentuk tunggal/jamak sesuai dengan konteks tata bahasa kalimat di rangkuman."], "quiz": {"q": "Pada kalimat rangkuman: 'The data was recorded on a 35 ............ (necessary for comparing the information).' Kelas kata apakah yang dibutuhkan pada nomor 35?", "choices": ["Kata benda tunggal (singular noun / phrase)", "Kata kerja bentuk lampau (past verb)", "Kata keterangan (adverb)"], "answer": 0}}, {"id": "m11", "skill": "Writing", "title": "Grammatical Range & Complex Sentences for Band 7+", "time": 11, "level": "Advanced", "summary": "Cara menggabungkan kalimat sederhana dan kompleks secara akurat untuk mendongkrak skor Grammar.", "body": ["Untuk mencapai Band 7.0+ pada kriteria Grammatical Range and Accuracy, Anda perlu menggunakan berbagai struktur kalimat kompleks (complex structures) dengan mayoritas kalimat bebas dari kesalahan (frequent error-free sentences).", "Gunakan variasi struktur: (1) Conditional clauses ('If governments invested more in rail networks, urban congestion would decline significantly'), (2) Relative clauses ('Public transport, which accounts for a small fraction of city spending, offers long-term economic returns'), dan (3) Concession clauses ('Although advertising stimulates short-term sales, genuine utility determines long-term loyalty').", "Gunakan kalimat pasif (passive voice) saat menjelaskan proses atau perubahan peta: 'The old car park was demolished and replaced by a bus station in 2010.'", "Sisihkan 3–4 menit terakhir ujian untuk mengecek kesalahan umum: subject-verb agreement, penggunaan artikel (a/an/the), serta bentuk jamak."], "quiz": {"q": "Manakah di bawah ini yang merupakan kalimat kompleks dengan klausa konsesi (concession) yang tepat untuk IELTS Writing?", "choices": ["People buy cars. Cars are expensive. Roads are full.", "While modern technology facilitates remote communication, face-to-face interaction remains vital for creativity.", "Technology is good because people like phones very much."], "answer": 1}}, {"id": "m12", "skill": "Reading", "title": "Academic Vocabulary, Collocations & Paraphrasing Mastery", "time": 10, "level": "Advanced", "summary": "Menguasai pola parafrase Cambridge IELTS agar cepat menemukan bukti di Reading dan Listening.", "body": ["Kunci utama IELTS adalah mengenali parafrase. Contoh nyata dari Cambridge 6 & 9: 'worldwide' = 'international', 'declining' = 'beating a retreat / falling', 'a century' = '100 years', 'two decades' = '20 years', 'annually' = 'per year'.", "Pelajari kolokasi akademik (academic collocations) alih-alih kata tunggal yang terisolasi: 'viable alternative', 'compelling evidence', 'detrimental effect', 'stark contrast', 'alleviate traffic congestion', 'sedentary lifestyle'.", "Saat berlatih di Astra IELTS Pro, catat setiap pasangan kata di soal vs kata di teks bacaan. Pola sinonim yang sama sering berulang lintas buku Cambridge.", "Gunakan dek Flashcard Akademik di aplikasi ini untuk menghafal dan menguji penguasaan kosakata berfrekuensi tinggi."], "quiz": {"q": "Dalam Cambridge 9 Test 2 ('Hearing impairment'), frasa 'over two decades' di teks diparafrasekan pada kunci jawaban menjadi:", "choices": ["twenty years / two decades", "two centuries", "twelve months"], "answer": 0}}], "flashcards": [{"id": "v1", "word": "Underpinned by", "cat": "Academic Verb", "meaning": "Didukung atau diperkuat sebagai fondasi utama", "example": "Australia's sporting success is underpinned by science and medicine. (Cam 6 T1)"}, {"id": "v2", "word": "Unobtrusive", "cat": "Adjective", "meaning": "Tidak mencolok atau tidak mengganggu kenyamanan", "example": "Scientists are developing unobtrusive sensors embedded in an athlete's clothes. (Cam 6 T1)"}, {"id": "v3", "word": "Deregulation", "cat": "Economics / Trade", "meaning": "Penghapusan aturan/pembatasan pemerintah pada industri", "example": "In the mid-1970s, America began to deregulate its transportation industry. (Cam 6 T1)"}, {"id": "v4", "word": "Precarious", "cat": "Adjective", "meaning": "Tidak stabil, penuh risiko, atau rentan bahaya", "example": "The Inuit live in precarious balance with one of the toughest environments on earth. (Cam 6 T1)"}, {"id": "v5", "word": "Autonomy", "cat": "Society / Politics", "meaning": "Kemandirian atau hak mengatur pemerintahan sendiri", "example": "The Inuit people are guarding their hard-won autonomy in Nunavut. (Cam 6 T1)"}, {"id": "v6", "word": "Afflicting", "cat": "Health / Medicine", "meaning": "Menjangkiti, menyebabkan penderitaan atau masalah", "example": "Diseases associated with old age are afflicting fewer and fewer people. (Cam 6 T2)"}, {"id": "v7", "word": "Self-reliance", "cat": "Society / Health", "meaning": "Kemandirian; kemampuan mengandalkan diri sendiri", "example": "The increasing self-reliance of elderly people is linked to simple home medical aids. (Cam 6 T2)"}, {"id": "v8", "word": "Retrenchment", "cat": "Business", "meaning": "Pengurangan biaya atau perampingan organisasi", "example": "The challenge to management is how to motivate employees under retrenchment conditions. (Cam 6 T3)"}, {"id": "v9", "word": "Contingent on", "cat": "Academic Phrase", "meaning": "Bergantung pada syarat tertentu", "example": "Managers need to make rewards contingent on performance. (Cam 6 T3)"}, {"id": "v10", "word": "Longevity", "cat": "Science / Health", "meaning": "Umur panjang atau masa hidup yang lama", "example": "Caloric restriction could delay aging and increase longevity in humans. (Cam 6 T3)"}, {"id": "v11", "word": "Recalcitrant", "cat": "Adjective", "meaning": "Sulit diatur, membandel, atau resisten terhadap penanganan", "example": "Persistent bullying cases in secondary schools may be particularly recalcitrant. (Cam 6 T4)"}, {"id": "v12", "word": "Viable", "cat": "Adjective", "meaning": "Dapat diterapkan dan berhasil secara praktis", "example": "At the time, quinine was the only viable medical treatment for malaria. (Cam 9 T1)"}, {"id": "v13", "word": "Tenuous", "cat": "Adjective", "meaning": "Lemah, tipis, atau belum pasti bertahan", "example": "Threats of nuclear war and pollution have told us that our survival may be tenuous. (Cam 9 T1)"}, {"id": "v14", "word": "Attenuated", "cat": "Science", "meaning": "Melemah atau berkurang kekuatannya", "example": "Signals are severely attenuated while traversing vast distances across the galaxy. (Cam 9 T1)"}, {"id": "v15", "word": "Detrimental", "cat": "Adjective", "meaning": "Merugikan atau berdampak buruk", "example": "Hearing impairment can have a detrimental effect on a child's ability to learn. (Cam 9 T2)"}, {"id": "v16", "word": "Exacerbate", "cat": "Academic Verb", "meaning": "Memperburuk keadaan yang sudah bermasalah", "example": "Noise in classrooms can only exacerbate their difficulty in comprehending speech. (Cam 9 T2)"}, {"id": "v17", "word": "Superseded", "cat": "Academic Verb", "meaning": "Digantikan oleh sesuatu yang lebih baru/unggul", "example": "Radar has now superseded transits and all other methods in accuracy. (Cam 9 T2)"}, {"id": "v18", "word": "Iconoclast", "cat": "Psychology", "meaning": "Orang yang menantang pola pikir konvensional/melakukan hal yang dianggap mustahil", "example": "An iconoclast is a person who does something that others say can't be done. (Cam 9 T2)"}, {"id": "v19", "word": "Prescriptivism", "cat": "Linguistics", "meaning": "Pandangan bahwa satu variasi bahasa lebih benar dan wajib diikuti", "example": "Prescriptivism is the view that one variety of language has an inherently higher value. (Cam 9 T3)"}, {"id": "v20", "word": "Prodigious", "cat": "Adjective", "meaning": "Luar biasa besar atau mengagumkan (bakat/ingatan)", "example": "From childhood, Marie Curie was remarkable for her prodigious memory. (Cam 9 T4)"}, {"id": "v21", "word": "Infallible", "cat": "Adjective", "meaning": "Tidak mungkin salah; selalu akurat", "example": "The conviction that historical relics provide infallible testimony about the past. (Cam 9 T4)"}, {"id": "v22", "word": "Transitory", "cat": "Adjective", "meaning": "Sementara; tidak bertahan lama", "example": "Another source of bias has to do with the transitory nature of the materials themselves. (Cam 9 T4)"}, {"id": "v23", "word": "Exhilarating", "cat": "Adjective", "meaning": "Sangat mendebarkan dan menyenangkan", "example": "The campaign focused on New Zealand's scenic beauty and exhilarating outdoor activities. (Cam 13 T1)"}, {"id": "v24", "word": "Alleviate", "cat": "Academic Verb", "meaning": "Meringankan atau mengurangi masalah/rasa sakit", "example": "What can we do to alleviate boredom before it puts us in danger? (Cam 13 T1)"}, {"id": "v25", "word": "Exorbitantly", "cat": "Adverb", "meaning": "Secara berlebihan / sangat mahal", "example": "The Venetians could set the price of cinnamon exorbitantly high. (Cam 13 T2)"}, {"id": "v26", "word": "Lucrative", "cat": "Business", "meaning": "Sangat menguntungkan secara finansial", "example": "The Dutch expelled the Portuguese, gaining control of the lucrative cinnamon trade. (Cam 13 T2)"}, {"id": "v27", "word": "Nuanced", "cat": "Adjective", "meaning": "Memiliki perbedaan halus dan mendalam", "example": "A more nuanced understanding of oxytocin's effects is propelling new investigations. (Cam 13 T2)"}, {"id": "v28", "word": "Ceding", "cat": "Business Verb", "meaning": "Menyerahkan (peluang/kekuasaan) kepada pihak lain", "example": "Ignoring trends can jeopardize a company by ceding to rivals the opportunity to transform the industry. (Cam 13 T2)"}, {"id": "v29", "word": "Repertoire", "cat": "Linguistics", "meaning": "Kumpulan keterampilan atau variasi kemampuan yang dimiliki", "example": "The kid then has a wider repertoire of kinds of speech to practice. (Cam 13 T3)"}, {"id": "v30", "word": "Demise", "cat": "History / Noun", "meaning": "Keruntuhan atau berakhirnya suatu peradaban/institusi", "example": "After their final demise, a millennium passed before large-scale cities appeared again. (Cam 13 T3)"}, {"id": "v31", "word": "Indiscriminate", "cat": "Adjective", "meaning": "Tanpa pilih-pilih / sembarangan tanpa memikirkan dampak", "example": "Indiscriminate use of fertilisers hurts the soil itself, turning it acidic and salty. (Cam 13 T4)"}, {"id": "v32", "word": "Oblivious", "cat": "Adjective", "meaning": "Tidak menyadari atau mengabaikan apa yang ada di sekitar", "example": "Those who think in this way are oblivious to the vast philosophical literature. (Cam 13 T4)"}, {"id": "v33", "word": "Drudgery", "cat": "History & Culture", "meaning": "Pekerjaan berat yang membosankan dan monoton", "example": "Compiling a dictionary in the 18th century was seen as tedious drudgery. (Cam 5 T1)"}, {"id": "v34", "word": "Perpetuate", "cat": "Academic Verb", "meaning": "Melanggengkan atau membuat sesuatu terus berlangsung lama", "example": "Johnson hoped his dictionary would perpetuate the purity of the English tongue. (Cam 5 T1)"}, {"id": "v35", "word": "Circumscribed", "cat": "Adjective & Adverb", "meaning": "Dibatasi dalam ruang lingkup tertentu", "example": "The lexicographer's task had previously been circumscribed by royal academies. (Cam 5 T1)"}, {"id": "v36", "word": "Confer", "cat": "Academic Verb", "meaning": "Memberikan (gelar/kehormatan) atau berunding", "example": "Oxford University conferred an honorary degree upon Samuel Johnson. (Cam 5 T1)"}, {"id": "v37", "word": "Flinch", "cat": "Health & Psychology", "meaning": "Mengernyit atau mundur karena rasa takut/sakit", "example": "Most subjects obeyed the experimenter without flinching at first. (Cam 5 T1)"}, {"id": "v38", "word": "Malevolent", "cat": "Health & Psychology", "meaning": "Berniat jahat atau ingin mencelakakan orang lain", "example": "Milgram showed that ordinary people need not be malevolent to follow destructive orders. (Cam 5 T1)"}, {"id": "v39", "word": "Plausible", "cat": "Adjective & Adverb", "meaning": "Masuk akal dan dapat dipercaya", "example": "Each perspective offers a plausible explanation for the teacher-subjects' behaviour. (Cam 5 T1)"}, {"id": "v40", "word": "Furore", "cat": "Society & Policy", "meaning": "Kegemparan atau kemarahan publik yang besar", "example": "The sociobiology debate caused a furore in academic circles. (Cam 5 T1)"}, {"id": "v41", "word": "Sceptical", "cat": "Adjective & Adverb", "meaning": "Ragu-ragu atau tidak mudah percaya tanpa bukti", "example": "Many scientists are sceptical of claims that the world is coming to an end. (Cam 5 T1)"}, {"id": "v42", "word": "Abundant", "cat": "Environment", "meaning": "Melimpah atau tersedia dalam jumlah besar", "example": "Natural resources are more abundant and cheaper than fifty years ago. (Cam 5 T1)"}, {"id": "v43", "word": "Altruistic", "cat": "Society & Policy", "meaning": "Mementingkan kesejahteraan orang lain tanpa pamrih", "example": "Environmental policies should be based on sound priorities rather than purely altruistic slogans. (Cam 5 T1)"}, {"id": "v44", "word": "Malleable", "cat": "Science & Tech", "meaning": "Mudah ditempa, dibentuk, atau disesuaikan", "example": "Thermoplastics become malleable again whenever they are reheated. (Cam 5 T2)"}, {"id": "v45", "word": "Impetus", "cat": "Academic Verb", "meaning": "Dorongan atau pemicu yang mempercepat suatu proses", "example": "Dwindling supplies of natural shellac gave fresh impetus to synthetic plastic research. (Cam 5 T2)"}, {"id": "v46", "word": "Volatile", "cat": "Science & Tech", "meaning": "Mudah menguap atau mudah berubah secara mendadak", "example": "Heating phenol and formaldehyde often produced a volatile, violent reaction. (Cam 5 T2)"}, {"id": "v47", "word": "Disdain", "cat": "Society & Policy", "meaning": "Sikap meremehkan atau memandang rendah", "example": "By the 1950s, cheap plastics were sometimes viewed with disdain by consumers. (Cam 5 T2)"}, {"id": "v48", "word": "Innate", "cat": "Health & Psychology", "meaning": "Bawaan sejak lahir; alami", "example": "Laughter appears to be an innate human signal shared across all cultures. (Cam 5 T2)"}, {"id": "v49", "word": "Opaque", "cat": "Adjective & Adverb", "meaning": "Tidak tembus pandang atau sulit dipahami", "example": "Latin remained an opaque barrier to ordinary artisans outside universities. (Cam 5 T2)"}, {"id": "v50", "word": "hegemony", "cat": "Society & Policy", "meaning": "Dominasi atau kepemimpinan satu negara/bahasa atas yang lain", "example": "English gradually challenged the long-standing hegemony of Latin in European science. (Cam 5 T2)"}, {"id": "v51", "word": "Catalyst", "cat": "Science & Tech", "meaning": "Pemicu perubahan cepat", "example": "The Royal Society acted as a catalyst for publishing scientific findings in English. (Cam 5 T2)"}, {"id": "v52", "word": "Remedial", "cat": "Society & Policy", "meaning": "Bertujuan memperbaiki kelemahan belajar", "example": "Headstart funded remedial programmes for disadvantaged preschool children. (Cam 5 T3)"}, {"id": "v53", "word": "Replenish", "cat": "Environment", "meaning": "Mengisi kembali atau memulihkan persediaan yang berkurang", "example": "Annual Nile floods used to replenish the delta with fertile silt. (Cam 5 T3)"}, {"id": "v54", "word": "Scour", "cat": "Environment", "meaning": "Mengikis atau menyapu bersih permukaan dengan arus kuat", "example": "Coastal currents now scour away the shoreline of the Nile Delta. (Cam 5 T3)"}, {"id": "v55", "word": "Desalination", "cat": "Environment", "meaning": "Proses menghilangkan kadar garam dari air laut", "example": "Desalination plants are expensive to operate for large-scale agriculture. (Cam 5 T3)"}, {"id": "v56", "word": "Trough", "cat": "Economics & Business", "meaning": "Titik terendah dalam siklus ekonomi atau riset", "example": "After a long funding trough in the 1970s, artificial intelligence is rebounding. (Cam 5 T3)"}, {"id": "v57", "word": "Ubiquitous", "cat": "Adjective & Adverb", "meaning": "Ada di mana-mana pada saat yang sama", "example": "AI algorithms have become ubiquitous in search engines and medical diagnostics. (Cam 5 T3)"}, {"id": "v58", "word": "Fragile", "cat": "Environment", "meaning": "Rapuh dan mudah rusak oleh gangguan luar", "example": "High-altitude mountain ecosystems are exceptionally fragile. (Cam 5 T4)"}, {"id": "v59", "word": "Erosion", "cat": "Environment", "meaning": "Pengikisan tanah atau batuan oleh air dan angin", "example": "Deforestation on steep slopes accelerates soil erosion in Nepal. (Cam 5 T4)"}, {"id": "v60", "word": "Lucid", "cat": "Adjective & Adverb", "meaning": "Jelas dan mudah dimengerti", "example": "The report offers a lucid analysis of how ecotourism affects hill tribes. (Cam 5 T4)"}, {"id": "v61", "word": "Propagate", "cat": "Science & Tech", "meaning": "Menyebarkan atau merambatkan (retakan, gelombang, tanaman)", "example": "Once the crystal expands, micro-cracks propagate rapidly through toughened glass. (Cam 5 T4)"}, {"id": "v62", "word": "Dormant", "cat": "Science & Tech", "meaning": "Tidak aktif sementara waktu (tidur/laten)", "example": "Nickel sulphide inclusions can remain dormant in a glass pane for years. (Cam 5 T4)"}, {"id": "v63", "word": "Photoperiodism", "cat": "Environment", "meaning": "Respons organisme terhadap panjang pendeknya siang dan malam", "example": "Photoperiodism governs when seasonal plants flower and birds migrate. (Cam 5 T4)"}, { Adverb", "meaning": "Belum pernah terjadi sebelumnya dalam sejarah", "example": "Global container shipping grew at an unprecedented pace after the 1970s. (Cam 6 T1)"}, {"id": "v162", "word": "Discrepancy", "cat": "Academic Verb", "meaning": "Ketidaksesuaian atau selisih antara dua data yang seharusnya cocok", "example": "Astronomers noticed a slight discrepancy in the timing of Venus's contact with the sun. (Cam 9 T2)"}, {"id": "v163", "word": "Paradigm Shift", "cat": "Science & Tech", "meaning": "Perubahan mendasar dalam kerangka berpikir ilmiah", "example": "Plate tectonics triggered a paradigm shift in twentieth-century geology. (Cam 8 T1)"}, {"id": "v164", "word": "Empirical", "cat": "Science & Tech", "meaning": "Berdasarkan pengamatan dan eksperimen nyata, bukan teori semata", "example": "Milgram sought empirical data on how far ordinary citizens would obey authority. (Cam 5 T1)"}, {"id": "v165", "word": "Diminishing Returns", "cat": "Economics & Business", "meaning": "Hasil tambahan yang semakin kecil meskipun investasi terus ditambah", "example": "Adding extra fertiliser eventually yields diminishing returns and degrades soil health. (Cam 13 T4)"}, {"id": "v166", "word": "Conglomerate", "cat": "Economics & Business", "meaning": "Perusahaan besar yang membawahi banyak anak usaha lintas sektor", "example": "Media conglomerates acquire smaller studios to diversify their revenue streams. (Cam 13 T2)"}, {"id": "v167", "word": "Demographic", "cat": "Society & Policy", "meaning": "Berkaitan dengan struktur kependudukan (usia, kelahiran, lansia)", "example": "Japan faces a rapid demographic transition as the proportion of retirees rises. (Cam 5 T1)"}, {"id": "v168", "word": "Sedentary", "cat": "Health & Psychology", "meaning": "Kurang gerak fisik; banyak duduk", "example": "A sedentary office lifestyle contributes to rising obesity and cardiovascular risks. (Cam 8 T4)"}, {"id": "v169", "word": "Conducive", "cat": "Adjective & Adverb", "meaning": "Mendukung terciptany dan praktik pengajaran", "example": "Whole-class interactive pedagogy helps slower pupils keep pace in mathematics. (Cam 8 T4)"}, {"id": "v179", "word": "Pathogen", "cat": "Health & Psychology", "meaning": "Mikroorganisme penyebab penyakit (bakteri, virus, jamur)", "example": "Genetic uniformity makes monoculture crops vulnerable to a single new pathogen. (Cam 7 T3)"}, {"id": "v180", "word": "Resilient", "cat": "Adjective & Adverb", "meaning": "Tangguh dan cepat pulih dari guncangan atau krisis", "example": "Mixed-species forests are far more resilient to storms and bark beetles. (Cam 7 T3)"}, {"id": "v181", "word": "Artisan", "cat": "History & Culture", "meaning": "Pengrajin terampil yang membuat barang dengan tangan", "example": "Seventeenth-century instrument makers and artisans demanded practical books in English. (Cam 5 T2)"}, {"id": "v182", "word": "Vernacular", "cat": "History & Culture", "meaning": "Bahasa sehari-hari masyarakat lokal (bukan bahasa klasik/Latin)", "example": "Galileo and Newton eventually published key works in the vernacular rather than Latin. (Cam 5 T2)"}, {"id": "v183", "word": "Stratification", "cat": "Society & Policy", "meaning": "Pelapisan kelas sosial atau lapisan air/tanah", "example": "Harappan cities showed remarkably little evidence of extreme royal stratification. (Cam 13 T3)"}, {"id": "v184", "word": "Civic", "cat": "Society & Policy", "meaning": "Berkaitan dengan warga kota dan tanggung jawab kemasyarakatan", "example": "Mohenjo-daro featured advanced civic planning, including covered brick drains. (Cam 13 T3)"}, {"id": "v185", "word": "Procurement", "cat": "Economics & Business", "meaning": "Proses pengadaan barang dan jasa untuk organisasi", "example": "Centralized procurement lowered the hospital's equipment expenditure by 18 per cent. (Cam 6 T3)"}, {"id": "v186", "word": "Turnover", "cat": "Economics & Business", "meaning": "Tingkat keluar-masuk pergantian karyawan (atau total omzet)", "example": "High staff turnover disrupts service quality in the hospitality sector. (Cam 9 T1)"}, {"id": "v187", "word": "Remuneration", "cat": "Economics & Business", "meaning": "Imbalan gaji dan tunjangan atas pekerjaan", "example": "Fair remuneration must be paired with recognition to sustain employee morale. (Cam 6 T3)"}, {"id": "v188", "word": "Intrinsic", "cat": "Health & Psychology", "meaning": "Berasal dari kepuasan batin sendiri, bukan hadiah luar", "example": "Intrinsic curiosity drives scientists to persist through years of failed experiments. (Cam 8 T3)"}, {"id": "v189", "word": "Extrinsic", "cat": "Economics & Business", "meaning": "Berasal dari faktor luar seperti uang, piala, atau hukuman", "example": "Relying solely on extrinsic bonuses can crowd out creative risk-taking. (Cam 6 T3)"}, {"id": "v190", "word": "equilibrium", "cat": "Science & Tech", "meaning": "Keadaan seimbang antara kekuatan-kekuatan yang berlawanan", "example": "Predator and prey populations oscillate around a dynamic ecological equilibrium. (Cam 8 T4)"}, {"id": "v191", "word": " proliferation", "cat": "Society & Policy", "meaning": "Penyebaran atau pertambahan jumlah yang sangat pesat", "example": "The proliferation of smartphones has blurred the boundary between work and leisure. (Cam 13 T2)"}, {"id": "v192", "word": "Obsolete", "cat": "Science & Tech", "meaning": "Usang dan tidak dipakai lagi karena digantikan teknologi baru", "example": "Steamships and the Suez Canal rendered sailing clippers commercially obsolete. (Cam 13 T4)"}, {"id": "v193", "word": "Retrospective", "cat": "Academic Verb", "meaning": "Meninjau kembali peristiwa yang sudah terjadi di masa lalu", "example": "A retrospective analysis of hospital admissions revealed a drop in respiratory illness. (Cam 6 T2)"}, {"id": "v194", "word": "Correlate", "cat": "Academic Verb", "meaning": "Memiliki hubungan timbal balik secara statistik", "example": "Classroom noise levels correlate negatively with reading comprehension scores. (Cam 9 T2)"}, {"id": "v195", "word": "Causation", "cat": "Science & Tech", "meaning": "Hubungan sebab-akibat langsung", "example": "Researchers cautioned that correlation between diet and longevity does not prove causation. (Cam 6 T3)"}, {"id": "v196", "word": "watershed", "cat": "History & Culture", "meaning": "Titik balik bersejarah yang mengubah keadaan secara permanen", "example": "The 1952 float glass patent marked a watershed in industrial manufacturing. (Cam 8 T2)"}, {"id": "v197", "word": "Impede", "cat": "Academic Verb", "meaning": "Menghambat atau memperlambat kemajuan", "example": "Strict state monopolies continue to impede freight efficiency in developing ports. (Cam 6 T1)"}, {"id": "v198", "word": "Bolster", "cat": "Academic Verb", "meaning": "Memperkuat atau menopang (argumen, ekonomi, kepercayaan diri)", "example": "International sports academies bolster national pride and elite medal tallies. (Cam 6 T1)"}, {"id": "v199", "word": "Foster", "cat": "Academic Verb", "meaning": "Menumbuhkan atau mendorong perkembangan ide/hubungan baik", "example": "Allowing mild constructive boredom can foster daydreaming and creative problem-solving. (Cam 13 T1)"}, {"id": "v200", "word": "Paramount", "cat": "Adjective & Adverb", "meaning": "Paling utama dan lebih penting daripada segalanya", "example": "Passenger safety remains of paramount importance in modern air traffic control. (Cam 8 T1)"}], "packages": [{"id": "pkg-r1", "num": 1, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 1 · Passage 1", "title": "Australia's Sporting Success", "subtitle": "Sports science, AIS & biomechanical analysis", "minutes": 20, "passage": "AUSTRALIA'S SPORTING SUCCESS\n\nParagraph A\nThey play hard, they play often, and they play to win. Australian sports teams win more than their fair share of titles, demolishing rivals with seeming ease. How do they do it? A big part of the secret is an extensive and expensive network of sporting academies underpinned by science and medicine. At the Australian Institute of Sport (AIS), hundreds of youngsters and pros live and train under the eyes of coaches. Another body, the Australian Sports Commission (ASC), finances programmes of excellence in a total of 96 sports for thousands of sportsmen and women. Both provide intensive coaching, training facilities and nutritional advice.\n\nParagraph B\nInside the academies, science takes centre stage. The AIS employs more than 100 sports scientists and doctors, and collaborates with scores of others in universities and research centres. AIS scientists work across a number of sports, applying skills learned in one — such as building muscle strength in golfers — to others, such as swimming and squash. They are backed up by technicians who design instruments to collect data from athletes. They all focus on one aim: winning. 'We can't waste our time looking at ethereal scientific questions that don't help the coach work with an athlete and improve performance,' says Peter Fricker, chief of science at AIS.\n\nParagraph C\nA lot of their work comes down to measurement — everything from the exact angle of a swimmer's dive to the second-by-second power output of a cyclist. This data is used to wring improvements out of athletes. The focus is on individuals, tweaking performances to squeeze an extra hundredth of a second here, an extra millimetre there. No gain is too slight to bother with. To demonstrate how the system works, Bruce Mason at AIS shows off the prototype of a 3D analysis tool for studying swimmers. A wire-frame model of a champion swimmer slices through the water, her arms moving in slow motion. Mason's contribution to sport also includes the development of the SWAN (SWimming ANalysis) system now used in Australian national competitions. It collects images from digital cameras running at 50 frames a second and breaks down each part of a swimmer's performance into factors that can be analysed individually.\n\nParagraph D\n'Take a look,' says Mason, pulling out a sheet of data. He points out the data on the swimmers in second and third place, which shows that the one who finished third actually swam faster. So why did he finish 35 hundredths of a second down? 'His turn times were 44 hundredths of a second behind the other guy,' says Mason. 'If he can improve on his turns, he can do much better.' With the Cooperative Research Centre for Micro Technology in Melbourne, they are developing unobtrusive sensors that will be embedded in an athlete's clothes or running shoes to monitor heart rate, sweating, heat production or any other factor. Fricker gives the example of athletes who may be down with coughs and colds 11 or 12 times a year. After years of experimentation, AIS and the University of Newcastle developed a test that measures how much of the immune-system protein immunoglobulin A (IgA) is present in athletes' saliva. If IgA levels suddenly fall below a certain level, training is eased or dropped altogether.\n\nParagraph E\nUsing data is a complex business. Well before a championship, sports scientists and coaches start to prepare the athlete by developing a 'competition model', based on what they expect will be the winning times. 'You design the model to make that time,' says Mason. 'A start of this much, each free-swimming period has to be this fast, with a certain stroke frequency and stroke length, with turns done in these times.' All the training is then geared towards making the athlete hit those targets.\n\nParagraph F\nOf course, there's nothing to stop other countries copying — and many have tried. Some years ago, the AIS unveiled coolant-lined jackets for endurance athletes. At the Atlanta Olympic Games in 1996, these sliced as much as two per cent off cyclists' and rowers' times. Now everyone uses them. The same has happened to the 'altitude tent', developed by AIS to replicate the effect of altitude training at sea level. But Australia's success story is about more than easily copied technological fixes, and up to now no nation has replicated its all-encompassing system.", "questions": [{"q": "Which paragraph contains a reference to the exchange of expertise between different sports?", "options": ["Paragraph A", "Paragraph B", "Paragraph C", "Paragraph D"], "a": 1, "why": "Paragraph B states: 'AIS scientists work across a number of sports, applying skills learned in one — such as building muscle strength in golfers — to others, such as swimming and squash.'"}, {"q": "Which paragraph contains an explanation of how visual imaging is employed in investigations?", "options": ["Paragraph B", "Paragraph C", "Paragraph E", "Paragraph F"], "a": 1, "why": "Paragraph C explains the 3D wire-frame model and the SWAN system collecting images from digital cameras at 50 frames a second."}, {"q": "Which paragraph gives a reason for narrowing the scope of research activity?", "options": ["Paragraph A", "Paragraph B", "Paragraph D", "Paragraph E"], "a": 1, "why": "Paragraph B quotes Peter Fricker: 'We can't waste our time looking at ethereal scientific questions that don't help the coach work with an athlete and improve performance.'"}, {"q": "Which paragraph mentions how some AIS ideas have been reproduced by others?", "options": ["Paragraph C", "Paragraph D", "Paragraph E", "Paragraph F"], "a": 3, "why": "Paragraph F notes: 'Of course, there's nothing to stop other countries copying — and many have tried... Now everyone uses them.'"}, {"q": "Which paragraph explains how obstacles to optimum achievement (such as slow turns or illness) can be investigated?", "options": ["Paragraph A", "Paragraph C", "Paragraph D", "Paragraph F"], "a": 2, "why": "Paragraph D discusses investigating turn times and testing salivary IgA levels to prevent coughs and colds."}, {"q": "Which paragraph provides an overview of the funded support of athletes?", "options": ["Paragraph A", "Paragraph B", "Paragraph D", "Paragraph E"], "a": 0, "why": "Paragraph A introduces the AIS and the Australian Sports Commission (ASC) financing programmes in 96 sports."}, {"q": "According to the passage, how are 'unobtrusive sensors' in clothes and running shoes classified?", "options": ["Currently exclusively used by Australians", "Will be used in the future by Australians", "Currently used by both Australians and their rivals"], "a": 1, "why": "Paragraph D states: 'they are developing unobtrusive sensors that will be embedded in an athlete's clothes or running shoes' (future use)."}, {"q": "How are 'altitude tents' classified according to the writer?", "options": ["Currently exclusively used by Australians", "Will be used in the future by Australians", "Currently used by both Australians and their rivals"], "a": 2, "why": "Paragraph F explains that after AIS unveiled coolant jackets ('Now everyone uses them'), 'The same has happened to the altitude tent'."}, {"q": "What is produced before an event to help an athlete plan their target performance?", "options": ["A competition model", "An altitude tent", "A saliva protein test", "A coolant jacket"], "a": 0, "why": "Paragraph E states: 'sports scientists and coaches start to prepare the athlete by developing a competition model, based on what they expect will be the winning times.'"}, {"q": "By how much did some cyclists' and rowers' performance improve at the 1996 Olympic Games using coolant-lined jackets?", "options": ["2 per cent", "10 per cent", "35 hundredths", "50 frames"], "a": 0, "why": "Paragraph F states: 'At the Atlanta Olympic Games in 1996, these sliced as much as two per cent off cyclists' and rowers' times.'"}]}, {"id": "pkg-r2", "num": 2, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 1 · Passage 2", "title": "Delivering the Goods", "subtitle": "The revolution in moving international freight", "minutes": 20, "passage": "DELIVERING THE GOODS\nThe vast expansion in international trade owes much to a revolution in the business of moving freight.\n\nParagraph A\nInternational trade is growing at a startling pace. While the global economy has been expanding at a bit over 3% a year, the volume of trade has been rising at a compound annual rate of about twice that. Foreign products, from meat to machinery, play a more important role in almost every economy in the world.\n\nParagraph B\nWhat lies behind this explosion in international commerce? The general worldwide decline in trade barriers, such as customs duties and import quotas, is surely one explanation. The economic opening of countries that have traditionally been minor players is another. But one force behind the import-export boom has passed all but unnoticed: the rapidly falling cost of getting goods to market. Theoretically, in the world of trade, shipping costs do not matter. The real world, however, is full of frictions. Cheap labour may make Chinese clothing competitive in America, but if delays in shipment tie up working capital and cause winter coats to arrive in spring, trade may lose its advantages.\n\nParagraph C\nAt the turn of the 20th century, agriculture and manufacturing were the two most important sectors almost everywhere, accounting for about 70% of total output in Germany, Italy and France, and 40-50% in America, Britain and Japan. International commerce was therefore dominated by raw materials, such as wheat, wood and iron ore, or processed commodities, such as meat and steel. But these sorts of products are heavy and bulky and the cost of transporting them relatively high.\n\nParagraph D\nCountries still trade disproportionately with their geographic neighbours. Over time, however, world output has shifted into goods whose worth is unrelated to their size and weight. Today, it is finished manufactured products that dominate the flow of trade, and, thanks to technological advances such as lightweight components, manufactured goods themselves have tended to become lighter and less bulky. As a result, less transportation is required for every dollar's worth of imports or exports.\n\nParagraph E\nTo see how this influences trade, consider the business of making disk drives for computers. Most of the world's disk-drive manufacturing is concentrated in South-east Asia. This is possible only because disk drives, while valuable, are small and light and so cost little to ship. Computer manufacturers in Japan or Texas will not face hugely bigger freight bills if they import drives from Singapore rather than purchasing them on the domestic market.\n\nParagraph F\nThis is even more true of the fast-growing information industries. Films and compact discs cost little to transport, even by aeroplane. Computer software can be 'exported' without ever loading it onto a ship, simply by transmitting it over telephone lines from one country to another, so freight rates and cargo-handling schedules become insignificant factors in deciding where to make the product.\n\nParagraph G\nIn many countries deregulation has helped to drive the process along. Behind the scenes, a series of technological innovations known broadly as containerisation and intermodal transportation has led to swift productivity improvements in cargo-handling. The invention of the container crane made it possible to load and unload containers without capsizing the ship and the adoption of standard container sizes allowed almost any box to be transported on any ship. By 1967, dual-purpose ships were giving way to all-container vessels that moved thousands of boxes at a time.\n\nParagraph H\nThe shipping container transformed ocean shipping into a highly efficient, intensely competitive business. But getting the cargo to and from the dock was a different story. National governments kept a much firmer hand on truck and railroad tariffs than on charges for ocean freight. This started changing in the mid-1970s, when America began to deregulate its transportation industry. Between 1985 and 1996, America's freight railways dramatically reduced their employment, trackage, and their fleets of locomotives - while increasing the amount of cargo they hauled.\n\nParagraph I\nIn America the period of huge productivity gains in transportation may be almost over, but in most countries the process still has far to go. State ownership of railways and airlines, regulation of freight rates and toleration of anti-competitive practices, such as cargo-handling monopolies, all keep the cost of shipping unnecessarily high and deter international trade. Bringing these barriers down would help the world's economies grow even closer.", "questions": [{"q": "Which paragraph contains a suggestion for improving trade in the future?", "options": ["Paragraph B", "Paragraph F", "Paragraph H", "Paragraph I"], "a": 3, "why": "Paragraph I concludes: 'Bringing these barriers down would help the world's economies grow even closer.'"}, {"q": "Which paragraph describes the effects of the introduction of electronic delivery?", "options": ["Paragraph D", "Paragraph E", "Paragraph F", "Paragraph G"], "a": 2, "why": "Paragraph F discusses exporting computer software by transmitting it over telephone lines, making freight rates insignificant."}, {"q": "Which paragraph mentions the similar cost involved in transporting a product from abroad or from a local supplier?", "options": ["Paragraph C", "Paragraph D", "Paragraph E", "Paragraph H"], "a": 2, "why": "Paragraph E explains that computer manufacturers in Japan or Texas will not face hugely bigger freight bills importing disk drives from Singapore vs domestically."}, {"q": "International trade is increasing at a greater rate than the world economy.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph A states that while the global economy expands at a bit over 3% a year, trade volume rises at about twice that rate."}, {"q": "Cheap labour guarantees effective trade conditions.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph B contradicts this: cheap labour may make clothing competitive, 'but if delays in shipment tie up working capital... trade may lose its advantages.'"}, {"q": "Japan imports more meat and steel than France.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "why": "Paragraph C mentions agriculture/manufacturing output shares in France and Japan and notes meat and steel were traded, but never compares import volumes between Japan and France."}, {"q": "Most countries continue to prefer to trade with nearby nations.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph D begins: 'Countries still trade disproportionately with their geographic neighbours.'"}, {"q": "While international shipping is now efficient, there is still a need for governments to reduce ............ in order to free up the domestic cargo sector.", "options": ["tariffs", "components", "insurance costs", "employees"], "a": 0, "why": "Paragraphs H and I highlight government regulation of truck/railroad tariffs and freight rates keeping domestic shipping costs high."}]}, {"id": "pkg-r3", "num": 3, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 2 · Passage 1", "title": "Advantages of Public Transport", "subtitle": "World Bank & Murdoch University ISTP urban study", "minutes": 20, "passage": "ADVANTAGES OF PUBLIC TRANSPORT\n\nIntroduction\nA new study conducted for the World Bank by Murdoch University's Institute for Science and Technology Policy (ISTP) has demonstrated that public transport is more efficient than cars. The study compared the proportion of wealth poured into transport by thirty-seven cities around the world.\n\nThe study found that the Western Australian city of Perth is a good example of a city with minimal public transport. As a result, 17% of its wealth went into transport costs. Some European and Asian cities, on the other hand, spent as little as 5%. Professor Peter Newman, ISTP Director, pointed out that these more efficient cities were able to put the difference into attracting industry and jobs or creating a better place to live.\n\nAccording to Professor Newman, the larger Australian city of Melbourne is a rather unusual city in this sort of comparison. He describes it as two cities: 'A European city surrounded by a car-dependent one'. Melbourne's large tram network has made car use in the inner city much lower, but the outer suburbs have the same car-based structure as most other Australian cities. The explosion in demand for accommodation in the inner suburbs of Melbourne suggests a recent change in many people's preferences as to where they live.\n\nBicycle use was not included in the study but Newman noted that the two most 'bicycle friendly' cities considered — Amsterdam and Copenhagen — were very efficient, even though their public transport systems were 'reasonable but not special'.\n\nIt is common for supporters of road networks to reject the models of cities with good public transport by arguing that such systems would not work in their particular city. One objection is climate. Newman rejects this, pointing out that public transport has been successful in both Toronto and Singapore and, in fact, he has checked the use of cars against climate and found 'zero correlation'. When it comes to other physical features, road lobbies are on stronger ground. For example, Newman accepts it would be hard for a city as hilly as Auckland to develop a really good rail network. However, he points out that both Hong Kong and Zurich have managed to make a success of their rail systems, heavy and light respectively, though very few cities in the world are as hilly.\n\nParagraph A\nIn fact, Newman believes the main reason for adopting one sort of transport over another is politics: 'The more democratic the process, the more public transport is favored.' He considers Portland, Oregon, a perfect example of this. Some years ago, federal money was granted to build a new road. However, local pressure groups forced a referendum over whether to spend the money on light rail instead. The rail proposal won and the railway worked spectacularly well.\n\nParagraph B\nIn the UK, travel times to work had been stable for at least six centuries, with people avoiding situations that required them to spend more than half an hour travelling to work. Trains and cars initially allowed people to live at greater distances without taking longer to reach their destination. However, public infrastructure did not keep pace with urban sprawl, causing massive congestion problems which now make commuting times far higher.\n\nParagraph C\nThere is a widespread belief that increasing wealth encourages people to live farther out where cars are the only viable transport. The example of European cities refutes that. They are often wealthier than their American counterparts but have not generated the same level of car use. In Stockholm, car use has actually fallen in recent years as the city has become larger and wealthier. A new study makes this point even more starkly. Developing cities in Asia, such as Jakarta and Bangkok, make more use of the car than wealthy Asian cities such as Tokyo and Singapore.\n\nParagraph D\nNewman believes one of the best studies on how cities built for cars might be converted to rail use is The Urban Village report, which used Melbourne as an example. It found that pushing everyone into the city centre was not the best approach. Instead, the proposal advocated the creation of urban villages at hundreds of sites, mostly around railway stations.\n\nParagraph E\nIt was once assumed that improvements in telecommunications would lead to more dispersal in the population as people were no longer forced into cities. However, the ISTP team's research demonstrates that the population and job density of cities rose or remained constant in the 1980s after decades of decline. The explanation for this seems to be that it is valuable to place people working in related fields together. 'The new world will largely depend on human creativity, and creativity flourishes where people come together face-to-face.'", "questions": [{"q": "Choose the correct heading for Paragraph A:", "options": ["Avoiding an overcrowded centre", "A successful exercise in people power", "Higher incomes need not mean more cars", "Increases in travelling time"], "a": 1, "why": "Paragraph A describes how local pressure groups in Portland forced a democratic referendum to spend road funds on light rail."}, {"q": "Choose the correct heading for Paragraph B:", "options": ["Increases in travelling time", "The benefits of working together in cities", "Economic arguments fail to persuade", "A successful exercise in people power"], "a": 0, "why": "Paragraph B explains how urban sprawl outpaced infrastructure in the UK, making commuting times far higher than the historical half-hour limit."}, {"q": "Choose the correct heading for Paragraph C:", "options": ["Avoiding an overcrowded centre", "Higher incomes need not mean more cars", "The impact of telecommunications on population distribution", "Increases in travelling time"], "a": 1, "why": "Paragraph C refutes the belief that increasing wealth causes higher car use, citing European cities, Stockholm, Tokyo, and Singapore."}, {"q": "The ISTP study examined public and private systems in every city of the world.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "The first paragraph states the study compared 'thirty-seven cities around the world', not every city."}, {"q": "Efficient cities can improve the quality of life for their inhabitants.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph 2 notes that more efficient cities could put the savings into 'attracting industry and jobs or creating a better place to live.'"}, {"q": "In Melbourne, people prefer to live in the outer suburbs.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states: 'The explosion in demand for accommodation in the inner suburbs of Melbourne suggests a recent change in many people's preferences.'"}, {"q": "Cities with high levels of bicycle usage can be efficient even when public transport is only averagely good.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph 5 states that Amsterdam and Copenhagen were very efficient, even though their public transport systems were 'reasonable but not special'."}, {"q": "Which description matches the city of Perth?", "options": ["Profitably moved from road to light rail transport system", "Hilly and inappropriate for rail transport system", "Inefficient due to a limited public transport system", "Heavily dependent on cars despite widespread poverty"], "a": 2, "why": "Paragraph 2 states Perth is a city with minimal public transport where 17% of its wealth went into transport costs."}]}, {"id": "pkg-r4", "num": 4, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 3 · Passage 2", "title": "Motivating Employees under Adverse Conditions", "subtitle": "Six key management strategies during organisational decline", "minutes": 20, "passage": "MOTIVATING EMPLOYEES UNDER ADVERSE CONDITIONS\n\nTHE CHALLENGE\nIt is a great deal easier to motivate employees in a growing organisation than a declining one. When an organisation is shrinking, the best and most mobile workers are prone to leave voluntarily. Unfortunately, they are the ones the organisation can least afford to lose — those with the highest skills and experience. The minor employees remain because their job options are limited. Morale also suffers during decline. People fear they may be the next to be made redundant. Productivity often suffers, as employees spend their time sharing rumours and providing one another with moral support rather than focusing on their jobs.\n\nKEY POINT ONE: Ensure employees are suited to their jobs\nThere is an abundance of evidence to support the motivational benefits that result from carefully matching people to jobs. For example, if the job is running a small business or an autonomous unit within a larger business, high achievers should be sought. However, if the job to be filled is a managerial post in a large bureaucratic organisation, a candidate who has a high need for power and a low need for affiliation should be selected. High achievers will do best when the job provides moderately challenging goals and where there is independence and feedback.\n\nKEY POINT TWO\nThe literature on goal-setting theory suggests that managers should ensure that all employees have specific goals and receive comments on how well they are doing in those goals. For those with high achievement needs, typically a minority in any organisation, the existence of external goals is less important because high achievers are already internally motivated. The next factor to be determined is whether the goals should be assigned by a manager or collectively set in conjunction with the employees. If resistance to goals is expected, the use of participation in goal-setting should increase acceptance. If participation is inconsistent with the culture, however, goals should be assigned. If participation and the culture are incongruous, employees are likely to perceive the participation process as manipulative and be negatively affected by it.\n\nKEY POINT THREE\nRegardless of whether goals are achievable or well within management's perceptions of the employee's ability, if employees see them as unachievable they will reduce their effort. Managers must be sure, therefore, that employees feel confident that their efforts can lead to performance goals. For managers, this means that employees must have the capability of doing the job and must regard the appraisal process as valid.\n\nKEY POINT FOUR\nSince employees have different needs, what acts as a reinforcement for one may not for another. Managers could use their knowledge of each employee to personalise the rewards over which they have control. Some of the more obvious rewards that managers allocate include pay, promotions, autonomy, job scope and depth, and the opportunity to
