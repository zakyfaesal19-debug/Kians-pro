participate in goal-setting and decision-making.\n\nKEY POINT FIVE\nManagers need to make rewards contingent on performance. To reward factors other than performance will only reinforce those other factors. Key rewards such as pay increases and promotions or advancements should be allocated for the attainment of the employee's specific goals. Eliminating the secrecy surrounding pay by openly communicating everyone's remuneration, publicising performance bonuses and allocating annual salary increases in a lump sum rather than spreading them out over an entire year are examples of actions that will make rewards more visible and potentially more motivating.\n\nKEY POINT SIX\nThe way rewards are distributed should be transparent so that employees perceive that rewards or outcomes are equitable and equal to the inputs given. A study comparing clerical and production workers identified nearly twenty inputs and outcomes. The clerical workers considered factors such as quality of work performed and job knowledge near the top of their list, but these were at the bottom of the production workers' list. Similarly, production workers thought that the most important inputs were intelligence and personal involvement with task accomplishment. Production workers rated advancement very highly, whereas clerical workers rated advancement in the lower third of their list.", "questions": [{"q": "Choose the correct heading for Key Point Two:", "options": ["Ensure the reward system is fair", "Match rewards to individuals", "Establish targets and give feedback", "Ensure targets are realistic"], "a": 2, "why": "Key Point Two states: 'managers should ensure that all employees have specific goals and receive comments on how well they are doing in those goals.'"}, {"q": "Choose the correct heading for Key Point Three:", "options": ["Ensure targets are realistic", "Link rewards to achievement", "Match rewards to individuals", "Ensure the reward system is fair"], "a": 0, "why": "Key Point Three stresses that if employees see goals as unachievable they will reduce their effort; they must feel confident their efforts can reach the goals."}, {"q": "Choose the correct heading for Key Point Five:", "options": ["Ensure the reward system is fair", "Match rewards to individuals", "Link rewards to achievement", "Establish targets and give feedback"], "a": 2, "why": "Key Point Five states: 'Managers need to make rewards contingent on performance... allocated for the attainment of the employee's specific goals.'"}, {"q": "A shrinking organisation tends to lose its less skilled employees rather than its more skilled employees.", "options": ["YES", "NO", "NOT GIVEN"], "a": 1, "why": "The Challenge section states the opposite: the best workers with the highest skills leave voluntarily, while 'minor employees remain because their job options are limited.'"}, {"q": "It is easier to manage a small business than a large business.", "options": ["YES", "NO", "NOT GIVEN"], "a": 2, "why": "Key Point One compares the types of candidates suited for small businesses vs large bureaucratic organisations, but never claims one is easier to manage."}, {"q": "Some employees can feel manipulated when asked to participate in goal-setting.", "options": ["YES", "NO", "NOT GIVEN"], "a": 0, "why": "Key Point Two states: 'If participation and the culture are incongruous, employees are likely to perceive the participation process as manipulative.'"}, {"q": "Employees' earnings should be disclosed to everyone within the organisation.", "options": ["YES", "NO", "NOT GIVEN"], "a": 0, "why": "Key Point Five recommends 'Eliminating the secrecy surrounding pay by openly communicating everyone's remuneration'."}, {"q": "Which description matches 'clerical workers' according to the study in Key Point Six?", "options": ["They judge promotion/advancement to be important", "They have less need of external goals", "They think that the quality of their work is important", "They resist goals which are imposed"], "a": 2, "why": "Key Point Six states: 'The clerical workers considered factors such as quality of work performed and job knowledge near the top of their list.'"}]}, {"id": "pkg-r5", "num": 5, "skill": "Reading", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Passage 1", "title": "William Henry Perkin", "subtitle": "The man who invented synthetic dyes", "minutes": 20, "passage": "WILLIAM HENRY PERKIN\nThe man who invented synthetic dyes\n\nWilliam Henry Perkin was born on March 12, 1838, in London, England. As a boy, Perkin's curiosity prompted early interests in the arts, sciences, photography, and engineering. But it was a chance stumbling upon a run-down, yet functional, laboratory in his late grandfather's home that solidified the young man's enthusiasm for chemistry.\n\nAs a student at the City of London School, Perkin became immersed in the study of chemistry. His talent and devotion to the subject were perceived by his teacher, Thomas Hall, who encouraged him to attend a series of lectures given by the eminent scientist Michael Faraday at the Royal Institution. Those speeches fired the young chemist's enthusiasm further, and he later went on to attend the Royal College of Chemistry, which he succeeded in entering in 1853, at the age of 15.\n\nAt the time of Perkin's enrolment, the Royal College of Chemistry was headed by the noted German chemist August Wilhelm Hofmann. Perkin's scientific gifts soon caught Hofmann's attention and, within two years, he became Hofmann's youngest assistant. Not long after that, Perkin made the scientific breakthrough that would bring him both fame and fortune.\n\nAt the time, quinine was the only viable medical treatment for malaria. The drug is derived from the bark of the cinchona tree, native to South America, and by 1856 demand for the drug was surpassing the available supply. Thus, when Hofmann made some passing comments about the desirability of a synthetic substitute for quinine, it was unsurprising that his star pupil was moved to take up the challenge.\n\nDuring his vacation in 1856, Perkin spent his time in the laboratory on the top floor of his family's house. He was attempting to manufacture quinine from aniline, an inexpensive and readily available coal tar waste product. Despite his best efforts, however, he did not end up with quinine. Instead, he produced a mysterious dark sludge. Luckily, Perkin's scientific training and nature prompted him to investigate the substance further. Incorporating potassium dichromate and alcohol into the aniline at various stages of the experimental process, he finally produced a deep purple solution. And, proving the truth of the famous scientist Louis Pasteur's words 'chance favours only the prepared mind', Perkin saw the potential of his unexpected find.\n\nHistorically, textile dyes were made from such natural sources as plants and animal excretions. Some of these, such as the glandular mucus of snails, were difficult to obtain and outrageously expensive. Indeed, the purple colour extracted from a snail was once so costly that in society at the time only the rich could afford it. Further, natural dyes tended to be muddy in hue and fade quickly. It was against this backdrop that Perkin's discovery was made.\n\nPerkin quickly grasped that his purple solution could be used to colour fabric, thus making it the world's first synthetic dye. Realising the importance of this breakthrough, he lost no time in patenting it. But perhaps the most fascinating of all Perkin's reactions to his find was his nearly instant recognition that the new dye had commercial possibilities.\n\nPerkin originally named his dye Tyrian Purple, but it later became commonly known as mauve (from the French for the plant used to make the colour violet). He asked advice of Scottish dye works owner Robert Pullar, who assured him that manufacturing the dye would be well worth it if the colour remained fast (i.e. would not fade) and the cost was relatively low. So, over the fierce objections of his mentor Hofmann, he left college to give birth to the modern chemical industry.\n\nWith the help of his father and brother, Perkin set up a factory not far from London. The company received a commercial boost from the Empress Eugénie of France, when she decided the new colour flattered her. Very soon, mauve was the necessary shade for all the fashionable ladies in that country. Not to be outdone, England's Queen Victoria also appeared in public wearing a mauve gown, thus making it all the rage in England as well.\n\nAlthough Perkin's fame was achieved and fortune assured by his first discovery, the chemist continued his research. It is important to note that Perkin's synthetic dye discoveries had outcomes far beyond the merely decorative. The dyes also became vital to medical research in many ways. For instance, they were used to stain previously invisible microbes and bacteria, allowing researchers to identify such bacilli as tuberculosis, cholera, and anthrax. Artificial dyes continue to play a crucial role today. And, in what would have been particularly pleasing to Perkin, their current use is in the search for a vaccine against malaria.", "questions": [{"q": "Michael Faraday was the first person to recognise Perkin's ability as a student of chemistry.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 2 states that his talent was perceived by his school teacher, Thomas Hall, who encouraged him to attend Faraday's lectures."}, {"q": "Michael Faraday suggested Perkin should enrol in the Royal College of Chemistry.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "why": "Paragraph 2 says Faraday's speeches fired his enthusiasm and he later attended the Royal College of Chemistry, without stating who suggested enrolment."}, {"q": "Perkin employed August Wilhelm Hofmann as his assistant.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states the opposite: Hofmann headed the college, and Perkin became Hofmann's youngest assistant."}, {"q": "Perkin was still young when he made the discovery that made him rich and famous.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "He entered college at 15 in 1853 and made his famous discovery in 1856 (at age 18)."}, {"q": "The trees from which quinine is derived grow only in South America.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "why": "Paragraph 4 says the cinchona tree is 'native to South America', which does not mean it grows ONLY there."}, {"q": "Perkin hoped to manufacture a drug from a coal tar waste product.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph 5 states: 'He was attempting to manufacture quinine from aniline, an inexpensive and readily available coal tar waste product.'"}, {"q": "Before Perkin's discovery, with what group in society was the colour purple associated?", "options": ["The rich", "Chemists", "Scottish dye owners", "Medical researchers"], "a": 0, "why": "Paragraph 6 states: 'the purple colour extracted from a snail was once so costly that in society at the time only the rich could afford it.'"}, {"q": "According to the passage, which disease is now being targeted by researchers using synthetic dyes?", "options": ["Malaria", "Tuberculosis", "Cholera", "Anthrax"], "a": 0, "why": "The final sentence states: 'their current use is in the search for a vaccine against malaria.'"}]}, {"id": "pkg-r6", "num": 6, "skill": "Reading", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Passage 2", "title": "Is There Anybody Out There?", "subtitle": "The Search for Extra-Terrestrial Intelligence (SETI)", "minutes": 20, "passage": "IS THERE ANYBODY OUT THERE?\nThe Search for Extra-Terrestrial Intelligence\n\nParagraph A\nThe primary reason for the search is basic curiosity — the same curiosity about the natural world that drives all pure science. We want to know whether life evolves naturally if given the right conditions, or whether there is something very special about the Earth to have fostered the variety of life forms that we see around us on the planet. The simple detection of a radio signal will be sufficient to answer this most basic of all questions. However, there are other reasons for being interested in whether life exists elsewhere. For example, we have had civilisation on Earth for perhaps only a few thousand years, and the threats of nuclear war and pollution over the last few decades have told us that our survival may be tenuous. Since the lifetime of a planet like ours is several billion years, we can expect that, if other civilisations do survive in our galaxy, their ages will range from zero to several billion years. Thus any other civilisation that we hear from is likely to be far older, on average, than ourselves. The mere existence of such a civilisation will tell us that long-term survival is possible, and gives us some cause for optimism. It is even possible that the older civilisation may pass on the benefits of their experience in dealing with threats to survival such as nuclear war and global pollution.\n\nParagraph B\nIn discussing whether we are alone, most SETI scientists adopt two ground rules. First, UFOs (Unidentified Flying Objects) are generally ignored since most scientists don't consider the evidence for them to be strong enough to bear serious consideration. Second, we make a very conservative assumption that we are looking for a life form that is pretty well like us, since if it differs radically from us we may well not recognise it as a life form. In other words, the life form we are looking for may well have two green heads and seven fingers, but it will nevertheless resemble us in that it should communicate with its fellows, be interested in the Universe, live on a planet orbiting a star like our Sun, and perhaps most restrictively, have a chemistry, like us, based on carbon and water.\n\nParagraph C\nEven when we make these assumptions, our understanding of other life forms is still severely limited. We do not even know, for example, how many stars have planets, and we certainly do not know how likely it is that life will arise naturally, given the right conditions. However, when we look at the 100 billion stars in our galaxy (the Milky Way), and 100 billion galaxies in the observable Universe, it seems inconceivable that at least one of these planets does not have a life form on it; in fact, the best educated guess we can make leads us to estimate that perhaps one in 100,000 stars might have a life-bearing planet orbiting it. That means that our nearest neighbours are perhaps 100 light years away, which is almost next door in astronomical terms.\n\nParagraph D\nAn alien civilisation could choose many different ways of sending information across the galaxy, but many of these either require too much energy, or else are severely attenuated while traversing the vast distances across the galaxy. It turns out that, for a given amount of transmitted power, radio waves in the frequency range 1000 to 3000 MHz travel the greatest distance, and so all searches to date have concentrated on looking for radio waves in this frequency range. So far there have been a number of searches by various groups around the world, including Australian searches using the radio telescope at Parkes, New South Wales. Until now there have not been any detections from the few hundred stars which have been searched. The scale of the searches has been increased dramatically since 1992, when the US Congress voted NASA $10 million per year for ten years to conduct a thorough search for extra-terrestrial life. One part of the project is searching the nearest 1000 likely stars with high sensitivity for signals in the frequency range 1000 to 3000 MHz using the world's largest radio telescopes in Arecibo, Puerto Rico and Nancy, France.\n\nParagraph E\nThere is considerable debate over how we should react if we detect a signal from an alien civilisation. Everybody agrees that we should not reply immediately. Quite apart from the impracticality of sending a reply over such large distances at short notice, it raises a host of ethical questions that would have to be addressed by the global community before any reply could be sent. Would the human race face the culture shock if faced with a superior and much older civilisation? Luckily, there is no urgency about this. The stars being searched are hundreds of light years away, so it takes hundreds of years for their signal to reach us, and a further few hundred years for our reply to reach them.", "questions": [{"q": "Choose the correct heading for Paragraph B:", "options": ["Seeking the transmission of radio signals from planets", "Appropriate responses to signals from other civilisations", "Assumptions underlying the search for extra-terrestrial intelligence", "Likelihood of life on other planets"], "a": 2, "why": "Paragraph B outlines the 'two ground rules' and conservative assumptions SETI scientists adopt about alien life forms."}, {"q": "Choose the correct heading for Paragraph C:", "options": ["Likelihood of life on other planets", "Appropriate responses to signals from other civilisations", "Reasons for the search for extra-terrestrial intelligence", "Seeking the transmission of radio signals from planets"], "a": 0, "why": "Paragraph C estimates the probability of life-bearing planets among the 100 billion stars in the Milky Way (1 in 100,000 stars)."}, {"q": "Choose the correct heading for Paragraph D:", "options": ["Seeking the transmission of radio signals from planets", "Knowledge of extra-terrestrial life forms", "Appropriate responses to signals from other civilisations", "Vast distances to Earth's closest neighbours"], "a": 0, "why": "Paragraph D explains why SETI searches concentrate on radio waves in the 1000–3000 MHz range and describes the radio telescope projects."}, {"q": "According to Paragraph A, what is the life expectancy of a planet like Earth?", "options": ["Several billion years", "A few thousand years", "100,000 years", "100 light years"], "a": 0, "why": "Paragraph A states: 'Since the lifetime of a planet like ours is several billion years...'"}, {"q": "Alien civilisations may be able to help the human race to overcome serious problems.", "options": ["YES", "NO", "NOT GIVEN"], "a": 0, "why": "Paragraph A states: 'It is even possible that the older civilisation may pass on the benefits of their experience in dealing with threats to survival such as nuclear war and global pollution.'"}, {"q": "SETI scientists are trying to find a life form that resembles humans in many ways.", "options": ["YES", "NO", "NOT GIVEN"], "a": 0, "why": "Paragraph B states: 'we make a very conservative assumption that we are looking for a life form that is pretty well like us... resemble us in that it should communicate...'"}, {"q": "So far SETI scientists have picked up radio signals from several stars.", "options": ["YES", "NO", "NOT GIVEN"], "a": 1, "why": "Paragraph D states: 'Until now there have not been any detections from the few hundred stars which have been searched.'"}, {"q": "If a signal from outer space is received, it will be important to respond promptly.", "options": ["YES", "NO", "NOT GIVEN"], "a": 1, "why": "Paragraph E states: 'Everybody agrees that we should not reply immediately... Luckily, there is no urgency about this.'"}]}, {"id": "pkg-r7", "num": 7, "skill": "Reading", "book": "Cambridge 9", "source": "Cam 9 · Test 2 · Passage 2", "title": "Venus in Transit", "subtitle": "How rare planetary transits helped measure the Solar System", "minutes": 20, "passage": "VENUS IN TRANSIT\nJune 2004 saw the first passage, known as a 'transit', of the planet Venus across the face of the Sun in 122 years.\n\nParagraph A\nOn 8 June 2004, more than half the population of the world were treated to a rare astronomical event. For over six hours, the planet Venus steadily inched its way over the surface of the Sun. This 'transit' of Venus was the first since 6 December 1882. On that occasion, the American astronomer Professor Simon Newcomb led a party to South Africa to observe the event. They were based at a girls' school, where — it is alleged — the combined forces of three schoolmistresses outperformed the professionals with the accuracy of their observations.\n\nParagraph B\nFor centuries, transits of Venus have drawn explorers and astronomers alike to the four corners of the globe. And you can put it all down to the extraordinary polymath Edmond Halley. In November 1677, Halley observed a transit of the innermost planet, Mercury, from the desolate island of St Helena in the South Pacific. He realised that, from different latitudes, the passage of the planet across the Sun's disc would appear to differ. By timing the transit from two widely-separated locations, teams of astronomers could calculate the parallax angle — the apparent difference in position of an astronomical body due to a difference in the observer's position. Calculating this angle would allow astronomers to measure what was then the ultimate goal: the distance of the Earth from the Sun. This distance is known as the 'astronomical unit' or AU.\n\nParagraph C\nHalley was aware that the AU was one of the most fundamental of all astronomical measurements. Johannes Kepler, in the early 17th century, had shown that the distances of the planets from the Sun governed their orbital speeds, which were easily measurable. But no-one had found a way to calculate accurate distances to the planets from the Earth. The goal was to measure the AU; then, knowing the orbital speeds of all the other planets round the Sun, the scale of the Solar System would fall into place. However, Halley realised that Mercury was so far away that its parallax angle would be very difficult to determine. As Venus was closer to the Earth, its parallax angle would be larger, and Halley worked out that by using Venus it would be possible to measure the Sun's distance to 1 part in 500. Nevertheless, he accurately predicted that Venus would cross the face of the Sun in both 1761 and 1769 — though he didn't survive to see either.\n\nParagraph D\nInspired by Halley's suggestion of a way to pin down the scale of the Solar System, teams of British and French astronomers set out on expeditions to places as diverse as India and Siberia. But things weren't helped by Britain and France being at war. The person who deserves most sympathy is the French astronomer Guillaume Le Gentil. He was thwarted by the fact that the British were besieging his observation site at Pondicherry in India. Fleeing on a French warship crossing the Indian Ocean, Le Gentil saw a wonderful transit — but the ship's pitching and rolling ruled out any attempt at making accurate observations. Undaunted, he remained south of the equator for eight years before setting off to observe the next transit in the Philippines. Ironically after travelling nearly 50,000 kilometres, his view was clouded out at the last moment, a very dispiriting experience.\n\nParagraph E\nWhile the early transit timings were as precise as instruments would allow, the measurements were dogged by the 'black drop' effect. When Venus begins to cross the Sun's disc, it looks smeared not circular — which makes it difficult to establish timings. This is due to diffraction of light. The second problem is that Venus exhibits a halo of light when it is seen just outside the Sun's disc. While this showed astronomers that Venus was surrounded by a thick layer of gases refracting sunlight around it, both effects made it impossible to obtain accurate timings.\n\nParagraph F\nBut astronomers laboured hard to analyse the results of these expeditions to observe Venus transits. Johann Franz Encke, Director of the Berlin Observatory, finally determined a value for the AU based on all these parallax measurements: 153,340,000 km. Reasonably accurate for the time, that is quite close to today's value of 149,597,870 km, determined by radar, which has now superseded transits and all other methods in accuracy. The parallax principle can be extended to measure the distances to the stars.\n\nParagraph G\nJune 2004's transit of Venus was thus more of an astronomical spectacle than a scientifically important event. But such transits have paved the way for what might prove to be one of the most vital breakthroughs in the cosmos — detecting Earth-sized planets orbiting other stars.", "questions": [{"q": "Which paragraph gives examples of different ways in which the parallax principle has been applied?", "options": ["Paragraph B", "Paragraph D", "Paragraph E", "Paragraph F"], "a": 3, "why": "Paragraph F explains using parallax for the AU (Sun's distance) and extending the parallax principle to measure the distances to the stars."}, {"q": "Which paragraph contains a description of an event which prevented a transit observation?", "options": ["Paragraph A", "Paragraph C", "Paragraph D", "Paragraph G"], "a": 2, "why": "Paragraph D describes Le Gentil being thwarted by the British siege at Pondicherry and later having his view clouded out in the Philippines."}, {"q": "Which paragraph contains a statement about potential future discoveries leading on from transit observations?", "options": ["Paragraph C", "Paragraph E", "Paragraph F", "Paragraph G"], "a": 3, "why": "Paragraph G states that transits have paved the way for detecting Earth-sized planets orbiting other stars."}, {"q": "Who calculated the distance of the Sun from the Earth based on observations of Venus with a fair degree of accuracy?", "options": ["Edmond Halley", "Johannes Kepler", "Guillaume Le Gentil", "Johann Franz Encke"], "a": 3, "why": "Paragraph F states that Johann Franz Encke determined a value for the AU of 153,340,000 km based on the parallax measurements."}, {"q": "Who realised that the time taken by a planet to go round the Sun depends on its distance from the Sun?", "options": ["Edmond Halley", "Johannes Kepler", "Guillaume Le Gentil", "Johann Franz Encke"], "a": 1, "why": "Paragraph C states: 'Johannes Kepler, in the early 17th century, had shown that the distances of the planets from the Sun governed their orbital speeds.'"}, {"q": "Halley observed one transit of the planet Venus.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph B states Halley observed a transit of Mercury in 1677, and Paragraph C notes he predicted the 1761 and 1769 Venus transits 'though he didn't survive to see either'."}, {"q": "Le Gentil managed to observe a second Venus transit.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph D says that for the second transit in the Philippines, 'his view was clouded out at the last moment'."}, {"q": "The shape of Venus appears distorted when it starts to pass in front of the Sun.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph E states: 'When Venus begins to cross the Sun's disc, it looks smeared not circular — which makes it difficult to establish timings.'"}]}, {"id": "pkg-r8", "num": 8, "skill": "Reading", "book": "Cambridge 9", "source": "Cam 9 · Test 4 · Passage 1", "title": "The Life and Work of Marie Curie", "subtitle": "Pioneer of radioactivity and two-time Nobel Laureate", "minutes": 20, "passage": "THE LIFE AND WORK OF MARIE CURIE\n\nMarie Curie is probably the most famous woman scientist who has ever lived. Born Maria Sklodowska in Poland in 1867, she is famous for her work on radioactivity, and was twice a winner of the Nobel Prize. With her husband, Pierre Curie, and Henri Becquerel, she was awarded the 1903 Nobel Prize for Physics, and was then sole winner of the 1911 Nobel Prize for Chemistry. She was the first woman to win a Nobel Prize.\n\nFrom childhood, Marie was remarkable for her prodigious memory, and at the age of 16 won a gold medal on completion of her secondary education. Because her father lost his savings through bad investment, she then had to take work as a teacher. From her earnings she was able to finance her sister Bronia's medical studies in Paris, on the understanding that Bronia would, in turn, later help her to get an education.\n\nIn 1891 this promise was fulfilled and Marie went to Paris and began to study at the Sorbonne (the University of Paris). She often worked far into the night and lived on little more than bread and butter and tea. She came first in the examination in the physical sciences in 1893, and in 1894 was placed second in the examination in mathematical sciences. It was not until the spring of that year that she was introduced to Pierre Curie.\n\nTheir marriage in 1895 marked the start of a partnership that was soon to achieve results of world significance. Following Henri Becquerel's discovery in 1896 of a new phenomenon, which Marie later called 'radioactivity', Marie Curie decided to find out if the radioactivity discovered in uranium was to be found in other elements. She discovered that this was true for thorium.\n\nTurning her attention to minerals, she found her interest drawn to pitchblende, a mineral whose radioactivity, superior to that of pure uranium, could be explained only by the presence in the ore of small quantities of an unknown substance of very high activity. Pierre Curie joined her in the work that she had undertaken to resolve this problem, and that led to the discovery of the new elements, polonium and radium. While Pierre Curie devoted himself chiefly to the physical study of the new radiations, Marie Curie struggled to obtain pure radium in the metallic state. This was achieved with the help of the chemist André-Louis Debierne, one of Pierre Curie's pupils. Based on the results of this research, Marie Curie received her Doctorate of Science, and in 1903 Marie and Pierre shared with Becquerel the Nobel Prize for Physics for the discovery of radioactivity.\n\nThe births of Marie's two daughters, Irène and Eve, in 1897 and 1904 failed to interrupt her scientific work. The sudden death of her husband in 1906 was a bitter blow to Marie Curie, but was also a turning point in her career: henceforth she was to devote all her energy to completing alone the scientific work that they had undertaken. On May 13, 1906, she was appointed to the professorship that had been left vacant on her husband's death, becoming the first woman to teach at the Sorbonne. In 1911 she was awarded the Nobel Prize for Chemistry for the isolation of a pure form of radium.\n\nDuring World War I, Marie Curie, with the help of her daughter Irène, devoted herself to the development of the use of X-radiography, including the mobile units which came to be known as 'Little Curies', used for the treatment of wounded soldiers.\n\nOne of Marie Curie's outstanding achievements was to have understood the need to accumulate intense radioactive sources, not only to treat illness but also to maintain an abundant supply for research. The existence in Paris at the Radium Institute of a stock of 1.5 grams of radium made a decisive contribution to the success of the experiments undertaken in the years around 1930. This work prepared the way for the discovery of the neutron by Sir James Chadwick and, above all, for the discovery in 1934 by Irène and Frédéric Joliot-Curie of artificial radioactivity. A few months after this discovery, Marie Curie died as a result of leukaemia caused by exposure to radiation.", "questions": [{"q": "Marie Curie's husband was a joint winner of both Marie's Nobel Prizes.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 1 states she shared the 1903 Physics prize with Pierre and Becquerel, 'and was then sole winner of the 1911 Nobel Prize for Chemistry' (Pierre died in 1906)."}, {"q": "Marie became interested in science when she was a child.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "why": "Paragraph 2 says from childhood she had a prodigious memory and won a gold medal at 16, but does not state whether she became interested in science as a child."}, {"q": "Marie was able to attend the Sorbonne because of her sister's financial contribution.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraphs 2 and 3 explain that Marie financed Bronia's studies on the understanding Bronia would later help her, and 'In 1891 this promise was fulfilled and Marie went to Paris'."}, {"q": "Marie stopped doing research for several years when her children were born.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 6 states: 'The births of Marie's two daughters, Irène and Eve, in 1897 and 1904 failed to interrupt her scientific work.'"}, {"q": "Marie took over the teaching position her husband had held.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph 6 states: 'she was appointed to the professorship that had been left vacant on her husband's death'."}, {"q": "When uranium was discovered to be radioactive, Marie Curie found that the element called ............ had the same property.", "options": ["thorium", "pitchblende", "polonium", "radium"], "a": 0, "why": "Paragraph 4 states: 'Marie Curie decided to find out if the radioactivity discovered in uranium was to be found in other elements. She discovered that this was true for thorium.'"}, {"q": "Marie and Pierre Curie's research into the radioactivity of the mineral known as ............ led to the discovery of two new elements.", "options": ["pitchblende", "thorium", "uranium", "neutron"], "a": 0, "why": "Paragraph 5 states: 'Turning her attention to minerals, she found her interest drawn to pitchblende... that led to the discovery of the new elements, polonium and radium.'"}, {"q": "The radioactive material stocked in Paris contributed to the discoveries in the 1930s of the ............ and of what was known as artificial radioactivity.", "options": ["neutron", "leukaemia", "X-radiography", "isotopes"], "a": 0, "why": "Paragraph 8 states: 'This work prepared the way for the discovery of the neutron by Sir James Chadwick and, above all, for the discovery in 1934... of artificial radioactivity.'"}]}, {"id": "pkg-r9", "num": 9, "skill": "Reading", "book": "Cambridge 13", "source": "Cam 13 · Test 1 · Passage 1", "title": "Case Study: Tourism New Zealand Website", "subtitle": "How digital marketing built a global national destination brand", "minutes": 20, "passage": "CASE STUDY: TOURISM NEW ZEALAND WEBSITE\n\nNew Zealand is a small country of four million inhabitants, a long-haul flight from all the major tourist-generating markets of the world. Tourism currently makes up 9% of the country's gross domestic product, and is the country's largest export sector. Unlike other export sectors, which make products and then sell them overseas, tourism brings its customers to New Zealand. The product is the country itself — the people, the places and the experiences. In 1999, Tourism New Zealand launched a campaign to communicate a new brand position to the world. The campaign focused on New Zealand's scenic beauty, exhilarating outdoor activities and authentic Maori culture, and it made New Zealand one of the strongest national brands in the world.\n\nA key feature of the campaign was the website www.newzealand.com, which provided potential visitors to New Zealand with a single gateway to everything the destination had to offer. The heart of the website was a database of tourism services operators, both those based in New Zealand and those based abroad which offered tourism services to the country. Any tourism-related business could be listed by filling in a simple form. This meant that even the smallest bed and breakfast address or specialist activity provider could gain a web presence with access to an audience of long-haul visitors. In addition, because participating businesses were able to update the details they gave on a regular basis, the information provided remained accurate. And to maintain and improve standards, Tourism New Zealand organised a scheme whereby organisations appearing on the website underwent an independent evaluation against a set of agreed national standards of quality. As part of this, the effect of each business on the environment was considered.\n\nTo communicate the New Zealand experience, the site also carried features relating to famous people and places. One of the most popular was an interview with former New Zealand All Blacks rugby captain Tana Umaga. Another feature that attracted a lot of attention was an interactive journey through a number of the locations chosen for blockbuster films which had made use of New Zealand's stunning scenery as a backdrop. As the site developed, additional features were added to help independent travellers devise their own customised itineraries. To make it easier to plan motoring holidays, the site catalogued the most popular driving routes in the country, highlighting different routes according to the season and indicating distances and times.\n\nLater, a Travel Planner feature was added, which allowed visitors to click and 'bookmark' places or attractions they were interested in, and then view the results on a map. The Travel Planner offered suggested routes and public transport options between the chosen locations. There were also links to accommodation in the area. The website also had a 'Your Words' section where anyone could submit a blog of their New Zealand travels for possible inclusion on the website.\n\nThe website was set up to allow both individuals and travel organisations to create itineraries and travel packages to suit their own needs and interests. On the website, visitors can search for activities not solely by geographical location, but also by the particular nature of the activity. This is important as research shows that activities are the key driver of visitor satisfaction, contributing 74% to visitor satisfaction, while transport and accommodation account for the remaining 26%. It has also been found that visitors enjoy cultural activities most when they are interactive, such as visiting a marae (meeting ground) to learn about traditional Maori life.\n\nBecause of the long-haul flight, most visitors stay for longer (average 20 days) and want to see as much of the country as possible on what is often seen as a once-in-a-lifetime visit.", "questions": [{"q": "The database of tourism services allowed businesses to ............ information regularly.", "options": ["update", "evaluate", "bookmark", "catalogue"], "a": 0, "why": "Paragraph 2 states: 'because participating businesses were able to update the details they gave on a regular basis, the information provided remained accurate.'"}, {"q": "The country-wide evaluation of businesses included considering their impact on the ............ .", "options": ["environment", "economy", "season", "accommodation"], "a": 0, "why": "Paragraph 2 states: 'As part of this, the effect of each business on the environment was considered.'"}, {"q": "Special features on local topics included an interactive tour of various locations used in ............ .", "options": ["films", "rugby", "marae", "blogs"], "a": 0, "why": "Paragraph 3 states: 'an interactive journey through a number of the locations chosen for blockbuster films'."}, {"q": "Information on driving routes varied depending on the ............ .", "options": ["season", "accommodation", "weather", "coach"], "a": 0, "why": "Paragraph 3 states: 'highlighting different routes according to the season and indicating distances and times.'"}, {"q": "The website www.newzealand.com aimed to provide ready-made itineraries and packages for travel companies and individual tourists.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraphs 3 and 5 state the site helped travellers 'devise their own customised itineraries' and 'create itineraries and travel packages to suit their own needs', not ready-made packages."}, {"q": "It was found that most visitors started searching on the website by geographical location.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "why": "Paragraph 5 says visitors can search not solely by geographical location, but also by the nature of the activity; it does not state how most visitors started searching."}, {"q": "According to research, 26% of visitor satisfaction is related to their accommodation.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 5 states that 'transport and accommodation account for the remaining 26%' combined, not accommodation alone."}, {"q": "Many visitors feel it is unlikely that they will return to New Zealand after their visit.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph 6 notes visitors want to see as much as possible 'on what is often seen as a once-in-a-lifetime visit.'"}]}, {"id": "pkg-r10", "num": 10, "skill": "Reading", "book": "Cambridge 13", "source": "Cam 13 · Test 1 · Passage 2", "title": "Why Being Bored is Stimulating — and Useful, Too", "subtitle": "The psychology and five classifications of boredom", "minutes": 20, "passage": "WHY BEING BORED IS STIMULATING — AND USEFUL, TOO\n\nParagraph A\nWe all know how it feels — it's impossible to keep your mind on anything, time stretches out, and all the things you could do seem equally unlikely to make you feel better. But defining boredom so that it can be studied in the lab has proved difficult. For a start, it can include a lot of other mental states, such as frustration, apathy, depression and indifference. There isn't even agreement over whether boredom is always a low-energy, flat kind of emotion or whether feeling agitated and restless counts as boredom, too. In his book, Boredom: A Lively History, Peter Toohey at the University of Calgary, Canada, compares it to disgust — an emotion that motivates us to stay away from certain situations. 'If disgust protects humans from infection, boredom may protect them from \"infectious\" social situations,' he suggests.\n\nParagraph B\nBy asking people about their experiences of boredom, Thomas Goetz and his team at the University of Konstanz in Germany have recently identified five distinct types: indifferent, calibrating, searching, reactant and apathetic. These can be plotted on two axes — one running left to right, which measures low to high arousal, and the other from top to bottom, which measures how positive or negative the feeling is. Of the five types, the most damaging is 'reactant' boredom with its explosive combination of high arousal and negative emotion. The most useful is what Goetz calls 'indifferent' boredom: someone isn't engaged in anything satisfying but still feels relaxed and calm.\n\nParagraph C\nPsychologist Sandi Mann at the University of Central Lancashire, UK, goes further. 'All emotions are there for a reason, including boredom,' she says. Mann has found that being bored makes us more creative. In experiments published last year, Mann found that people who had been made to feel bored by copying numbers out of the phone book for 15 minutes came up with more creative ideas about how to use a polystyrene cup than a control group. Mann concluded that a passive, boring activity is best for creativity because it allows the mind to wander.\n\nParagraph D\nPsychologist John Eastwood at York University in Toronto, Canada, isn't convinced. 'If you are in a state of mind-wandering you are not bored,' he says. 'In my view, by definition boredom is an undesirable state.' For Eastwood, the central feature of boredom is a failure to put our 'attention system' into gear. This causes an inability to focus on anything, which makes time seem to go painfully slowly. What's more, your efforts to improve the situation can end up making you feel worse. 'People try to connect with the world and if they are not successful there's that frustration and irritability,' he says.\n\nParagraph E\nEastwood's team is now trying to explore why the attention system fails. It's early days but they think that at least some of it comes down to personality. Boredom proneness has been linked with a variety of traits. People who are motivated by pleasure seem to suffer particularly badly. Other personality traits, such as curiosity, are associated with a high boredom threshold. More evidence that boredom has detrimental effects comes from studies of people who are more or less prone to boredom. It seems those who bore easily face poorer prospects in education, their career and even life in general.\n\nParagraph F\nPsychologist Francoise Wemelsfelder speculates that our over-connected lifestyles might even be a new source of boredom. 'In modern human society there is a lot of overstimulation but still a lot of problems finding meaning,' she says. So instead of seeking yet more mental stimulation, perhaps we should leave our phones alone, and use boredom to motivate us to engage with the world in a more meaningful way.", "questions": [{"q": "Choose the correct heading for Paragraph A:", "options": ["The productive outcomes that may result from boredom", "Problems with a scientific approach to boredom", "Creating a system of classification for feelings of boredom", "A new explanation and a new cure for boredom"], "a": 1, "why": "Paragraph A explains why 'defining boredom so that it can be studied in the lab has proved difficult' due to overlapping mental states and lack of agreement."}, {"q": "Choose the correct heading for Paragraph B:", "options": ["Creating a system of classification for feelings of boredom", "The productive outcomes that may result from boredom", "A potential danger arising from boredom", "Identifying those most affected by boredom"], "a": 0, "why": "Paragraph B describes Thomas Goetz's team identifying five distinct types of boredom plotted on two axes."}, {"q": "Choose the correct heading for Paragraph C:", "options": ["The productive outcomes that may result from boredom", "What teachers can do to prevent boredom", "A potential danger arising from boredom", "Problems with a scientific approach to boredom"], "a": 0, "why": "Paragraph C presents Sandi Mann's findings that being bored makes us more creative."}, {"q": "Which researcher suggests that 'Boredom may encourage us to avoid an unpleasant experience'?", "options": ["Peter Toohey", "Thomas Goetz", "John Eastwood", "Francoise Wemelsfelder"], "a": 0, "why": "Paragraph A states Peter Toohey compares boredom to disgust: 'boredom may protect them from infectious social situations'."}, {"q": "Which researcher found that 'One sort of boredom is worse than all the others'?", "options": ["Peter Toohey", "Thomas Goetz", "Sandi Mann", "Francoise Wemelsfelder"], "a": 1, "why": "Paragraph B notes that of Goetz's five types, 'the most damaging is reactant boredom'."}, {"q": "Which researcher argues that 'Trying to cope with boredom can increase its negative effects'?", "options": ["Thomas Goetz", "Sandi Mann", "John Eastwood", "Francoise Wemelsfelder"], "a": 2, "why": "Paragraph D states for Eastwood: 'your efforts to improve the situation can end up making you feel worse.'"}, {"q": "For John Eastwood, the central feature of boredom is that people cannot ............ , due to a failure in the 'attention system'.", "options": ["focus", "wander", "relax", "specialise"], "a": 0, "why": "Paragraph D states: 'the central feature of boredom is a failure to put our attention system into gear. This causes an inability to focus on anything'."}, {"q": "Eastwood's team suggests that those for whom ............ is an important aim in life may have problems in coping with boredom.", "options": ["pleasure", "curiosity", "creativity", "education"], "a": 0, "why": "Paragraph E states: 'People who are motivated by pleasure seem to suffer particularly badly.'"}]}, {"id": "pkg-r11", "num": 11, "skill": "Reading", "book": "Cambridge 5", "source": "Cam 5 · Test 1 · Passage 1", "title": "Johnson's Dictionary", "subtitle": "Samuel Johnson's 1755 landmark English dictionary", "minutes": 20, "passage": "JOHNSON'S DICTIONARY\nFor the century before Johnson's Dictionary was published in 1755, there had been concern about the state of the English language. There was no standard way of speaking or writing and no agreement as to the best way of bringing some order to the chaos of English spelling. Dr Samuel Johnson provided the solution.\n\nIn the past, the teeth of English dictionaries had been limited to hard words, borrowed from Latin and Greek, which educated readers might encounter in learned texts. By the 1740s, however, the rise of a literate middle class created demand for a comprehensive guide to the entire language. Unlike France and Italy, where state-sponsored Academies spent decades compiling official dictionaries with dozens of scholars, England had no Royal Academy for language.\n\nIn 1746, a consortium of London booksellers approached the poet and critic Samuel Johnson to compile an authoritative dictionary in three years for the sum of 1,575 pounds. Johnson rented a large house at 17 Gough Square in Fleet Street and hired six clerks—five of them Scots—to copy out illustrative quotations.\n\nJohnson's method was empirical and literary. He read hundreds of works from the Elizabethan age to his own day—Shakespeare, Milton, Dryden, Locke, and Swift—marking sentences in pencil for his clerks to transcribe onto slips of paper. In the end, the two huge folio volumes published in April 1755 contained over 40,000 definitions illustrated by some 114,000 quotations.\n\nHaving started with the hope of 'fixing' the language permanently and preventing its decay, Johnson came to realize during nine years of labour that living languages inevitably change. In his famous Preface, he acknowledged that no lexicographer can 'embalm his language, and secure it from corruption and decay'. Although the work did not make Johnson rich immediately, King George III later granted him a royal pension of 300 pounds a year, and Johnson's Dictionary remained the undisputed standard for more than a century until the Oxford English Dictionary began publication.", "questions": [{"q": "Before 1755, early English dictionaries focused mainly on:", "options": ["Everyday spoken slang", "Difficult words borrowed from classical languages", "Scottish regional dialects"], "a": 1, "why": "Paragraph 2 states that past English dictionaries had been limited to 'hard words, borrowed from Latin and Greek'."}, {"q": "How did the compilation of Johnson's Dictionary differ from dictionaries in France and Italy?", "options": ["It was funded by a consortium of private booksellers rather than a state Academy", "It employed more than eighty university professors", "It excluded all literary quotations"], "a": 0, "why": "Paragraphs 2 and 3 explain that unlike state-sponsored Academies in France and Italy, a consortium of London booksellers contracted Johnson."}, {"q": "Johnson completed the dictionary within the three-year deadline originally agreed.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "He signed the contract in 1746 for three years, but it took nine years and was published in April 1755."}, {"q": "How many illustrative quotations were included in the 1755 edition?", "options": ["1,575", "40,000", "Around 114,000"], "a": 2, "why": "Paragraph 4 states it contained over 40,000 definitions illustrated by some 114,000 quotations."}, {"q": "By the time he wrote the Preface, how had Johnson's view of language changed?", "options": ["He accepted that no dictionary can stop a living language from changing", "He believed English should be replaced by Latin", "He demanded that Parliament outlaw new words"], "a": 0, "why": "Paragraph 5 notes he realized living languages inevitably change and no lexicographer can 'embalm his language'."}]}, {"id": "pkg-r12", "num": 12, "skill": "Reading", "book": "Cambridge 5", "source": "Cam 5 · Test 1 · Passage 2", "title": "Nature or Nurture?", "subtitle": "Stanley Milgram's obedience experiments & human behaviour", "minutes": 20, "passage": "NATURE OR NURTURE?\nA few years ago, in one of the most fascinating and disturbing experiments in behavioural psychology, Stanley Milgram of Yale University tested 40 subjects from all walks of life for their willingness to obey instructions given by a 'leader' in a situation in which the subjects might feel a personal distaste for the actions they were called upon to perform.\n\nMilgram told each volunteer 'teacher-subject' that the experiment was in the noble cause of education, and was designed to test whether punishing pupils for their mistakes had a positive effect on the pupils' ability to learn. The 'pupil' was in fact an actor strapped to a chair in another room, and the electric shocks ranged from 15 volts to a lethal-looking 450 volts on a control panel.\n\nBefore the experiment took place, Milgram polled 39 psychiatrists to predict how many subjects would go all the way to 450 volts. They predicted that only a tiny lunatic fringe—about one in a thousand—would administer the highest shock. In reality, over 60 per cent of the ordinary volunteers obeyed the white-coated experimenter all the way to the 450-volt switch.\n\nHow can we explain such startling obedience? The socio-environmental ('nurture') explanation points to the immediate social setting: the prestige of Yale University, the noble scientific framing, and the incremental nature of the 15-volt steps. By contrast, proponents of the biological ('nature') perspective, such as sociobiologists, suggest that natural selection has favoured an evolved propensity in humans to defer to hierarchy and authority within cooperative groups. While neither view excuses destructive behaviour, understanding the interplay between situational pressure and evolved predisposition remains central to modern psychology.", "questions": [{"q": "What were the volunteer teacher-subjects told was the purpose of Milgram's experiment?", "options": ["To test their willingness to obey orders blindly", "To investigate whether punishment improved pupils' learning", "To test the safety of electrical equipment"], "a": 1, "why": "Paragraph 2 states Milgram told volunteers the test was designed to see whether punishing pupils for mistakes had a positive effect on learning."}, {"q": "The 'pupil' in the experiment actually received dangerous electric shocks.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 2 clarifies the pupil was an actor and the shocks were simulated."}, {"q": "What proportion of subjects did psychiatrists predict would administer the maximum 450-volt shock?", "options": ["Over 60 per cent", "About one in a thousand", "Roughly half"], "a": 1, "why": "Paragraph 3 states the psychiatrists predicted only about one in a thousand would go to 450 volts."}, {"q": "Which factor is emphasized by the environmental ('nurture') explanation of the results?", "options": ["Genetic mutations in the volunteers", "The authority of the institutional setting and gradual 15-volt increments", "Childhood diet"], "a": 1, "why": "Paragraph 4 attributes the nurture explanation to the prestige of Yale, scientific framing, and incremental 15-volt steps."}, {"q": "Sociobiologists argue that deferring to authority may have evolved to support group cooperation.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "why": "Paragraph 4 states sociobiologists suggest natural selection favoured a propensity to defer to hierarchy within cooperative groups."}]}, {"id": "pkg-r13", "num": 13, "skill": "Reading", "book": "Cambridge 5", "source": "Cam 5 · Test 2 · Passage 1", "title": "Bakelite: The Birth of Modern Plastics", "subtitle": "Leo Baekeland and the first wholly synthetic thermosetting plastic", "minutes": 20, "passage": "BAKELITE: THE BIRTH OF MODERN PLASTICS\nIn 1907, Leo Hendrick Baekeland, a Belgian scientist working in New York, discovered and patented a revolutionary new synthetic material. His invention, which he named 'Bakelite', was of enormous technological importance, and effectively launched the modern plastics industry.\n\nPrior to Baekeland's breakthrough, early semi-synthetic plastics like Celluloid (derived from plant cellulose) were thermoplastic—meaning they could be melted and reshaped repeatedly, but softened in hot water and were highly flammable. Baekeland set out to find a synthetic substitute for shellac, a natural resin secreted by Asian lac beetles that was in high demand as an electrical insulator.\n\nBaekeland investigated the chemical reaction between phenol (carbolic acid) and formaldehyde. Previous chemists had abandoned this mixture because it produced a useless, porous mass. Using a pressurized heating vessel he called the 'Bakelizer', Baekeland controlled the temperature and pressure across three distinct stages (A, B, and C), adding woodflour filler to create a smooth, mouldable resin.\n\nOnce moulded under heat and pressure, Bakelite became a 'thermosetting' plastic: it could never again be melted, burned, or dissolved by acids or solvents. Non-conductive and heat-resistant, Bakelite was soon used in everything from telephone handsets, radio cabinets, and car distributor caps to Art Deco jewellery and kitchenware.", "questions": [{"q": "Why did early plastics like Celluloid differ from Bakelite?", "options": ["Celluloid was wholly synthetic and fireproof", "Celluloid was derived from natural cellulose and softened when reheated", "Celluloid could only be moulded once"], "a": 1, "why": "Paragraph 2 explains Celluloid was semi-synthetic (from plant cellulose) and thermoplastic (melted when reheated)."}, {"q": "What natural substance was Baekeland originally trying to replace?", "options": ["Ivory", "Shellac from Asian beetles", "Natural rubber"], "a": 1, "why": "Paragraph 2 states Baekeland set out to find a synthetic substitute for shellac."}, {"q": "What Were the two main chemicals combined inside the 'Bakelizer'?", "options": ["Phenol and formaldehyde", "Cellulose and camphor", "Tin and silica"], "a": 0, "why": "Paragraph 3 states he investigated the reaction between phenol and formaldehyde."}, {"q": "Once Bakelite has hardened into its final shape, it can be melted down and recycled into new moulds.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 4 states that as a thermosetting plastic, it 'could never again be melted, burned, or dissolved'."}, {"q": "Which property made Bakelite particularly valuable for the growing electrical and automotive industries?", "options": ["It was transparent like glass", "It was an electrical insulator and resistant to heat", "It was softer than rubber"], "a": 1, "why": "Paragraph 4 notes it was non-conductive and heat-resistant."}]}, {"id": "pkg-r14", "num": 14, "skill": "Reading", "book": "Cambridge 5", "source": "Cam 5 · Test 3 · Passage 2", "title": "Disappearing Delta", "subtitle": "Erosion, silt loss & environmental threats to Egypt's Nile Delta", "minutes": 20, "passage": "DISAPPEARING DELTA\nThe fertile land of the Nile delta is being eroded along Egypt's Mediterranean coast at an astounding rate, in some parts estimated at 100 metres per year. In the past, land scoured away from the coastline by the currents of the Mediterranean Sea used to be replaced by sediment brought down to the delta by the River Nile, but this is no longer happening.\n\nUp to now, people have blamed this loss of delta land on the two large dams at Aswan in the south of Egypt, which hold back virtually all of the sediment that used to flow down the river. Before the Aswan High Dam was completed in 1970, the Nile carried more than 100 million tons of nutrient-rich silt to the delta every year. Today, that silt settles at the bottom of Lake Nasser behind the dam, forcing farmers downstream to rely heavily on chemical fertilisers.\n\nFurthermore, the restricted freshwater flow has allowed salt water from the Mediterranean to intrude into northern coastal aquifers. In an effort to feed a rapidly growing population, farmers along the coastal lagoons have established dense aquaculture fish farms. However, Geological Survey researchers led by Daniel Stanley discovered that heavy metals and agricultural pollutants are accumulating in the lagoon sediments, entering the food chain through farmed fish. Long-term solutions such as desalination and artificial sediment bypassing are under study, but remain costly.", "questions": [{"q": "In the past, why did the Nile Delta coastline not shrink despite sea currents?", "options": ["Stone sea walls protected the entire coast", "Sediment carried down by the River Nile replaced the eroded land", "The Mediterranean Sea had no currents"], "a": 1, "why": "Paragraph 1 explains that land scoured away by sea currents used to be replaced by sediment brought down by the Nile."}, {"q": "Where does most of the Nile's silt accumulate today?", "options": ["In the Mediterranean Sea", "In Lake Nasser behind the Aswan dams", "In the Suez Canal"], "a": 1, "why": "Paragraph 2 states that today the silt settles at the bottom of Lake Nasser behind the dam."}, {"q": "Why have Egyptian farmers increased their use of chemical fertilisers since 1970?", "options": ["Because nutrient-rich annual flood silt no longer reaches their fields", "Because chemical fertilisers are free", "Because they stopped growing food crops"], "a": 0, "why": "Paragraph 2 links the loss of 100 million tons of annual nutrient-rich silt to reliance on chemical fertilisers."}, {"q": "Aquaculture fish farms in the northern lagoons have completely eliminated water pollution.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states heavy metals and pollutants are accumulating in lagoon sediments and entering the food chain through farmed fish."}, {"q": "At what rate is parts of Egypt's Mediterranean delta coast eroding?", "options": ["Up to 100 metres per year", "1 metre per century", "10 kilometres per day"], "a": 0, "why": "Paragraph 1 estimates erosion in some parts at 100 metres per year."}]}, {"id": "pkg-r15", "num": 15, "skill": "Reading", "book": "Cambridge 5", "source": "Cam 5 · Test 4 · Passage 2", "title": "Flawed Beauty: The Problem with Toughened Glass", "subtitle": "Nickel sulphide inclusions and spontaneous glass shattering", "minutes": 20, "passage": "FLAWED BEAUTY: THE PROBLEM WITH TOUGHENED GLASS\nOn 2nd August 1999, a particularly hot day in the town of Bishops Walk in the south of England, a large pane of toughened glass in the roof of a shopping centre suddenly shattered without warning, showering shoppers below with small cubes of glass. Engineer Brian Waldron investigated the fragments and found the culprit: a microscopic crystal of nickel sulphide no bigger than a pinhead.\n\nToughened glass is manufactured by heating ordinary float glass to around 620°C and then cooling its surfaces rapidly with jets of cold air. The outer skin cools and contracts first, while the hot interior cools more slowly, pulling the outer surfaces into strong compression and leaving the core in tension. This makes the glass five times stronger than ordinary glass, and when it breaks, it shatters into blunt cubes rather than jagged daggers.\n\nHowever, if trace amounts of nickel and sulphur contaminate the raw materials in the furnace, they form tiny crystals of nickel sulphide. These crystals exist in two structural forms: a stable high-temperature 'alpha' phase and a larger low-temperature 'beta' phase. Rapid cooling traps the crystal in its compact alpha form. Over months or years, Especially when warmed by summer sunlight, the crystal slowly reverts to its beta phase, expanding by 4 per cent. If the crystal sits in the central tension zone of the glass, that tiny expansion triggers instantaneous shattering.", "questions": [{"q": "What caused the glass roof pane at Bishops Walk shopping centre to shatter?", "options": ["A heavy bird striking the roof", "The expansion of a microscopic nickel sulphide crystal inside the glass", "A severe winter frost"], "a": 1, "why": "Paragraph 1 identifies a microscopic crystal of nickel sulphide as the culprit."}, {"q": "How is toughened glass made five times stronger than ordinary glass?", "options": ["By heating it to 620°C and rapidly cooling the outer surfaces with air jets", "By coating it in plastic film", "By mixing lead into the molten tin"], "a": 0, "why": "Paragraph 2 describes heating float glass to 620°C and cooling its surfaces rapidly with cold air jets."}, {"q": "What happens when a nickel sulphide crystal changes from the alpha phase to the beta phase?", "options": ["It shrinks by 10 per cent", "It expands by 4 per cent", "It melts into liquid"], "a": 1, "why": "Paragraph 3 states that reverting to its beta phase causes the crystal to expand by 4 per cent."}, {"q": "Nickel sulphide crystals are intentionally added by manufacturers to make glass clearer.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 explains they occur as unintended contamination in the furnace."}, {"q": "Why does toughened glass break into small cubes rather than sharp daggers?", "options": ["Because of the balance between compressed outer surfaces and the tensioned core", "Because it is pre-scored with a diamond cutter", "Because it contains woodflour"], "a": 0, "why": "Paragraph 2 explains that the compressed outer skin and tensioned core cause it to shatter into blunt cubes."}]}, {"id": "pkg-r16", "num": 16, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 2 · Passage 1", "title": "Advantages of Public Transport", "subtitle": "Urban rail systems, car dependence & city efficiency", "minutes": 20, "passage": "ADVANTAGES OF PUBLIC TRANSPORT\nA new study conducted for the World Bank by Murdoch University's Institute for Science and Technology Policy (ISTP) has demonstrated that public transport is more efficient than cars. The study compared the proportion of wealth poured into transport by thirty-seven cities around the world. This included both the public and private costs of building, maintaining and running a transport system.\n\nThe study found that the Western Australian city of Perth is a good example of a city with minimal public transport. As a result, 17% of its wealth went into transport costs. Some European and Asian cities, on the other hand, spent as little as 5%. Professor Peter Newman, ISTP Director, pointed out that these more efficient cities were able to put the difference into attracting industry and jobs or creating a better place to live.\n\nAccording to Professor Newman, the larger Australian city of Melbourne is a rather unusual city in this sort of comparison. He describes it as two cities: 'A European city surrounded by a car-dependent one'. Melbourne's large tram network has meant that in the inner suburbs a high percentage of journeys are made by public transport, whereas the outer suburbs rely heavily on private cars.\n\nIn Zurich, Switzerland, voters rejected an underground metro proposal because they felt it would cost too much; instead, they upgraded their existing surface trams with traffic-light priority, turning Zurich into one of Europe's cleanest and most punctual transit models.", "questions": [{"q": "What did the ISTP study compare across thirty-seven global cities?", "options": ["The average speed of bicycles", "The proportion of city wealth spent on public and private transport", "The number of international airports"], "a": 1, "why": "Paragraph 1 states the study compared the proportion of wealth poured into public and private transport costs."}, {"q": "How much of Perth's wealth was spent on transport compared with the most efficient European and Asian cities?", "options": ["17% in Perth vs as little as 5% in efficient cities", "5% in Perth vs 17% in Europe", "50% in both"], "a": 0, "why": "Paragraph 2 contrasts Perth's 17% with 5% in efficient European and Asian cities."}, {"q": "Why does Professor Newman describe Melbourne as 'two cities'?", "options": ["It is divided by a mountain range", "Its inner suburbs use a dense tram network like Europe, while its outer suburbs are car-dependent", "It has two separate municipal governments"], "a": 1, "why": "Paragraph 3 explains that inner Melbourne has a European-style tram network while the outer suburbs are car-dependent."}, {"q": "Citizens in Zurich voted in favour of building a costly new underground metro system.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 4 states Zurich voters rejected the underground metro and upgraded surface trams instead."}, {"q": "How did Zurich make its surface trams faster without building underground tunnels?", "options": ["By giving trams priority at traffic lights", "By banning all pedestrians", "By running trams only at midnight"], "a": 0, "why": "Paragraph 4 notes they upgraded surface trams with traffic-light priority."}]}, {"id": "pkg-r17", "num": 17, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 2 · Passage 2", "title": "Greying Population Stays in the Pink", "subtitle": "Declining chronic disability & rising self-reliance among older adults", "minutes": 20, "passage": "GREYING POPULATION STAYS IN THE PINK\nElderly people are growing healthier, happier and more independent, say American scientists. The results of a 14-year study to be announced later this month reveal that the diseases associated with old age are afflicting fewer and fewer people and when they do strike, it is much later in life.\n\nIn the last 14 years, the National Long-Term Care Survey has gathered data on the health and lifestyles of more than 20,000 men and women over 65. Researchers, now analysing the results of data gathered in 1994, say arthritis, high blood pressure and circulation problems—the major medical complaints in this age group—are troubling a smaller proportion every year. And the data confirms that the rate at which these diseases are declining continues to accelerate.\n\nKenneth Manton, a demographer from Duke University in North Carolina, says that better nutrition in childhood, higher educational attainment, and public health advances mean that today's 65-year-olds are physiologically younger than their grandparents were at the same age. Furthermore, simple home modifications—such as raised toilet seats, grab bars, and microwave ovens—have fostered greater self-reliance, reducing nursing-home admissions.", "questions": [{"q": "What is the main finding of the 14-year National Long-Term Care Survey?", "options": ["Diseases of old age are striking a smaller proportion of elderly people and later in life", "Nursing home admissions have doubled", "Arthritis is increasing among 65-year-olds"], "a": 0, "why": "Paragraph 1 and 2 state that age-related diseases are afflicting fewer people and striking later in life."}, {"q": "The rate at which age-related diseases are declining has slowed down in recent years.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 2 states that 'the rate at which these diseases are declining continues to accelerate'."}, {"q": "How many people over 65 were tracked in the survey?", "options": ["More than 20,000", "Exactly 1,400", "Under 5,000"], "a": 0, "why": "Paragraph 2 mentions more than 20,000 men and women over 65."}, {"q": "Which of the following is mentioned as contributing to the greater independence (self-reliance) of elderly people at home?", "options": ["Simple home medical aids and modifications like grab bars", "Mandatory retirement at age 55", "Relocating to tropical islands"], "a": 0, "why": "Paragraph 3 points to simple home modifications such as raised toilet seats, grab bars, and microwave ovens."}, {"q": "Who led the demographic analysis at Duke University?", "options": ["Kenneth Manton", "Peter Newman", "Bruce Mason"], "a": 0, "why": "Paragraph 3 identifies Kenneth Manton, a demographer from Duke University."}]}, {"id": "pkg-r18", "num": 18, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 3 · Passage 3", "title": "The Search for the Anti-Aging Pill", "subtitle": "Caloric restriction, glucose mimetics & cellular longevity", "minutes": 20, "passage": "THE SEARCH FOR THE ANTI-AGING PILL\nIn government laboratories and elsewhere, scientists are seeking a drug able to prolong life and youthful vigor. Studies of caloric restriction are showing the way. No treatment on the market today has been proved to slow human aging. Yet one intervention, consumption of a low-calorie yet nutritionally balanced diet, works incredibly well in a broad range of animals, increasing longevity and prolonging good health.\n\nSince the 1930s, researchers have known that cutting laboratory rats' caloric intake by 30 to 40 per cent extends their lifespan by roughly a third and delays cancer, diabetes, and kidney disease. Ongoing studies on rhesus monkeys at the National Institute on Aging show that calorie-restricted monkeys have lower blood glucose, lower insulin levels, and fewer age-related ailments than free-feeding controls.\n\nBecause very few humans can stick to a strict 30 per cent calorie cut for decades, George Roth and Donald Ingram are testing 'caloric restriction mimetics'—compounds that trick cells into shifting from reproduction to cellular maintenance without starvation. One promising compound, 2-deoxy-D-glucose (2DG), partially blocks glucose metabolism inside cells, reducing destructive free radicals produced during ATP energy generation.", "questions": [{"q": "What is the only dietary intervention proven to extend lifespan across a wide range of laboratory animals?", "options": ["A high-protein ketogenic diet", "A low-calorie yet nutritionally balanced diet (caloric restriction)", "Eliminating all water intake"], "a": 1, "why": "Paragraph 1 states that consumption of a low-calorie yet nutritionally balanced diet works in a broad range of animals."}, {"q": "What health markers were observed in calorie-restricted rhesus monkeys?", "options": ["Lower blood glucose, lower insulin levels, and fewer age-related diseases", "Higher blood pressure and faster weight gain", "Complete loss of muscle mass"], "a": 0, "why": "Paragraph 2 notes lower blood glucose, lower insulin levels, and fewer age-related ailments."}, {"q": "Why are scientists searching for 'caloric restriction mimetics' rather than simply prescribing strict dieting to humans?", "options": ["Because very few people can maintain a strict 30–40% calorie reduction for decades", "Because vegetables are no longer available", "Because caloric restriction increases free radicals"], "a": 0, "why": "Paragraph 3 explains that very few humans can stick to a strict 30 per cent calorie cut for decades."}, {"q": "How does the compound 2-deoxy-D-glucose (2DG) work inside cells?", "options": ["It partially blocks glucose metabolism, reducing free radicals during ATP production", "It doubles the rate of sugar absorption", "It replaces oxygen in the bloodstream"], "a": 0, "why": "Paragraph 3 explains 2DG partially blocks glucose metabolism, reducing free radicals produced during ATP generation."}, {"q": "Commercial anti-aging pills based on 2DG have already been approved for human sale worldwide.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 1 explicitly states 'No treatment on the market today has been proved to slow human aging'."}]}, {"id": "pkg-r19", "num": 19, "skill": "Reading", "book": "Cambridge 6", "source": "Cam 6 · Test 4 · Passage 3", "title": "Persistent Bullying in British Schools", "subtitle": "The Sheffield anti-bullying project & whole-school policy", "minutes": 20, "passage": "PERSISTENT BULLYING IN BRITISH SCHOOLS\nBullying can take a variety of forms, from the verbal—being taunted or called hurtful names—to the physical—being kicked or shoved—as well as indirect forms, such as being excluded from social groups. Up until the late 1980s, British schools rarely had explicit anti-bullying policies, and many teachers viewed playground intimidation as an unavoidable part of growing up.\n\nBetween 1991 and 1994, the Department for Education funded a landmark intervention project in 23 primary and secondary schools in Sheffield, directed by Professor Peter Smith. At the centre of the intervention was the creation of a 'Whole-School Policy' drawn up through consultation with staff, pupils, and parents, defining bullying clearly and establishing consistent reporting channels.\n\nSchools could also implement optional modules: curriculum work (using video drama and literature to build empathy), playground redesign combined with training lunchtime supervisors to distinguish rough-and-tumble play from bullying, and 'assertiveness training' or peer mediation for targeted pupils. Follow-up surveys showed that primary schools reduced bullying by up to 50 per cent when they maintained the policy actively.", "questions": [{"q": "Which of the following is given as an example of 'indirect' bullying?", "options": ["Being kicked in the playground", "Being deliberately excluded from social groups", "Being called hurtful names"], "a": 1, "why": "Paragraph 1 defines indirect forms as 'such as being excluded from social groups'."}, {"q": "What was the core mandatory element of the Sheffield intervention project across all 23 schools?", "options": ["Installing CCTV cameras in every classroom", "Developing a Whole-School Policy in consultation with staff, pupils, and parents", "Expelling all secondary students"], "a": 1, "why": "Paragraph 2 states that at the centre of the intervention was a Whole-School Policy drawn up with staff, pupils, and parents."}, {"q": "Why were lunchtime supervisors trained as part of the playground module?", "options": ["To help them distinguish harmless rough-and-tumble play from actual bullying", "To teach mathematics during lunch", "To prepare school meals"], "a": 0, "why": "Paragraph 3 notes training lunchtime supervisors to distinguish rough-and-tumble play from bullying."}, {"q": "Secondary schools achieved a larger percentage reduction in bullying than primary schools.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "why": "The text mentions primary schools reduced bullying by up to 50%, without stating that secondary schools achieved a larger reduction."}, {"q": "Who directed the 1991–1994 Sheffield anti-bullying study?", "options": ["Professor Peter Smith", "Professor Peter Newman", "Dr Samuel Johnson"], "a": 0, "why": "Paragraph 2 names Professor Peter Smith."}]}, {"id": "pkg-r20", "num": 20, "skill": "Reading", "book": "Cambridge 7", "source": "Cam 7 · Test 1 · Passage 1", "title": "Let's Go Bats", "subtitle": "Nocturnal flight, mammalian echolocation & sonar technology", "minutes": 20, "passage": "LET'S GO BATS\nBats have a problem: how to find their way around in the dark. They hunt at night, and cannot use light to help them find prey and avoid obstacles. You might say that this is a problem of their own making, one that they could avoid simply by changing their habits and hunting by day. But the daytime economy is already heavily exploited by other creatures such as birds, so natural selection has favoured bats that make a go of the night-time trade.\n\nGiven that there is a living to be made at night, and given that alternative daytime trades are thoroughly occupied, natural selection hasero-engineered two distinct solutions among bats. Microbats (the majority of insect-eating species) navigate and hunt using 'echolocation'—emitting high-pitched vocal clicks through their mouth or nose and analysing the returning echoes with oversized, specialized ears.\n\nInterestingly, wartime radar and underwater sonar engineers coined the term 'echolocation' in the 1940s after Donald Griffin demonstrated that bats use sound reflections just like naval destroyers detecting submarines. Today, engineers are reversing the process, studying how bats filter out background clutter in dense forests to design superior navigation aids for the blind.", "questions": [{"q": "According to the writer, why d
