o bats hunt at night rather than during the day?", "options": ["Sunlight is toxic to their wings", "The daytime ecological niche is already heavily occupied by birds", "Insects only exist after midnight"], "a": 1, "why": "Paragraph 1 explains that the daytime economy is already heavily exploited by other creatures such as birds."}, {"q": "How do microbats locate insects and obstacles in pitch darkness?", "options": ["By emitting high-frequency vocal sounds and interpreting the returning echoes", "By using infrared heat sensors in their wingtips", "By following the scent of flowers"], "a": 0, "why": "Paragraph 2 describes microbats emitting high-pitched vocal clicks and analysing the returning echoes."}, {"q": "Who demonstrated in the 1940s that bats navigate using sound reflections?", "options": ["Donald Griffin", "Alastair Pilkington", "Stanley Milgram"], "a": 0, "why": "Paragraph 3 credits Donald Griffin in the 1940s."}, {"q": "All species of bats rely exclusively on echolocation rather than vision.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 2 specifies that natural selection engineered two distinct solutions and that 'Microbats (the majority of insect-eating species)' use echolocation."}, {"q": "How is modern research into bat echolocation being applied today?", "options": ["To design improved navigation aids for blind people", "To train nocturnal carrier pigeons", "To silence aircraft engines"], "a": 0, "why": "Paragraph 3 mentions studying bats to design superior navigation aids for the blind."}]}, {"id": "pkg-r21", "num": 21, "skill": "Reading", "book": "Cambridge 7", "source": "Cam 7 · Test 1 · Passage 2", "title": "Making Every Drop Count", "subtitle": "The history & future of global water resource management", "minutes": 20, "passage": "MAKING EVERY DROP COUNT\nThe history of human civilisation is entwined with the history of the ways we have learned to manipulate water resources. As towns gradually expanded, water was brought from increasingly remote sources, leading to sophisticated engineering efforts such as dams and aqueducts. At the height of the Roman Empire, nine major systems, with an innovative layout of pipes and well-built sewers, supplied the occupants of Rome with as much water per person as is provided in many parts of the industrial world today.\n\nDuring the Industrial Revolution and population explosion of the 19th and 20th centuries, the demand for water rose dramatically. Unprecedented construction of tens of thousands of monumental engineering projects designed to control floods, protect clean water supplies, and provide water for irrigation and hydropower brought great benefits to hundreds of millions of people.\n\nHowever, this supply-side infrastructure came at a steep ecological price: half of the world's wetlands have been drained, and many major rivers barely reach the sea. Water expert Peter Gleick argues that in the 21st century we must shift from building ever more dams to managing demand—applying the 'Three Rs' of water conservation: using less per unit of output, recycling industrial greywater, and switching to precision drip irrigation.", "questions": [{"q": "How did the per-capita water supply in ancient Rome compare with that of many modern industrial cities?", "options": ["It was roughly equivalent per person", "It was less than one-tenth as much", "Romans had no sewer systems"], "a": 0, "why": "Paragraph 1 states nine major aqueduct systems supplied occupants of Rome with 'as much water per person as is provided in many parts of the industrial world today'."}, {"q": "What triggered the massive wave of dam and irrigation construction in the 19th and 20th centuries?", "options": ["The Industrial Revolution and rapid population growth", "The collapse of the Roman Empire", "A global freeze"], "a": 0, "why": "Paragraph 2 links it to the Industrial Revolution and population explosion of the 19th and 20th centuries."}, {"q": "The construction of 20th-century dams had no negative impact on natural wetlands.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states that 'half of the world's wetlands have been drained' as an ecological price."}, {"q": "What shift in water policy does Peter Gleick advocate for the 21st century?", "options": ["Shifting from building more supply dams to improving water efficiency and recycling demand", "Abandoning all irrigated agriculture", "Melting polar icebergs"], "a": 0, "why": "Paragraph 3 explains Gleick argues we must shift from building ever more dams to managing demand via conservation, recycling, and drip irrigation."}, {"q": "Which agricultural method is highlighted as part of conserving water?", "options": ["Precision drip irrigation", "Open-canal flooding", "Slash-and-burn farming"], "a": 0, "why": "Paragraph 3 concludes with 'switching to precision drip irrigation'."}]}, {"id": "pkg-r22", "num": 22, "skill": "Reading", "book": "Cambridge 7", "source": "Cam 7 · Test 2 · Passage 1", "title": "Why Pagodas Don't Fall Down", "subtitle": "Seismic engineering secrets of traditional Japanese wooden pagodas", "minutes": 20, "passage": "WHY PAGODAS DON'T FALL DOWN\nIn a land swept by typhoons and shaken by earthquakes, how have Japan's tallest and seemingly flimsiest old buildings—500 or so wooden pagodas—remained standing for centuries? Records show that only two have collapsed during the past 1,400 years. Those that have disappeared were destroyed by fire as a result of lightning or civil war. The disastrous Hanshin earthquake in 1995 killed 6,400 people, toppled elevated highways, and flattened modern office blocks, yet left the magnificent five-storey pagoda at the Toji temple in nearby Kyoto unscathed.\n\nJapanese master carpenters (miyadaiku) built pagodas without nails or rigid diagonal braces. Instead, the structure relies on three ingenious mechanical principles. First, wooden wedge joints flex slightly under stress, absorbing seismic energy through friction. Second, each storey is stacked independently like a pile of hats rather than bolted rigidly together; during a tremor, adjacent floors slide slightly in opposite directions ('snake dance'), cancelling out momentum.\n\nThird, suspended down the centre of the pagoda is a massive timber trunk called the shinbashira. Acting like a heavy stationary pendulum, the shinbashira cushions the swaying tiers and prevents any single floor from tipping past its centre of gravity.", "questions": [{"q": "How many wooden pagodas in Japan are recorded as having collapsed due to earthquakes over the past 1,400 years?", "options": ["Only two", "More than 500", "Around 6,400"], "a": 0, "why": "Paragraph 1 states 'Records show that only two have collapsed during the past 1,400 years.'"}, {"q": "What was the main cause of destruction for pagodas that did disappear over history?", "options": ["Fire caused by lightning or civil war", "Tsunami waves", "Termite damage"], "a": 0, "why": "Paragraph 1 states: 'Those that have disappeared were destroyed by fire as a result of lightning or civil war.'"}, {"q": "Traditional Japanese pagodas rely on heavy steel nails and rigid diagonal braces to resist earthquakes.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 2 states master carpenters built pagodas 'without nails or rigid diagonal braces'."}, {"q": "What is the role of the central timber pillar known as the 'shinbashira'?", "options": ["It acts as a heavy pendulum that dampens and balances the swaying tiers", "It carries rainwater from the roof", "It serves as an elevator shaft"], "a": 0, "why": "Paragraph 3 explains that the shinbashira acts like a heavy stationary pendulum that cushions the swaying tiers."}, {"q": "What happens to the individual storeys of a pagoda during an earthquake tremor?", "options": ["They slide slightly in opposite directions like a snake dance, cancelling momentum", "They lock into a single rigid concrete block", "They detach and fall to the ground"], "a": 0, "why": "Paragraph 2 describes adjacent floors sliding slightly in opposite directions ('snake dance')."}]}, {"id": "pkg-r23", "num": 23, "skill": "Reading", "book": "Cambridge 7", "source": "Cam 7 · Test 2 · Passage 2", "title": "The True Cost of Food", "subtitle": "Hidden environmental & health externalities of intensive agriculture", "minutes": 20, "passage": "THE TRUE COST OF FOOD\nFor more than forty years the cost of food has been rising. It has now reached a point where a growing number of people believe that it is far too high, and that bringing it down will be one of the great challenges of the twenty-first century. That cost, however, is not in immediate cash. In the West at least, most food is now far cheaper to buy in relative terms than it was in 1960. The cost is in the collateral damage of the very methods of food production that have made the food cheaper: in the pollution of water, the enervation of soil, the destruction of wildlife, and the harm to human health.\n\nProfessor Jules Pretty of the University of Essex calculated the first comprehensive price tag for these 'externalities' in UK agriculture. Pretty found that British consumers pay roughly 2.3 billion pounds a year in hidden taxes and water rates on top of their supermarket bills: including 231 million pounds for water companies to filter nitrates and pesticides out of drinking water, and hundreds of millions more for soil erosion, greenhouse gases, and food-borne illnesses.\n\nPretty proposes 'sustainable intensification'—reforming farm subsidies so that public funds reward farmers for hedgerow conservation, crop rotation, and reduced chemical run-off rather than sheer output volume.", "questions": [{"q": "In relative cash terms at the supermarket checkout, how does food in the West today compare with 1960?", "options": ["It is far cheaper to buy in relative terms than in 1960", "It is ten times more expensive at the till", "It costs the exact same amount"], "a": 0, "why": "Paragraph 1 states 'most food is now far cheaper to buy in relative terms than it was in 1960'."}, {"q": "What does Professor Jules Pretty mean by the 'externalities' of UK agriculture?", "options": ["The export price of British wheat abroad", "Hidden environmental and health costs paid by society outside the supermarket price", "The salaries of supermarket cashiers"], "a": 1, "why": "Paragraphs 1 and 2 define externalities as the collateral costs in water purification, soil loss, and health paid via taxes and water bills."}, {"q": "According to Pretty's study, how much is spent annually in the UK to remove pesticides and nitrates from drinking water?", "options": ["Around 231 million pounds", "2.3 trillion pounds", "19.6 million pounds"], "a": 0, "why": "Paragraph 2 specifies 231 million pounds for water companies to filter nitrates and pesticides."}, {"q": "Pretty recommends abolishing all farming in Britain and importing 100% of food.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states he proposes 'sustainable intensification'—reforming subsidies to reward sustainable practices."}, {"q": "How does Pretty suggest government agricultural subsidies should be reformed?", "options": ["To reward farmers for environmental stewardship and reduced chemical run-off", "To subsidize heavier pesticide use", "To pay for longer food miles"], "a": 0, "why": "Paragraph 3 advocates rewarding hedgerow conservation, crop rotation, and reduced chemical run-off."}]}, {"id": "pkg-r24", "num": 24, "skill": "Reading", "book": "Cambridge 7", "source": "Cam 7 · Test 4 · Passage 1", "title": "Pulling Strings to Build Pyramids", "subtitle": "Caltech experiments on harnessing wind & kites in ancient Egypt", "minutes": 20, "passage": "PULLING STRINGS TO BUILD PYRAMIDS\nNo one knows exactly how the pyramids were built. Over the millennia, historians have proposed huge earthen ramps, wooden levers, and thousands of labourers hauling sledges. However, business consultant Maureen Clemmons wondered whether the ancient Egyptians might have harnessed a resource that sweeps across the desert plateaus almost every afternoon: the wind.\n\nClemmons approached Morteza Gharib, professor of aeronautics at the California Institute of Technology (Caltech), to test whether a kite and pulley system could lift a heavy stone obelisk. Although initially sceptical, Gharib and his students calculated the aerodynamic lift of a 30-square-metre nylon sail. In field trials in the California desert, a wind of just 15 kilometres per hour enabled a single kite and pulley frame to raise a 3.5-tonne concrete obelisk into an upright position in less than 25 seconds.\n\nWhile Egyptologists note that no physical linen kites have survived in tombs, ancient reliefs frequently depict wovenlinen sails, ropes, and the 'ankh' symbol of life holding aloft wing-like banners. Whether or not the Pharaohs used wind lift, Gharib's team demonstrated that the physics required only materials available in 2500 BC.", "questions": [{"q": "What natural force did Maureen Clemmons suggest ancient Egyptians might have used to help raise heavy stones?", "options": ["Tidal waves", "Desert wind power using kites", "Steam engines"], "a": 1, "why": "Paragraph 1 states Clemmons wondered whether Egyptians harnessed the desert wind using kites."}, {"q": "What was Professor Morteza Gharib's initial attitude toward Clemmons's kite hypothesis?", "options": ["He was initially sceptical before testing the aerodynamics", "He had already published a book on Egyptian kites", "He refused to conduct any experiments"], "a": 0, "why": "Paragraph 2 notes 'Although initially sceptical, Gharib and his students calculated the aerodynamic lift...'."}, {"q": "In the Caltech desert trial, what wind speed was sufficient to lift the 3.5-tonne obelisk?", "options": ["Just 15 kilometres per hour", "Over 120 kilometres per hour", "Zero wind"], "a": 0, "why": "Paragraph 2 states 'a wind of just 15 kilometres per hour enabled a single kite and pulley frame to raise a 3.5-tonne concrete obelisk'."}, {"q": "Archaeologists have discovered dozens of intact wooden kites inside the Great Pyramid.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states that 'no physical linen kites have survived in tombs'."}, {"q": "What did the Caltech experiment prove from an engineering standpoint?", "options": ["That lifting heavy stones with wind and pulleys was physically possible using materials available in 2500 BC", "That aliens built the pyramids", "That ancient Egyptians had nylon factories"], "a": 0, "why": "Paragraph 3 concludes that Gharib's team demonstrated the physics required only materials available in 2500 BC."}]}, {"id": "pkg-r25", "num": 25, "skill": "Reading", "book": "Cambridge 8", "source": "Cam 8 · Test 1 · Passage 1", "title": "A Chronicle of Timekeeping", "subtitle": "From Babylonian calendars and water clocks to mechanical escapements", "minutes": 20, "passage": "A CHRONICLE OF TIMEKEEPING\nAccording to archaeological evidence, at least 5,000 years ago, and long before the advent of the Roman Empire, the Babylonians began to measure time, introducing calendars to co-ordinate communal activities, to plan the shipment of goods and, in particular, to regulate planting and harvesting. They based their calendars on three natural cycles: the solar day, the lunar month, and the solar year.\n\nCenturies before the Roman Empire, the Egyptians had formulated a municipal calendar having 12 months of 30 days, with five extra festival days added to approximate the solar year. To divide the day into smaller hours, they used stone sundials (which failed at night or on cloudy days) and clepsydras (water clocks), which measured time by the regulated drip of water from a graduated vessel.\n\nA major breakthrough occurred in 13th-century Europe with the invention of the mechanical weight-driven clock controlled by an 'escapement'—a toothed wheel that transferred energy in equal, rhythmic ticks. Later, in 1656, Christiaan Huygens perfected the pendulum clock, reducing daily error to seconds, and in the 19th century, railway networks led to global time zones anchored to Greenwich Mean Time.", "questions": [{"q": "Which three natural cycles formed the basis of early Babylonian calendars?", "options": ["The solar day, lunar month, and solar year", "Ocean tides, wind direction, and rainfall", "Heartbeats, footsteps, and candles"], "a": 0, "why": "Paragraph 1 lists 'the solar day, the lunar month, and the solar year'."}, {"q": "How did the ancient Egyptians adjust their 12-month (30-day) calendar to match the solar year?", "options": ["By adding five extra festival days each year", "By having 40 days in December", "By resetting the calendar every decade"], "a": 0, "why": "Paragraph 2 states they had 12 months of 30 days, with five extra festival days added."}, {"q": "What was the main limitation of sundials that water clocks (clepsydras) helped overcome?", "options": ["Sundials could not measure time at night or in cloudy weather", "Sundials were too small to read", "Sundials melted in the sun"], "a": 0, "why": "Paragraph 2 notes sundials failed at night or on cloudy days, whereas water clocks dripped continuously."}, {"q": "What 13th-century European invention regulated mechanical weight-driven clocks?", "options": ["The mechanical escapement", "The quartz crystal", "The atomic laser"], "a": 0, "why": "Paragraph 3 highlights the 13th-century mechanical clock controlled by an escapement."}, {"q": "Who perfected the pendulum clock in 1656?", "options": ["Christiaan Huygens", "Galileo Galilei", "Samuel Johnson"], "a": 0, "why": "Paragraph 3 states that in 1656 Christiaan Huygens perfected the pendulum clock."}]}, {"id": "pkg-r26", "num": 26, "skill": "Reading", "book": "Cambridge 8", "source": "Cam 8 · Test 2 · Passage 1", "title": "Sheet Glass Manufacture: The Float Process", "subtitle": "Alastair Pilkington's molten tin bath revolution", "minutes": 20, "passage": "SHEET GLASS MANUFACTURE: THE FLOAT PROCESS\nGlass, which has been made since the time of the Mesopotamians and Egyptians, is little more than a mixture of sand (silica), soda ash and lime. When heated to about 1500 degrees Celsius this becomes a molten mass that hardens when slowly cooled. The first successful method for making clear, flat panes of glass involved spinning or blowing molten glass and then flattening it, but the surfaces remained uneven.\n\nIn the 19th and early 20th centuries, thick 'plate glass' for shop windows was made by casting molten glass onto a table, rolling it into a ribbon, and then grinding and polishing both sides with heavy iron discs. While optically distortion-free, grinding and polishing wasted 20 per cent of the glass and was extremely expensive.\n\nIn 1952, Alastair Pilkington of the British glassmaker Pilkington Brothers conceived the 'Float Process'. A continuous ribbon of molten glass leaves the furnace at 1,100°C and floats along the surface of a shallow bath of molten tin. Because liquid tin is denser than glass and does not react with it, gravity and surface tension pull the glass into a perfectly flat, parallel sheet of uniform thickness without any mechanical grinding.", "questions": [{"q": "What was the major drawback of the older 'plate glass' method of grinding and polishing?", "options": ["It was very expensive and wasted about 20 per cent of the glass", "The resulting glass was opaque", "It could only make tiny circular lenses"], "a": 0, "why": "Paragraph 2 states grinding and polishing wasted 20 per cent of the glass and was extremely expensive."}, {"q": "In Alastair Pilkington's 1952 Float Process, what liquid metal does the molten glass ribbon float on?", "options": ["Molten tin", "Liquid mercury", "Molten iron"], "a": 0, "why": "Paragraph 3 states the molten glass floats along the surface of a shallow bath of molten tin."}, {"q": "Why is molten tin ideal for supporting the ribbon of hot glass?", "options": ["It is denser than glass, stays liquid at the right temperatures, and produces a perfectly flat surface", "It dyes the glass bright blue", "It makes the glass soft like rubber"], "a": 0, "why": "Paragraph 3 explains that liquid tin is denser than glass and gravity/surface tension pull the glass into a perfectly flat sheet."}, {"q": "Float glass still requires heavy mechanical grinding on both sides after leaving the tin bath.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 states the float process creates a flat, parallel sheet 'without any mechanical grinding'."}, {"q": "What are the three primary raw ingredients of ordinary glass?", "options": ["Sand (silica), soda ash, and lime", "Clay, coal, and water", "Phenol, formaldehyde, and woodflour"], "a": 0, "why": "Paragraph 1 lists sand (silica), soda ash, and lime."}]}, {"id": "pkg-r27", "num": 27, "skill": "Reading", "book": "Cambridge 8", "source": "Cam 8 · Test 2 · Passage 2", "title": "The Little Ice Age", "subtitle": "Climate shifts, Norse Greenland & European adaptation (1300–1850)", "minutes": 20, "passage": "THE LITTLE ICE AGE\nThis book will provide a detailed examination of the Little Ice Age and other climatic shifts, but, before I embark on that, let me provide a historical context. We tend to think of climate—as opposed to weather—as something unchanging, yet humanity has been at the mercy of climate change for its entire existence, with at least eight glacial episodes in the past 730,000 years.\n\nSince the end of the last Ice Age 10,000 years ago, global temperatures have fluctuated markedly. Between roughly AD 900 and 1200, the 'Medieval Warm Period' brought mild summers to Europe, allowing Norse voyagers to settle Greenland and cultivate barley in Iceland. Around 1300, however, North Atlantic temperatures plunged, ushering in the 'Little Ice Age' that lasted until about 1850.\n\n rather than a continuous deep freeze, the Little Ice Age was a seesaw of erratic weather: pack ice surrounded Iceland, cutting off the Norse Greenland colonies until they perished; Alpine glaciers advanced over Swiss villages; and the River Thames froze solid during London's famous 'Frost Fairs'. As waters cooled, cod shoals migrated south, spurring Dutch and English fishermen to build ocean-going fleets and adopt root crops like the potato.", "questions": [{"q": "What enabled Norse settlers to farm in Iceland and colonize Greenland between AD 900 and 1200?", "options": ["The milder climate of the Medieval Warm Period", "Heated glass greenhouses", "Nuclear icebreakers"], "a": 0, "why": "Paragraph 2 states the Medieval Warm Period (AD 900–1200) brought mild summers that allowed Norse voyagers to settle Greenland."}, {"q": "How does the writer characterize the climate during the Little Ice Age (1300–1850)?", "options": ["An unbroken, unchanging block of polar ice", "An erratic seesaw of cold winters, advancing glaciers, and unpredictable storms", "Warmer than the 21st century"], "a": 1, "why": "Paragraph 3 describes it as 'a seesaw of erratic weather' rather than a continuous deep freeze."}, {"q": "What happened to the Norse settlements in Greenland when Atlantic pack ice expanded?", "options": ["They were cut off from supply ships and eventually perished", "They built steamships and conquered North America", "They exported tropical fruit"], "a": 0, "why": "Paragraph 3 notes pack ice cut off the Norse Greenland colonies until they perished."}, {"q": "How did the southward migration of cod shoals affect European maritime history?", "options": ["It spurred Dutch and English fishermen to build ocean-going fishing fleets", "It ended all fishing in Europe", "It caused the River Thames to dry up"], "a": 0, "why": "Paragraph 3 explains that as cod migrated south, Dutch and English fishermen built ocean-going fleets."}, {"q": "How many major glacial episodes have occurred over the past 730,000 years?", "options": ["At least eight", "Only one", "More than five hundred"], "a": 0, "why": "Paragraph 1 mentions at least eight glacial episodes in the past 730,000 years."}]}, {"id": "pkg-r28", "num": 28, "skill": "Reading", "book": "Cambridge 8", "source": "Cam 8 · Test 3 · Passage 2", "title": "The Nature of Genius", "subtitle": "Prodigies, folklore vs science & the role of perseverance", "minutes": 20, "passage": "THE NATURE OF GENIUS\nThere has always been an interest in geniuses and prodigies. The word 'genius', from the Latin gens (family) and genius (begetter), was closely linked with the mystical notion of an innate guardian spirit. In the 19th century, popular folklore surrounded exceptional achievers with romantic myths: that child prodigies inevitably burn out young, or that genius is effortlessly bestowed without hard work.\n\nModern cognitive psychologist Professor Michael Howe challenges this mystique. Examining the biographies of figures such as Wolfgang Amadeus Mozart, John Stuart Mill, and Charles Darwin, Howe demonstrates that so-called 'miracles' of genius are grounded in thousands of hours of structured deliberate practice, often guided by intensely dedicated parents from infancy.\n\nFurthermore, the 19th-century belief that early prodigies are doomed to early death or mediocrity is contradicted by longitudinal studies: mathematician Norbert Wiener, who entered Tufts College at age 11 and earned a Harvard PhD at 18, went on to pioneer the field of cybernetics in adulthood. Genius, Howe concludes, is less a supernatural spark than the product of extraordinary perseverance, focus, and cumulative learning.", "questions": [{"q": "What two popular 19th-century myths about genius does the passage mention?", "options": ["That prodigies burn out young and that genius requires no hard work", "That geniuses cannot read and never attend school", "That only athletes can be geniuses"], "a": 0, "why": "Paragraph 1 cites the myths that child prodigies burn out young and that genius is effortlessly bestowed."}, {"q": "According to Professor Michael Howe, what lies behind the achievements of figures like Mozart and John Stuart Mill?", "options": ["Thousands of hours of deliberate practice and intensive early parental guidance", "A single genetic mutation discovered in 1995", "Complete isolation from teachers"], "a": 0, "why": "Paragraph 2 states their achievements are grounded in thousands of hours of structured deliberate practice guided by dedicated parents."}, {"q": "How does the life of Norbert Wiener contradict 19th-century folklore about child prodigies?", "options": ["After earning a PhD at 18, he went on to pioneer cybernetics as a highly productive adult scientist", "He forgot how to do mathematics at age 20", "He never attended university"], "a": 0, "why": "Paragraph 3 uses Norbert Wiener to show a child prodigy who went on to pioneer cybernetics in adulthood."}, {"q": "The author agrees that genius is a supernatural gift that makes hard work unnecessary.", "options": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "why": "Paragraph 3 concludes genius is 'less a supernatural spark than the product of extraordinary perseverance'."}, {"q": "From which language does the word 'genius' originate?", "options": ["Latin", "Ancient Greek", "Old Norse"], "a": 0, "why": "Paragraph 1 states the word 'genius' comes from the Latin gens and genius."}]}, {"id": "pkg-l1", "num": 29, "skill": "Listening", "book": "Cambridge 6", "source": "Cam 6 · Test 1 · Section 1", "title": "Kingswell Sports Club Enquiry", "subtitle": "Membership schemes, facilities, fees & trial session booking", "minutes": 10, "transcript": "WOMAN: Good morning, Kingswell Sports Club, how can I help you?\nMAN: Oh, good morning. I was wondering if you could give me some information about membership and facilities.\nWOMAN: Of course. What would you like to know?\nMAN: Do you have tennis courts, for example?\nWOMAN: No, I'm afraid we don't. We're primarily a golf club.\nMAN: What about football? I heard you had a team.\nWOMAN: No, I'm sorry. Perhaps you're thinking of Fresham Sports Centre.\nMAN: Oh, right. I know it. Carry on then.\nWOMAN: We have a keep-fit studio, which is very popular with members, and then as well as that there's swimming, of course.\nMAN: That's good. I like to swim every day. What about classes?\nWOMAN: We have judo classes and kick-boxing, and we also offer yoga classes on Tuesdays and Thursdays. Plus we have a salad bar which is open all day, and a restaurant opening soon.\nMAN: Right, got that. And what's the membership scheme?\nWOMAN: Well, for Gold membership, you can use all the facilities at any time of the day or week, and classes are free. The joining fee is £250, and the annual subscription fee is £500.\nMAN: Right, got that. And what's the next type?\nWOMAN: Silver — it's the same as Gold except you have to pay a small fee of £1.00 per lesson for any you do and you can only use the centre at certain times: between 10 am and 4.30 pm. The joining fee is £225, and the annual fee is £300.\nMAN: Well, it's still rather more expensive than I thought. I'm a student here in England and I'm only here for six months.\nWOMAN: Ah, then the Bronze scheme would probably suit you best. Some of the facilities have restricted use, and it's £3 for each class you join. Hours are between 10.30 and 3.30 weekdays only and you pay a £50 joining fee. The annual fee is £180 — it works out at £15 a month.\nMAN: Oh, that should be all right. What do I have to do if I want to join?\nWOMAN: Well, we book you in for an assessment with an instructor, who will show you how to use all the equipment. If you want to organise a trial session and look around the centre, you'll need to speak to David Kynchley.\nMAN: Could you spell that please?\nWOMAN: Yes, K-Y-N-C-H-L-E-Y. His direct line is 0458 95311.", "questions": [{"q": "Besides golf and swimming, which facility is available at Kingswell Sports Club?", "options": ["A keep-fit studio", "Tennis courts", "A football pitch"], "a": 0, "why": "The receptionist says: 'We have a keep-fit studio, which is very popular with members, and then as well as that there's swimming.'"}, {"q": "Besides judo and kick-boxing, which classes are available?", "options": ["Yoga classes", "Pilates classes", "Squash classes"], "a": 0, "why": "She mentions: 'We have judo classes and kick-boxing, and we also offer yoga classes on Tuesdays and Thursdays.'"}, {"q": "Which catering facility is currently open at the club?", "options": ["A salad bar", "A formal restaurant", "A coffee kiosk"], "a": 0, "why": "She states: 'Plus we have a salad bar which is open all day, and a restaurant opening soon.'"}, {"q": "What is the annual subscription fee for the Gold membership scheme?", "options": ["£250", "£500", "£300"], "a": 1, "why": "For Gold, the joining fee is £250, and 'the annual subscription fee is £500'."}, {"q": "During what hours can Silver members use the facilities?", "options": ["Between 10 am and 4.30 pm", "Between 8 am and 8 pm", "Between 10.30 am and 3.30 pm"], "a": 0, "why": "For Silver: 'You can only use the facilities between 10 am and 4.30 pm.'"}, {"q": "What is the annual subscription fee for the Bronze membership scheme?", "options": ["£50", "£180", "£225"], "a": 1, "why": "For Bronze: 'you pay a £50 joining fee. The annual fee is £180 — it works out at £15 a month.'"}, {"q": "To join the centre, what do you need to book with an instructor?", "options": ["An assessment", "A competition", "A medical test"], "a": 0, "why": "'Well, we book you in for an assessment with an instructor, who will show you how to use all the equipment.'"}, {"q": "To book a trial session, you should speak to David ............ .", "options": ["Kynchley", "Kinckley", "Kinchly"], "a": 0, "why": "She spells the surname explicitly: 'K-Y-N-C-H-L-E-Y'."}]}, {"id": "pkg-l2", "num": 30, "skill": "Listening", "book": "Cambridge 6", "source": "Cam 6 · Test 2 · Section 2", "title": "Trebirch Train Services & Day Trips", "subtitle": "Stations, ticket types, departure intervals & excursions", "minutes": 10, "transcript": "CUSTOMER: Hello. My family and I are staying here in Trebirch for a week or two and we wanted to know about the train services. We're hoping to do a few local trips.\nCLERK: OK. Well, I can give you lots of details about all the trains going from Trebirch in the South West. We've got two main train stations in town. King Street is for local commuter lines and regional services.\nCUSTOMER: What about trains to London? I'll need to go there on business for one day.\nCLERK: Then you need to go to Central Station — that's for all the national services. There are regular trains to London. They leave Trebirch every half hour on weekdays and every hour at weekends. It takes about two hours, and you can get a first class ticket, which includes refreshments, or standard class.\nCUSTOMER: And are there discounted tickets?\nCLERK: Yes, you can get various discounted tickets. A popular one is called the Supersave, and this is OK for travel after 8.45. Then there is the Special ticket, which is valid for travel after 10.15. The Special tickets are also valid for travel at weekends. The cheapest tickets are called Advance and you have to buy them at least six days ahead. Only a certain number are available and you have to make seat reservations for these.\nCUSTOMER: Thanks. And are there lots of places to go to around here?\nCLERK: Oh yes. You can enjoy many days out. There's the Merthyr Mining Museum, which is only half an hour from Trebirch by train. Your children will find it just as fascinating as any theme park and they can ride in the original miners' lifts and on the coal trains. There are special excursion tickets which include entrance fees. Mainline trains also offer direct services to Bristol, where you can visit the docks or spend a great day out with the children in the zoo, which is set in the parkland that used to surround the old castle. And next year we'll be running a special service to Newport when the new science museum opens.", "questions": [{"q": "Local and regional commuter services depart from ............ railway station.", "options": ["King Street", "Central", "Trebirch West"], "a": 0, "why": "'King Street is for local commuter lines and regional services.'"}, {"q": "National services (including trains to London) depart from the ............ railway station.", "options": ["Central", "King Street", "Bristol"], "a": 0, "why": "'Then you need to go to Central Station — that's for all the national services.'"}, {"q": "How often do trains for London depart each day during the week?", "options": ["Every half hour (30 minutes)", "Every hour", "Every two hours"], "a": 0, "why": "'They leave Trebirch every half hour on weekdays and every hour at weekends.'"}, {"q": "What is included in the price of a first class ticket?", "options": ["Refreshments", "Seat reservations only", "Museum entrance fees"], "a": 0, "why": "'you can get a first class ticket, which includes refreshments, or standard class.'"}, {"q": "After what time is the 'Special' discounted ticket valid for travel?", "options": ["8.45 am", "10.15 am", "6.00 pm"], "a": 1, "why": "'Then there is the Special ticket, which is valid for travel after 10.15.'"}, {"q": "Which ticket type is the cheapest and must be bought at least six days ahead?", "options": ["Advance", "Supersave", "Special"], "a": 0, "why": "'The cheapest tickets are called Advance and you have to buy them at least six days ahead.'"}, {"q": "What is essential when buying an Advance ticket?", "options": ["Seat reservations", "Travelling with children", "Weekend travel"], "a": 0, "why": "'Only a certain number are available and you have to make seat reservations for these.'"}, {"q": "Which attraction in Bristol is set in the parkland that used to surround the old castle?", "options": ["The zoo", "The mining museum", "The new science museum"], "a": 0, "why": "'spend a great day out with the children in the zoo, which is set in the parkland that used to surround the old castle.'"}]}, {"id": "pkg-l3", "num": 31, "skill": "Listening", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Section 1", "title": "King's Restaurant Job Enquiry", "subtitle": "Part-time student work, pay rate, benefits & interview details", "minutes": 10, "transcript": "WOMAN: Good evening. King's Restaurant.\nMAN: Good evening. I'm ringing about the job I understand you have vacant.\nWOMAN: Oh yes. Can I take your name?\nMAN: It's Peter Chin. What sort of work is it — washing up?\nWOMAN: It's answering the phone.\nMAN: Oh right, fine. And not waiting at table. That'd be good. And how many nights a week would it be?\nWOMAN: Three actually, so it would work out at twelve hours a week.\nMAN: That'd be fine. It wouldn't interfere with my studies. I'm a first year Physics student. Where exactly is the restaurant?\nWOMAN: Well, we have two branches — the one we're recruiting for is in Hillsdunne Road.\nMAN: I don't know that. How do you spell it please?\nWOMAN: It's H-I-double L-S-D-U-double N-E Road.\nMAN: Got that. Thanks. Is it near a bus stop?\nWOMAN: Yes. The nearest one would probably be just beside the Library.\nMAN: Oh yes, I know it. And could I ask about the pay?\nWOMAN: We're offering £4.45 an hour. We also offer some good fringe benefits. We give you a free dinner, so you eat well. And we also offer extra pay for working on national holidays. And then because of the difficulties of getting public transport, if you're working after 11 o'clock we drive you home.\nMAN: Oh, that's good to know. Could I just also ask what qualities you're looking for?\nWOMAN: Well, for this particular job we want a clear voice, which you obviously do have! And you must be able to think quickly, you know. So, when could you come in for an interview?\nMAN: Sorry, I couldn't come tonight or tomorrow. Thursday's okay — that'd be 22nd of October.\nWOMAN: Fine, would 6 o'clock be okay? And could you bring along the names of two referees?\nMAN: Yes, that's fine. Oh, by the way, who should I ask for?\nWOMAN: My name is Samira Manuja. That's M-A-N-U-J-A.", "questions": [{"q": "What type of work is the job vacancy at King's Restaurant?", "options": ["Answering the phone", "Washing up", "Waiting at table"], "a": 0, "why": "When Peter asks if it is washing up, the manager replies: 'It's answering the phone.'"}, {"q": "In which branch is the job located?", "options": ["Hillsdunne Road", "Hilldene Road", "Hillsdown Road"], "a": 0, "why": "She spells it out: 'H-I-double L-S-D-U-double N-E Road.'"}, {"q": "Where is the nearest bus stop located?", "options": ["Next to the Library", "Next to the University", "Beside the hostel"], "a": 0, "why": "'The nearest one would probably be just beside the Library.'"}, {"q": "What is the hourly pay rate offered by the restaurant?", "options": ["£4.45 an hour", "£3.95 an hour", "£4.50 an hour"], "a": 0, "why": "'We're offering £4.45 an hour. That's very good. My last job was £3.95 an hour.'"}, {"q": "When do employees receive extra pay?", "options": ["When working on national holidays", "When working on weekends", "When working during university exams"], "a": 0, "why": "'And we also offer extra pay for working on national holidays.'"}, {"q": "When does the restaurant provide transport home?", "options": ["When working after 11 o'clock", "Every Thursday night", "Before 6 p.m."], "a": 0, "why": "'if you're working after 11 o'clock we drive you home.'"}, {"q": "Besides a clear voice, what ability is required for the job?", "options": ["Ability to think quickly", "Ability to cook dinner", "Ability to drive a car"], "a": 0, "why": "'we want a clear voice... And you must be able to think quickly, you know.'"}, {"q": "Who should Peter ask for when he arrives for the interview on 22 October?", "options": ["Samira Manuja", "Samira Manjua", "Samira Majuna"], "a": 0, "why": "She spells her surname: 'M-A-N-U-J-A'."}]}, {"id": "pkg-l4", "num": 32, "skill": "Listening", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Section 4", "title": "Mass Strandings of Whales and Dolphins", "subtitle": "Marine biology lecture on parasites, toxins, sonar & social behaviour", "minutes": 10, "transcript": "Good afternoon everyone. Well, with some of you about to go out on field work it's timely that in this afternoon's session I'll be sharing some ideas about the reasons why groups of whales and dolphins sometimes swim ashore from the sea right onto the beach and, most often, die in what are known as 'mass strandings'.\n\nUnfortunately, this type of event is a frequent occurrence in some of the locations that you'll be travelling to, where sometimes the tide goes out suddenly, confusing the animals. However, there are many other theories about the causes of mass strandings.\n\nThe first is that the behaviour is linked to parasites. It's often found that stranded animals were infested with large numbers of parasites. For instance, a type of worm is commonly found in the ears of dead whales. Since marine animals rely heavily on their hearing to navigate, this type of infestation has the potential to be very harmful.\n\nAnother theory is related to toxins, or poisons. These have also been found to contribute to the death of many marine animals. Many toxins, as I'm sure you're aware, originate from plants, or animals. The whale ingests these toxins in its normal feeding behaviour. In 1988, for example, fourteen humpback whales examined after stranding along the beaches of Cape Cod were found to have been poisoned after eating tuna that contained saxitoxin, the same toxin that can be fatal in humans.\n\nAlternatively, it has also been suggested that some animals strand accidentally by following their prey ashore in the confusion of the chase. In 1995 David Thurston monitored pilot whales that beached after following squid ashore. However, this idea does not seem to hold true for the majority of mass strandings because examination of the animals' stomach contents reveal that most had not been feeding as they stranded.\n\nThere are also some new theories which link strandings to humans. A growing concern is that loud noises in the ocean cause strandings. Noises such as those caused by military exercises are of particular concern and have been pinpointed as the cause of some strandings of late. One of these, a mass stranding of whales in 2000 in the Bahamas coincided closely with experiments using a new submarine detection system. There were several factors that made this stranding stand out as different from previous strandings. For one, all the stranded animals were healthy. In addition, the animals were spread out along 38 kilometres of coast, whereas it's more common for the animals to be found in a group when mass strandings occur.\n\nA final theory is related to group behaviour, and suggests that sea mammals cannot distinguish between sick and healthy leaders and will follow sick leaders, even to an inevitable death. This is a particularly interesting theory since the whales that are thought to be most social — the toothed whales — are the group that strand the most frequently. The theory is also supported by evidence from a dolphin stranding in 1994. Examination of the dead animals revealed that apart from the leader, all the others had been healthy at the time of their death.\n\nI recommend John Connor's Marine Mammals Ashore as an excellent starting point if you're interested in finding out more about these stranding networks.", "questions": [{"q": "Mass strandings are common in areas where the ............ can change quickly.", "options": ["tide / tides", "water temperature", "wind direction"], "a": 0, "why": "'where sometimes the tide goes out suddenly, confusing the animals.'"}, {"q": "Some parasites (such as worms) can affect marine animals' ............ , which they depend on for navigation.", "options": ["hearing / ears", "eyesight", "fins"], "a": 0, "why": "'a type of worm is commonly found in the ears of dead whales. Since marine animals rely heavily on their hearing to navigate...'"}, {"q": "Poisons from ............ are commonly consumed by whales during normal feeding.", "options": ["plants or animals (fish)", "plastic waste", "oil spills"], "a": 0, "why": "'Many toxins, as I'm sure you're aware, originate from plants, or animals.'"}, {"q": "Why is the 'following prey ashore' theory unlikely for the majority of mass strandings?", "options": ["Most animals had not been feeding when they stranded", "Prey animals do not swim near beaches", "Whales only hunt in deep ocean trenches"], "a": 0, "why": "'examination of the animals' stomach contents reveal that most had not been feeding as they stranded.'"}, {"q": "What human activity from military tests is linked to some recent strandings?", "options": ["Loud noises (submarine detection)", "Fishing nets", "Cargo shipping"], "a": 0, "why": "'Noises such as those caused by military exercises are of particular concern...'"}, {"q": "Why was the Bahamas (2000) whale stranding unusual?", "options": ["All the whales were healthy and not in a group", "Only one whale was found", "The whales were poisoned by saxitoxin"], "a": 0, "why": "'For one, all the stranded animals were healthy. In addition, the animals were spread out along 38 kilometres of coast, whereas it's more common for the animals to be found in a group.'"}, {"q": "Under the group behaviour theory, which species of whales experience more strandings?", "options": ["The most social species (toothed whales)", "Solitary baleen whales", "Deep-diving arctic whales"], "a": 0, "why": "'the whales that are thought to be most social — the toothed whales — are the group that strand the most frequently.'"}, {"q": "In the 1994 dolphin stranding, which animal was found to have been ill?", "options": ["Only the leader", "All the young dolphins", "Every dolphin in the pod"], "a": 0, "why": "'Examination of the dead animals revealed that apart from the leader, all the others had been healthy at the time of their death.'"}]}, {"id": "pkg-l5", "num": 33, "skill": "Listening", "book": "Cambridge 9", "source": "Cam 9 · Test 2 · Section 1", "title": "Student Accommodation Form (Anu Bhatt)", "subtitle": "University hall of residence application & room preferences", "minutes": 10, "transcript": "MAN: Good morning. Can I help you?\nWOMAN: Yes. I've just been accepted on a course at the university and I'd like to try and arrange accommodation in the hall of residence.\nMAN: Yes, certainly. Please sit down. So first of all, can I take your name?\nWOMAN: It's Anu Bhatt. That's A-N-U ... B-H-A double T.\nMAN: Thanks, and could I ask your date of birth?\nWOMAN: 31st March 1972.\nMAN: Thank you. And where are you from?\nWOMAN: India.\nMAN: Oh right. And what will you be studying?\nWOMAN: I'm doing a course in nursing.\nMAN: Right, thank you. And how long would you want to stay in hall, do you think?\nWOMAN: Well, it'll take three years but I'd only like to stay in hall for two. I'd like to think about living outside for the third year.\nMAN: Fine. And what did you have in mind for catering? Do you want to cook for yourself or have all your meals provided, that's full board? Or you can just have evening meal provided, which is half board.\nWOMAN: That's what I'd prefer — half board.\nMAN: Now, with that in mind, do you have any special diet, anything we should know about?\nWOMAN: Yes, I don't take red meat.\nMAN: No red meat. Now, thinking about the room itself, you can have a single study bedroom or a shared one. The other alternative is to opt for a single bedsit which actually has more space and better facilities. There's about £20 a week difference between them.\nWOMAN: Well, actually my grant is quite generous and I think the bedsit sounds the best option.\nMAN: Lovely. Now can I ask some other personal details about your interests?\nWOMAN: Ummm. Well, I love the theatre. And I enjoy sports, particularly badminton.\nMAN: That's worth knowing. Now, what we finish with on the form is really a list from you of what your priorities are in choosing a hall.\nWOMAN: Well, the first thing is I'd prefer a hall where there are other mature students, if possible. And I'd prefer to be out of town.\nMAN: That's actually very good for you because we tend to have more vacancies in out-of-town halls. Anything else?\nWOMAN: Well, I would like somewhere with a shared area, a TV room for example, or something like that. It's a good way to socialise.", "questions": [{"q": "How is the applicant's surname spelled?", "options": ["Bhatt", "Bahtt", "Bhat"], "a": 0, "why": "She spells it: 'B-H-A double T'."}, {"q": "What is Anu's date of birth?", "options": ["31 March 1972", "13 March 1972", "31 May 1972"], "a": 0, "why": "'31st March 1972.'"}, {"q": "What course of study will Anu be doing?", "options": ["Nursing", "Medicine", "Pharmacy"], "a": 0, "why": "'I'm doing a course in nursing.'"}, {"q": "How many years does she plan to stay in the hall of residence?", "options": ["2 years", "3 years", "1 year"], "a": 0, "why": "'Well, it'll take three years but I'd only like to stay in hall for two.'"}, {"q": "What is her special dietary requirement?", "options": ["No red meat", "Vegetarian only", "No dairy products"], "a": 0, "why": "'Yes, I don't take red meat.'"}, {"q": "Which preferred room type does she choose?", "options": ["A single bedsit", "A single study bedroom", "A shared room"], "a": 0, "why": "'I think the bedsit sounds the best option.'"}, {"q": "Besides badminton, what interest does she mention?", "options": ["The theatre", "Cinema", "Photography"], "a": 0, "why": "'Well, I love the theatre. And I enjoy sports, particularly badminton.'"}, {"q": "What are her three priorities in choosing a hall?", "options": ["To be with mature/older students, live outside town, and have a shared area for socialising", "To be with first-year students, live in the city centre, and have a private kitchen", "To be near the hospital, have full board, and have a quiet library"], "a": 0, "why": "She asks for 'other mature students', 'to be out of town', and 'somewhere with a shared area, a TV room for example'."}]}, {"id": "pkg-l6", "num": 34, "skill": "Listening", "book": "Cambridge 9", "source": "Cam 9 · Test 3 · Section 4", "title": "The Underground House (Eco-Housing)", "subtitle": "Contemporary experimental architecture, solar energy & environmental debt", "minutes": 10, "transcript": "Good morning. In the last few lectures I've been talking about the history of domestic building construction. But today I want to begin looking at some contemporary, experimental designs for housing. So, I'm going to start with a house which is constructed more or less under the ground. And one of the interesting things about this project is that the owners — both professionals but not architects — wanted to be closely involved, so they decided to manage the project themselves. Their chief aim was to create somewhere that was as environmentally-friendly as possible. But at the same time they wanted to live somewhere peaceful — they'd both grown up in a rural area and disliked urban life.\n\nSo the first thing they did was to look for a site. And they found a disused stone quarry in a beautiful area. The price was relatively low, and they liked the idea of recycling the land, as it were. As it was, the quarry was an ugly blot on the landscape, and it wasn't productive any longer, either.\n\nThey consulted various architects and looked at a number of designs before finally deciding on one. As I've said, it was a design for a sort of underground house, and it was built into the earth itself, with two storeys. The north, east and west sides were set in the earth, and only the sloping, south-facing side was exposed to light. That was made of a double layer of very strong glass. There were also photovoltaic tiles fixed to the top and bottom of this sloping wall. These are tiles that are designed to store energy from the sun. And the walls had a layer of foam around them too, to increase the insulation.\n\nNow, what is of interest to us about this project is the features which make the building energy-efficient. Sunlight floods in through the glass wall, and to maximise it there are lots of mirrors and windows inside the house. That helps to spread the light around.\n\nIn addition, the special tiles on the outside convert energy from the sun and generate some of the house's electricity. In fact, and it's possible that in future the house may even generate an electricity surplus, and that the owners will be able to sell some to the national grid.\n\nAs well as that, wherever possible, recycled materials have been used. For example, the floors are made of reclaimed wood. And the owners haven't bought a single item of new furniture — they just kept what they already had. And then there's the system for dealing with the waste produced in the house. This is dealt with organically — it's purified by being filtered through reed beds which have been planted for that purpose in the garden.\n\nIt's true that the actual construction of the house was harmful to the environment, mainly because they had to use massive amounts of concrete — one of the biggest sources of carbon dioxide in manufacturing. In total, the house construction has released 70 tons of carbon dioxide into the air. However, once the initial 'debt' has been cleared — and it's been calculated that this will only take fifteen years — this underground house won't cost anything — environmentally I mean — because unlike ordinary houses, it is run in a way that is completely environmentally friendly.", "questions": [{"q": "What is true about the owners of the underground house?", "options": ["They were interested in environmental issues", "They had no experience of living in a rural area", "They hired a professional project manager"], "a": 0, "why": "'they decided to manage the project themselves. Their chief aim was to create somewhere that was as environmentally-friendly as possible.'"}, {"q": "What does the speaker say about the site of the house (the disused stone quarry)?", "options": ["The land was quite cheap", "Stone was still being extracted nearby", "It was in a completely unspoilt area"], "a": 0, "why": "'The price was relatively low, and they liked the idea of recycling the land... the quarry was an ugly blot on the landscape, and it wasn't productive any longer.'"}, {"q": "The south-facing side of the house was constructed of two layers of ............ .", "options": ["glass", "foam", "concrete"], "a": 0, "why": "'only the sloping, south-facing side was exposed to light. That was made of a double layer of very strong glass.'"}, {"q": "A layer of foam was used around the walls to improve the ............ of the building.", "options": ["insulation", "lighting", "ventilation"], "a": 0, "why": "'And the walls had a layer of foam around them too, to increase the insulation.'"}, {"q": "To increase the light inside, the building has many internal mirrors and ............ .", "options": ["windows", "skylights", "lamps"], "a": 0, "why": "'Sunlight floods in through the glass wall, and to maximise it there are lots of mirrors and windows inside the house.'"}, {"q": "In future, the house may produce more ............ than it needs.", "options": ["electricity", "heat", "water"], "a": 0, "why": "'it's possible that in future the house may even generate an electricity surplus'."}, {"q": "Recycled (reclaimed) wood was used for the ............ of the house.", "options": ["floors", "doors", "furniture"], "a": 0, "why": "'For example, the floors are made of reclaimed wood.'"}, {"q": "The use of large quantities of concrete was environmentally harmful, but the house will have paid its 'environmental debt' within ............ .", "options": ["15 years", "70 years", "20 years"], "a": 0, "why": "'once the initial debt has been cleared — and it's been calculated that this will only take fifteen years...'"}]}, {"id": "pkg-l7", "num": 35, "skill": "Listening", "book": "Cambridge 13", "source": "Cam 13 · Test 1 · Section 1", "title": "Cookery Classes Enquiry", "subtitle": "The Food Studio, Bond's Cookery School & The Arretsa Centre", "minutes": 10, "transcript": "OFFICIAL: Hello, Tourist Information Centre, Mike speaking, how can I help you?\nWOMAN: Oh, hi. I wanted to find out about cookery classes. I believe there are some one-day classes for tourists?\nOFFICIAL: Well, they're open to everyone, but tourists are always welcome. OK, let me give you some details of what's available. One very popular one is at The Food Studio. They focus on seasonal products, and as well as teaching you how to cook them, they also show you how to choose them.\nWOMAN: Right, that sounds good. How big are the classes?\nOFFICIAL: I'm not sure exactly, but they'll be quite small.\nWOMAN: And could I get a private lesson there?\nOFFICIAL: I think so ... let me check, yes, they do offer those. And this company has a special deal for clients where they offer a discount of 20 percent if you return for a further class.\nWOMAN: OK. But you said there were several classes?\nOFFICIAL: That's right. Another one you might be interested in is Bond's Cookery School. They're quite new, they just opened six months ago, but I've heard good things about them. They concentrate on teaching you to prepare healthy food, and they have quite a lot of specialist staff. It's more to do with recipes that look at specific needs, like including ingredients that will help build up your bones and make them stronger, that sort of thing.\nWOMAN: I see. Do they have a website I could check?\nOFFICIAL: Yes, just key in the name of the school. And if you want to know more about them, every Thursday evening they have a lecture at the school. It's free and you don't need to book or anything, just turn up at 7.30.\nWOMAN: OK, thanks.\nOFFICIAL: OK, there's one more place you might be interested in. That's got a rather strange name, it's called The Arretsa Centre — that's spelled A-R-R-E-T-S-A. They've got a very good reputation. They do a bit of meat and fish cookery but they mostly specialise in vegetarian dishes.\nWOMAN: Right. That's certainly an area I'd like to learn more about. In fact, I think I might have seen that school today. Is it just by the market?\nOFFICIAL: That's right. So they don't have any problem getting their ingredients, they're right next door. And they also offer a special two-hour course in how to use a knife. They cover all the different skills — buying them, sharpening, chopping techniques. It gets booked up quickly though.", "questions": [{"q": "At The Food Studio, classes focus on how to ............ and cook with seasonal products.", "options": ["choose", "grow", "preserve"], "a": 0, "why": "'as well as teaching you how to cook them, they also show you how to choose them.'"}, {"q": "Besides small group classes, The Food Studio also offers ............ classes.", "options": ["private", "online", "weekend"], "a": 0, "why": "When asked 'And could I get a private lesson there?', he replies 'yes, they do offer those.'"}, {"q": "Clients who return to The Food Studio for a further class get a ............ discount.", "options": ["20 percent", "10 percent", "25 percent"], "a": 0, "why": "'they offer a discount of 20 percent if you return for a further class.'"}, {"q": "Bond's Cookery School focuses on food that is ............ and includes recipes to strengthen your bones.", "options": ["healthy", "low-calorie", "organic"], "a": 0, "why": "'They concentrate on teaching you to prepare healthy food... recipes that look at specific needs, like including ingredients that will help build up your bones.'"}, {"q": "What does Bond's Cookery School offer free every Thursday evening?", "options": ["A lecture", "A dinner", "A recipe book"], "a": 0, "why": "'every Thursday evening they have a lecture at the school. It's free and you don't need to book.'"}, {"q": "What is the name of the third cookery centre?", "options": ["The Arretsa Centre", "The Aretsa Centre", "The Arresta Centre"], "a": 0, "why": "He spells it: 'A-R-R-E-T-S-A'."}, {"q": "The Arretsa Centre specialises mainly in ............ food and is located near the market.", "options": ["vegetarian", "seafood", "traditional"], "a": 0, "why": "'They do a bit of meat and fish cookery but they mostly specialise in vegetarian dishes.'"}, {"q": "The Arretsa Centre sometimes offers a special two-hour course in skills with a ............ .", "options": ["knife", "wok", "blender"], "a": 0, "why": "'And they also offer a special two-hour course in how to use a knife.'"}]}, {"id": "pkg-l8", "num": 36, "skill": "Listening", "book": "Cambridge 13", "source": "Cam 13 · Test 1 · Section 4", "title": "Effects of Urban Environments on Animals", "subtitle": "Evolutionary biology lecture on city wildlife adaptations", "minutes": 10, "transcript": "Hi. Today we're going to be looking at animals in urban environments and I'm going to be telling you about some research on how they're affected by these environments.\n\nNow, in evolutionary terms, urban environments represent huge upheavals, the sorts of massive changes that usually happen over millions of years. And we used to think that only a few species could adapt to this new environment. One species which is well known as being highly adaptable is the crow, and there've been various studies about how they manage to learn new skills. Another successful species is the pigeon, because they're able to perch on ledges on the walls of city buildings, just like they once perched on cliffs by the sea.\n\nBut in fact, we're now finding that these early immigrants were just the start of a more general movement of animals into cities, and of adaptation by these animals to city life. And one thing that researchers are finding especially interesting is the speed with which they're doing this — we're not talking about gradual evolution here — these animals are changing fast.\n\nLet me tell you about some of the studies that have been carried out in this area. So, in the University of Minnesota, a biologist called Emilie Snell-Rood and her colleagues looked at specimens of urbanised small mammals such as mice and gophers that had been collected in Minnesota over the last hundred years, and that are now kept in museums there. And she found that during that time, these small mammals had experienced a jump in brain size when compared to rural mammals. Now, we can't be sure this means they're more intelligent, but since the sizes of other parts of the body didn't change, it does suggest that something cognitive was going on. And Snell-Rood thinks that this change might reflect the cognitive demands of adjusting to city life — having to look in different places to find food, for example, and coping with a whole new set of dangers.\n\nThen over in Germany at the Max Planck Institute, there's another biologist called Catarina Miranda who's done some experiments with blackbirds living in urban and rural areas. And she's been looking not at their anatomy, but at their behaviour. So as you might expect, she's found that the urban blackbirds tend to be quite bold — they're prepared to face up to a lot of threats that would frighten away their country counterparts. But there's one type of situation that does seem to frighten the urban blackbirds, and that's anything new — anything they haven't experienced before.\n\nJonathan Atwell, in Indiana University, is looking at how a range of animals respond to urban environments. He's found that when they're under stress, their endocrine systems react by reducing the amount of hormones such as corticosterone into their blood. It's a sensible-seeming adaptation. A rat that gets scared every time a subway train rolls past won't be very successful.\n\nThere's just one more study I'd like to mention which is by Sarah Partan and her team, and they've been looking at how squirrels communicate in an urban environment, and they've found that a routine part of their communication is carried out by waving their tails. You do also see this in the country, but it's much more prevalent in cities, possibly because it's effective in a noisy environment.\n\nSo what are the long-term implications of this? One possibility is that we may see completely new species developing in cities. But on the other hand, it's possible that not all of these adaptations will be permanent. Once the animal's got accustomed to its new environment, it may no longer need the features it's developed.", "questions": [{"q": "Which bird was previously known to be suitable for city life because of its general adaptability?", "options": ["The crow", "The blackbird", "The sparrow"], "a": 0, "why": "'One species which is well known as being highly adaptable is the crow.'"}, {"q": "Pigeons adapted well to cities because walls of city buildings are similar to ............ .", "options": ["cliffs", "trees", "caves"], "a": 0, "why": "'they're able to perch on ledges on the walls of city buildings, just like they once perched on cliffs by the sea.'"}, {"q": "Many urban animals are adapting with unusual ............ .", "options": ["speed", "strength", "size"], "a": 0, "why": "'one thing that researchers are finding especially interesting is the speed with which they're doing this.'"}, {"q": "Emilie Snell-Rood found that the size of small urbanised mammals' ............ had increased.", "options": ["brain / brains", "ears", "stomachs"], "a": 0, "why": "'these small mammals had experienced a jump in brain size when compared to rural mammals.'"}, {"q": "Snell-Rood suggests this brain change may be due to the need to locate new sources of ............ and deal with new dangers.", "options": ["food", "water", "shelter"], "a": 0, "why": "'having to look in different places to find food, for example, and coping with a whole new set of dangers.'"}, {"q": "Catarina Miranda focused on the ............ of urban and rural blackbirds and found urban birds were afraid of situations that were new.", "options": ["behaviour / behavior", "anatomy", "diet"], "a": 0, "why": "'she's been looking not at their anatomy, but at their behaviour.'"}, {"q": "Jonathan Atwell found that some urban animals respond to ............ by producing lower levels of hormones.", "options": ["stress", "noise", "light"], "a": 0, "why": "'He's found that when they're under stress, their endocrine systems react by reducing the amount of hormones...'"}, {"q": "Sarah Partan's team found urban squirrels use their ............ to help them communicate in noisy environments, though some changes may not be permanent.", "options": ["tails / tail", "voices", "paws"], "a": 0, "why": "'a routine part of their communication is carried out by waving their tails.'"}]}, {"id": "pkg-l9", "num": 37, "skill": "Listening", "book": "Cambridge 13", "source": "Cam 13 · Test 2 · Section 1", "title": "South City Cycling Club", "subtitle": "Club membership types, kit orders & morning training rides", "minutes": 10, "transcript": "JIM: Hello, South City Cycling Club. I'm the club secretary and my name's Jim Hunter.\nWOMAN: Oh, hi Jim. I want to find out about joining the club.\nJIM: OK. Well there are basically two types of adult membership. If you're pretty serious about cycling, there's the Full membership. That costs 260 dollars and that covers you not just for ordinary cycling but also for races both here in the city and also in other parts of Australia.\nWOMAN: Right. Well, I'm not really up to that standard. I was more interested in just joining a group to do some cycling in my free time.\nJIM: Sure. That's why most people join. So, in that case you'd be better with the Recreational membership. That's 108 dollars if you're over 19, and 95 dollars if you're under. Now both types of membership include the club fee of 20 dollars. They also provide insurance in case you have an accident, though we hope you won't need that, of course.\nWOMAN: No. OK, well, I'll go with the Recreational membership, I think. And once I'm a member, can I buy the green and white club kit at the club?\nJIM: No, it's made to order by a company in Brisbane. You can find them online: they're called Jerriz. That's J-E-R-R-I-Z. You can use your membership number to put in an order on their website.\nWOMAN: OK. Now, can you tell me a bit about the rides I can do?\nJIM: Sure. So we have training rides pretty well every morning, and they're a really good way of improving your cycling skills as well as your general level of fitness, but they're different levels. Level A is pretty fast — you're looking at about 30 or 35 kilometres an hour. If you can do about 25 kilometres an hour, you'd probably be Level B, and then Level C are the novices, who stay at about 15 kilometres per hour.\nWOMAN: Right. Well I reckon I'd be Level B. So, when are the sessions for that level?\nJIM: There are a couple each week. They're both early morning sessions. There's one on Tuesdays at 5.30 am, and for that one you meet at the stadium. And on Thursdays at 5.30 am, they meet at the entrance to the park, just past the shopping mall.\nWOMAN: So how long are the rides?\nJIM: They're about an hour and a half. And the members often go somewhere for coffee afterwards, so it's quite a social event.\nWOMAN: And does each ride have a leader?\nJIM: Sometimes, but not always. If you check the club website, you'll see that the route for each ride is clearly marked. So you can just print that out and take it along with you. And in winter, it's well before sunrise when we set out, so you need to make sure your bike's got lights.", "questions": [{"q": "Full membership costs $260 and covers ordinary cycling as well as ............ all over Australia.", "options": ["races", "repairs", "accommodation"], "a": 0, "why": "'that covers you not just for ordinary cycling but also for races both here in the city and also in other parts of Australia.'"}, {"q": "The cost of membership includes the $20 club fee and ............ .", "options": ["insurance", "a helmet", "the club kit"], "a": 0, "why": "'Now both types of membership include the club fee of 20 dollars. They also provide insurance in case you have an accident.'"}, {"q": "What is the name of the Brisbane company that makes the club kit?", "options": ["Jerriz", "Jerris", "Gerriz"], "a": 0, "why": "He spells it: 'J-E-R-R-I-Z'."}, {"q": "What is the approximate speed for Level B training rides?", "options": ["25 kph", "35 kph", "15 kph"], "a": 0, "why": "'If you can do about 25 kilometres an hour, you'd probably be Level B.'"}, {"q": "Where do Level B riders meet on Tuesdays at 5.30 am?", "options": ["At the stadium", "At the entrance to the park", "At the shopping mall"], "a": 0, "why": "'There's one on Tuesdays at 5.30 am, and for that one you meet at the stadium.'"}, {"q": "What do members often have together after the rides?", "options": ["Coffee", "Breakfast at the stadium", "A swimming session"], "a": 0, "why": "'And the members often go somewhere for coffee afterwards, so it's quite a social event.'"}, {"q": "Because there is not always a leader on the rides, what should members check and print on the website beforehand?", "options": ["The route", "The weather forecast", "The membership form"], "a": 0, "why": "'you'll see that the route for each ride is clearly marked. So you can just print that out and take it along with you.'"}, {"q": "Because rides start before sunrise in winter, bikes must have ............ .", "options": ["lights", "mudguards", "spare tyres"], "a": 0, "why": "'in winter, it's well before sunrise when we set out, so you need to make sure your bike's got lights.'"}]}, {"id": "pkg-l10", "num": 38, "skill": "Listening", "book": "Cambridge 13", "source": "Cam 13 · Test 4 · Section 4", "title": "The History of Coffee", "subtitle": "From wild Ethiopian bushes & Ottoman coffee houses to global trade", "minutes": 10, "transcript": "In my presentation, I'm going to talk about coffee, and its importance both in economic and social terms. However, there is evidence that coffee was originally gathered from bushes growing wild in Ethiopia, in the northeast of Africa. In the early sixteenth century, it was being bought by traders, and gradually its use as a drink spread throughout the Middle East. It's also known that in 1522, in the Turkish city of Constantinople, which was the centre of the Ottoman Empire, the court physician approved its use as a medicine.\n\nBy the mid-1500s, coffee bushes were being cultivated in the Yemen and for the next hundred years this region produced most of the coffee drunk in Africa and the Arab world. What's particularly interesting about coffee is its effect on social life. It was rarely drunk at home, but instead people went to coffee houses to drink it. These people, usually men, would meet to drink coffee and chat about issues of the day. But at the time, this chance to share ideas and opinions was seen as something that was potentially dangerous, and in 1623, the ruler of Constantinople demanded the destruction of all the coffee houses in the city, although after his death many new ones opened.\n\nIn the seventeenth century, coffee drinking spread to Europe, and here too coffee shops became places where ordinary people, nearly always men, could meet to exchange ideas. Because of this, some people said that these places performed a similar function to universities. The opportunity they provided for people to meet together outside their own homes and to discuss the topics of the day had an enormous impact on social life, and many social movements and political developments had their origins in coffee house discussions.\n\nIn the late 1600s, the Yemeni monopoly on coffee production broke down and coffee production started to spread around the world, helped by European colonisation. Europeans set up coffee plantations in Indonesia and the Caribbean. Different types of coffee were produced in different areas, and it's interesting that the names given to these different types, like Mocha or Java coffee, were often taken from the port they were shipped to Europe from.\n\nIn Brazil and the various Caribbean colonies, coffee was grown in huge plantations and the workers there were almost all slaves. But this wasn't the same in all colonies; for example in Java, which had been colonised by the Dutch, the peasants grew coffee and passed a proportion of this on to the Dutch, so it was used as a means of taxation. Coffee was grown in ever-increasing quantities to satisfy the growing demand from Europe, and it became nearly as important as sugar production, which was grown under very similar conditions.\n\nIn Britain, however, a new drink was introduced from China, and started to become popular, gradually taking over from coffee: this was tea. However, when the USA gained independence from Britain in 1776, they identified this drink with Britain, and coffee remained the preferred drink in the USA, as it still is today.\n\nDuring the nineteenth century, production boomed and coffee prices started to fall. This was partly because new types of transportation had been developed which were cheaper and more efficient. So now, working people could afford to buy coffee. And this was at a time when large parts of Europe were starting to work in industries. And sometimes this meant their work didn't stop when it got dark; they might have to continue throughout the night. So, the use of coffee as a stimulant became important.", "questions": [{"q": "In 1623 in Constantinople, the ruler ordered the ............ of every coffee house.", "options": ["destruction", "taxation", "inspection"], "a": 0, "why": "'in 1623, the ruler of Constantinople demanded the destruction of all the coffee houses in the city.'"}, {"q": "In 17th-century Europe, coffee shops were compared to ............ because people met there to exchange ideas.", "options": ["universities", "parliaments", "theatres"], "a": 0, "why": "'some people said that these places performed a similar function to universities.'"}, {"q": "European coffee shops played an important part in social and ............ changes.", "options": ["political", "religious", "agricultural"], "a": 0, "why": "'many social movements and political developments had their origins in coffee house discussions.'"}, {"q": "Types of coffee (like Mocha or Java) were often named according to the ............ they came from.", "options": ["port / ports", "mountain", "plantation owner"], "a": 0, "why": "'the names given to these different types, like Mocha or Java coffee, were often taken from the port they were shipped to Europe from.'"}, {"q": "In Brazil and the Caribbean, most coffee cultivation depended on ............ .", "options": ["slaves / slavery", "local taxation", "steam machinery"], "a": 0, "why": "'In Brazil and the various Caribbean colonies, coffee was grown in huge plantations and the workers there were almost all slaves.'"}, {"q": "In Java, coffee was passed on by peasants to the Dutch and used as a form of ............ .", "options": ["taxation", "currency", "medicine"], "a": 0, "why": "'the peasants grew coffee and passed a proportion of this on to the Dutch, so it was used as a means of taxation.'"}, {"q": "In the 18th century, coffee became almost as important as ............ production, while Britain moved towards the consumption of tea.", "options": ["sugar", "cotton", "tobacco"], "a": 0, "why": "'it became nearly as important as sugar production, which was grown under very similar conditions.'"}, {"q": "In the 19th century, coffee prices dropped because of improvements in ............ , and industrial workers found it helped them work at night.", "options": ["transportation", "fertilisers", "packaging"], "a": 0, "why": "'This was partly because new types of transportation had been developed which were cheaper and more efficient.'"}]}, {"id": "pkg-l11", "num": 39, "skill": "Listening", "book": "Cambridge 5", "source": "Cam 5 · Test 1 · Section 1", "title": "Dreamtime Travel: Whale Watch Experience", "subtitle": "Booking a 2-day coastal whale-watching tour in Australia", "minutes": 10, "transcript": "Officer: Good morning, Dreamtime Travel. How can I help you?\nClient: Oh, hello. I'm interested in the Whale Watch Experience I saw advertised in the window. Could you give me some details?\nOfficer: Certainly. It's a two-day coach tour leaving from Sydney. Now, first of all, how many people would it be for?\nClient: Just two adults—my wife and myself.\nOfficer: Right. Well, you have two choices for accommodation. If you stay in the hotel, the total tour price is 110 dollars per person. Or if you prefer the holiday cabins, it's 85 dollars per person.\nClient: We'll definitely go for the hotel option at 110 dollars. Does that include all meals?\nOfficer: It includes breakfast and dinner, and also the afternoon tea on Day 1. You only need to buy your own lunch.\nClient: And how many people are on the coach? I don't like huge crowds.\nOfficer: We use a luxury minibus that takes a maximum of 15 passengers, so it's very comfortable.\nClient: Oh, that's great. What else is included besides the three-hour whale watch cruise?\nOfficer: On the morning of Day 2, before returning, we visit the local Reptile Park, and in the afternoon you have the option of a reef snorkeling trip for an extra 22 dollars.\nClient: Let's book for Friday the 18th of June under the name Mr. David Browne—that's B-R-O-W-N-E.", "questions": [{"q": "How much does the Whale Watch Experience cost per person with hotel accommodation?", "options": ["$85", "$110", "$150"], "a": 1, "why": "The officer says: 'If you stay in the hotel, the total tour price is 110 dollars per person.'"}, {"q": "Which meal is NOT included in the tour price?", "options": ["Breakfast", "Lunch", "Dinner"], "a": 1, "why": "The officer explains: 'It includes breakfast and dinner, and also the afternoon tea on Day 1. You only need to buy your
