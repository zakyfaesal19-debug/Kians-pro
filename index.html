 own lunch.'"}, {"q": "What is the maximum number of passengers on the minibus?", "options": ["12 passengers", "15 passengers", "30 passengers"], "a": 1, "why": "The officer states: 'We use a luxury minibus that takes a maximum of 15 passengers.'"}, {"q": "Which attraction is included on the morning of Day 2?", "options": ["The Reptile Park", "An art gallery", "A mountain cable car"], "a": 0, "why": "The officer says: 'On the morning of Day 2, before returning, we visit the local Reptile Park.'"}, {"q": "How is the client's surname spelled?", "options": ["BROWN", "BROWNE", "BRAUN"], "a": 1, "why": "The client spells it out: 'B-R-O-W-N-E'."}]}, {"id": "pkg-l12", "num": 40, "skill": "Listening", "book": "Cambridge 5", "source": "Cam 5 · Test 1 · Section 2", "title": "Consumer Safety Report: Choosing a Baby Cot", "subtitle": "Comparing Baby Safe, Choice Cots & Mother's Choice", "minutes": 10, "transcript": "Presenter: Welcome back to Consumer Choice. Today we are looking at safety tests on three popular brands of baby cots: Baby Safe, Choice Cots, and Mother's Choice.\nFirst, let's look at the Baby Safe cot. We liked the fact that it was very easy to move from room to room on its wheels. However, it had two serious problems: it did not have any brakes on the wheels, and the drop-side bar could trap a baby's fingers. Despite that, our testers judged it good value for money at £119.\nSecond, Choice Cots. This model had a very smooth drop-side mechanism that was easy for parents to operate with one hand. The downside was that the space between the vertical bars was slightly too wide, which could be dangerous, and the instructions were difficult to understand. So our verdict for Choice Cots was only 'satisfactory'.\nFinally, our top winner: Mother's Choice. Although it has no wheels at all, it is extremely stable, completely safe around the side bars, and can later be converted into a toddler bed. It's our 'Best Buy' of the year.", "questions": [{"q": "What safety problem did the 'Baby Safe' cot have with its wheels?", "options": ["The wheels were made of glass", "It did not have any brakes on the wheels", "The wheels fell off during assembly"], "a": 1, "why": "The presenter notes: 'it did not have any brakes on the wheels, and the drop-side bar could trap a baby's fingers.'"}, {"q": "What did testers like about the 'Choice Cots' model?", "options": ["Its drop-side bar was easy to operate with one hand", "It converted into a desk", "It cost only £40"], "a": 0, "why": "The presenter says Choice Cots had a smooth drop-side mechanism easy to operate with one hand."}, {"q": "Why was the 'Choice Cots' model rated only 'satisfactory'?", "options": ["The space between the vertical bars was slightly too wide", "The paint was peeling", "It was too heavy to lift"], "a": 0, "why": "The presenter explains that the space between the vertical bars was slightly too wide."}, {"q": "Which brand was named the overall 'Best Buy'?", "options": ["Baby Safe", "Choice Cots", "Mother's Choice"], "a": 2, "why": "The presenter concludes: 'Finally, our top winner: Mother's Choice... It's our Best Buy of the year.'"}, {"q": "What extra feature makes 'Mother's Choice' useful as the child grows older?", "options": ["It can be converted into a toddler bed", "It folds into a suitcase", "It includes a built-in radio"], "a": 0, "why": "The presenter states it 'can later be converted into a toddler bed'."}]}, {"id": "pkg-l13", "num": 41, "skill": "Listening", "book": "Cambridge 5", "source": "Cam 5 · Test 2 · Section 2", "title": "Pedal Power: Bicycles for the World", "subtitle": "Dan Pearman's charity shipping used bicycles to Rivas, Nicaragua", "minutes": 10, "transcript": "Interviewer: Today I'm talking to Dan Pearman, founder of the charity 'Pedal Power'. Dan, how did the project start?\nDan: Well, in 1993 I went to Ecuador on a voluntary enterprise scheme. I noticed that while villages had almost no public transport, anyone who owned a bicycle could get their farm produce to market and reach clinics in half the time.\nWhen I came back to the UK, I set up Pedal Power to collect second-hand bicycles that British families no longer used in their garages and ship them to developing communities.\nWe chose the town of Rivas in Nicaragua as our main partner because the local women's cooperative there already had a small workshop and wanted to train local bicycle mechanics.\nIn our first year we shipped 300 bikes, and today we send over 3,000 a year, along with spare tyres, inner tubes, and toolkits. Last August, we held a nationwide 'Donate a Bike Day' across 45 British towns.", "questions": [{"q": "In which year did Dan Pearman travel to Ecuador before founding Pedal Power?", "options": ["1983", "1993", "2003"], "a": 1, "why": "Dan states: 'in 1993 I went to Ecuador on a voluntary enterprise scheme.'"}, {"q": "What is the main activity of the charity 'Pedal Power'?", "options": ["Manufacturing racing cars", "Collecting unused second-hand bikes in the UK and shipping them to developing communities", "Organizing Olympic track cycling"], "a": 1, "why": "Dan explains he set up Pedal Power to collect second-hand bicycles in the UK and ship them abroad."}, {"q": "Why did Pedal Power choose the town of Rivas in Nicaragua as its main partner?", "options": ["The local cooperative had a workshop and wanted to train mechanics", "It was the capital city", "There were no roads at all"], "a": 0, "why": "Dan says the local women's cooperative in Rivas already had a workshop and wanted to train bicycle mechanics."}, {"q": "Besides complete bicycles, what else does Pedal Power ship in its containers?", "options": ["Spare tyres, inner tubes, and toolkits", "Computers and printers", "Winter coats"], "a": 0, "why": "Dan mentions shipping 'spare tyres, inner tubes, and toolkits'."}, {"q": "Approximately how many bicycles does Pedal Power ship per year now?", "options": ["30 bikes", "300 bikes", "Over 3,000 bikes"], "a": 2, "why": "Dan notes: 'In our first year we shipped 300 bikes, and today we send over 3,000 a year.'"}]}, {"id": "pkg-l14", "num": 42, "skill": "Listening", "book": "Cambridge 5", "source": "Cam 5 · Test 3 · Section 4", "title": "Household Waste Recycling in the UK", "subtitle": "EU targets, kerbside collection & public recycling habits", "minutes": 10, "transcript": "Lecturer: Good morning. Today's environmental policy lecture examines household waste recycling in Britain.\nCurrently, the UK recycles only about 18 per cent of its domestic waste, compared with over 50 per cent in countries such as Germany, Austria, and the Netherlands. Under European Union directives, Britain must increase its household recycling rate to at least 33 per cent within the next three years, or face heavy financial penalties.\nOur survey of 1,200 households revealed that 84 per cent of residents support recycling in principle, yet only half actually separate their waste every week. What explains this gap?\nThe single biggest barrier cited was the lack of convenient kerbside collection boxes. Where local councils provide colour-coded kerbside bins for paper, glass, and cans, participation jumps from 40 per cent to nearly 80 per cent. A second issue is confusion over plastics: many consumers do not know which plastic bottles can be recycled and worry that one wrong item will contaminate the whole load.", "questions": [{"q": "What percentage of domestic waste did the UK recycle at the time of the lecture?", "options": ["About 18 per cent", "33 per cent", "Over 50 per cent"], "a": 0, "why": "The lecturer states: 'Currently, the UK recycles only about 18 per cent of its domestic waste.'"}, {"q": "What target rate must the UK reach under European Union directives?", "options": ["10 per cent", "At least 33 per cent", "90 per cent"], "a": 1, "why": "The lecturer says Britain must increase its household recycling rate to 'at least 33 per cent'."}, {"q": "What was the single biggest barrier preventing households from recycling regularly?", "options": ["Lack of convenient kerbside collection boxes", "High taxes on paper", "Lack of newspapers"], "a": 0, "why": "The lecturer notes: 'The single biggest barrier cited was the lack of convenient kerbside collection boxes.'"}, {"q": "How does providing colour-coded kerbside bins affect household participation?", "options": ["Participation jumps from 40 per cent to nearly 80 per cent", "Participation drops by half", "It has no effect"], "a": 0, "why": "The lecturer reports participation jumps from 40 per cent to nearly 80 per cent."}, {"q": "What causes confusion for many consumers when sorting plastic waste?", "options": ["Not knowing which types of plastic bottles can be recycled", "Plastic bins are too small", "Glass and plastic look identical"], "a": 0, "why": "The lecturer explains that many consumers do not know which plastic bottles can be recycled."}]}, {"id": "pkg-l15", "num": 43, "skill": "Listening", "book": "Cambridge 6", "source": "Cam 6 · Test 2 · Section 1", "title": "East Coast Rail: London to Harwich Ticket Enquiry", "subtitle": "Comparing Standard Saver vs Apex train fares & ferry connections", "minutes": 10, "transcript": "Clerk: Good afternoon, East Coast Rail Enquiries. How can I help?\nPassenger: Hello, I'd like to travel from London Liverpool Street to Harwich this Saturday to catch the evening ferry to Holland.\nClerk: Right. There's a direct train departing Liverpool Street at 15:45 that arrives at Harwich International Port at 17:05, right alongside the ferry terminal.\nPassenger: That timing sounds ideal. What are the ticket prices for a return journey?\nClerk: Well, a Standard Open Return is £38.50. However, if you book a Super Saver Return, it's £24.50, valid on any weekend train. We also have an Advance Apex ticket for £18, but that has to be booked at least seven days ahead, so it's too late for this Saturday.\nPassenger: I see, I'll take the Super Saver Return at £24.50 then. Can I reserve a seat in a non-smoking carriage with a table?\nClerk: Yes, seat reservations are free of charge with the Super Saver. And remember, there is a buffet car on the 15:45 service serving hot drinks and sandwiches.", "questions": [{"q": "What time does the direct afternoon train depart from London Liverpool Street?", "options": ["15:45", "17:05", "18:30"], "a": 0, "why": "The clerk says: 'There's a direct train departing Liverpool Street at 15:45.'"}, {"q": "Why can the passenger NOT buy the £18 Advance Apex ticket?", "options": ["It is only for students", "It must be booked at least seven days in advance", "It is only valid on Mondays"], "a": 1, "why": "The clerk explains the £18 Apex ticket has to be booked at least seven days ahead."}, {"q": "Which ticket does the passenger decide to purchase?", "options": ["Standard Open Return (£38.50)", "Super Saver Return (£24.50)", "First Class Single (£65.00)"], "a": 1, "why": "The passenger says: 'I'll take the Super Saver Return at £24.50 then.'"}, {"q": "How much does it cost to reserve a seat with the Super Saver ticket?", "options": ["It is free of charge", "£5 extra", "£10 extra"], "a": 0, "why": "The clerk confirms: 'seat reservations are free of charge with the Super Saver.'"}, {"q": "What facility is available on board the 15:45 train?", "options": ["A buffet car serving hot drinks and sandwiches", "A cinema coach", "A sleeping berth"], "a": 0, "why": "The clerk mentions 'there is a buffet car on the 15:45 service serving hot drinks and sandwiches'."}]}, {"id": "pkg-l16", "num": 44, "skill": "Listening", "book": "Cambridge 6", "source": "Cam 6 · Test 3 · Section 2", "title": "Rosewood House & Gardens Audio Tour", "subtitle": "Historic country estate tour, Pear Alley & The Old Kitchen", "minutes": 10, "transcript": "Guide: Welcome to Rosewood House and Gardens. Before you set off on your walk, let me point out the highlights on your map.\nRosewood House was bought by the poet Richard Wharton in 1784. As you leave the Visitor Centre, follow the main path past the library wing. On your left, you'll see the sunken Italian Garden, which features a 19th-century marble fountain in the centre.\nContinuing north along Pear Alley—named after the 40 varieties of heritage pear trees planted along the brick wall—you will reach the Glasshouse, where exotic orchids and citrus trees are grown year-round.\nIf you have children with you, just beyond the orchard in the north-east corner is the Woodland Play Area and the Shire Horse Stables.\nFinally, on your way back to the courtyard, don't miss The Old Kitchen, which has been restored with its original copper cooking pots and now houses our tearoom serving homemade scones.", "questions": [{"q": "When did the poet Richard Wharton purchase Rosewood House?", "options": ["In 1684", "In 1784", "In 1894"], "a": 1, "why": "The guide states: 'Rosewood House was bought by the poet Richard Wharton in 1784.'"}, {"q": "What is located in the centre of the sunken Italian Garden?", "options": ["A 19th-century marble fountain", "A bronze statue of a horse", "A wooden windmill"], "a": 0, "why": "The guide mentions 'the sunken Italian Garden, which features a 19th-century marble fountain in the centre'."}, {"q": "Why is the northern path called 'Pear Alley'?", "options": ["It is shaped like a pear", "40 varieties of heritage pear trees are planted along its brick wall", "Pears are sold at the gate"], "a": 1, "why": "The guide says it is 'named after the 40 varieties of heritage pear trees planted along the brick wall'."}, {"q": "Where are the Woodland Play Area and Shire Horse Stables situated?", "options": ["In the north-east corner beyond the orchard", "Inside the library wing", "Underneath the Visitor Centre"], "a": 0, "why": "The guide states: 'just beyond the orchard in the north-east corner is the Woodland Play Area and the Shire Horse Stables.'"}, {"q": "What is 'The Old Kitchen' used for today?", "options": ["A tearoom displaying original copper pots and serving scones", "A ticket office", "A private apartment"], "a": 0, "why": "The guide notes The Old Kitchen has been restored with original copper pots and now houses the tearoom."}]}, {"id": "pkg-l17", "num": 45, "skill": "Listening", "book": "Cambridge 7", "source": "Cam 7 · Test 1 · Section 1", "title": "Transport from Bayswater Airport to Milton", "subtitle": "Booking an Airport Shuttle door-to-door transfer", "minutes": 10, "transcript": "Agent: Hello, Milton Tourist Information. How can I help you?\nTraveller: Hi, I'm flying into Bayswater Airport next Thursday and need to get to the town of Milton, which is about 150 kilometres away. What are my transport options?\nAgent: Well, you have two coach options. The Greyhound Bus leaves every two hours and costs $15 one-way, or $27.50 return, dropping you at the central bus station in Milton.\nAlternatively, there's the Airport Shuttle, which is a door-to-door minibus service. It takes you directly to your hotel address for $35 one-way, or $65 return.\nTraveller: Since I have two heavy suitcases, I'll definitely book the door-to-door Airport Shuttle. My flight arrives at 11:30 am, so could I book the 12:30 pm shuttle?\nAgent: Certainly, 12:30 pm on Thursday the 17th of October. Where are you staying in Milton?\nTraveller: At the Vacation Motel on Beach Road. My name is Janet Thompson—that's T-H-O-M-P-S-O-N, with a 'P'.\nAgent: Great, and just so you know, Milton is famous for horse riding along the coast if you have a free afternoon!", "questions": [{"q": "How differs the 'Airport Shuttle' from the 'Greyhound Bus'?", "options": ["The Airport Shuttle is a door-to-door service directly to the hotel", "The Airport Shuttle is cheaper than Greyhound", "The Airport Shuttle travels by ferry"], "a": 0, "why": "The agent explains the Airport Shuttle is a door-to-door minibus service taking passengers directly to their hotel."}, {"q": "How much is a one-way fare on the Airport Shuttle?", "options": ["$15", "$27.50", "$35"], "a": 2, "why": "The agent says: 'It takes you directly to your hotel address for $35 one-way, or $65 return.'"}, {"q": "Which shuttle departure time does the traveller book?", "options": ["11:30 am", "12:30 pm", "2:30 pm"], "a": 1, "why": "Her flight arrives at 11:30 am, and she books the 12:30 pm shuttle."}, {"q": "Where is the traveller staying in Milton?", "options": ["The Grand Hotel", "The Vacation Motel on Beach Road", "Milton Youth Hostel"], "a": 1, "why": "She states: 'At the Vacation Motel on Beach Road.'"}, {"q": "How is the traveller's surname spelled?", "options": ["THOMSON", "THOMPSON", "TOMPSON"], "a": 1, "why": "She specifies: 'T-H-O-M-P-S-O-N, with a P'."}]}, {"id": "pkg-l18", "num": 46, "skill": "Listening", "book": "Cambridge 7", "source": "Cam 7 · Test 1 · Section 4", "title": "Archaeology Seminar: Rock Art in Namibia", "subtitle": "Prehistoric paintings & engravings in the Brandberg Mountains", "minutes": 10, "transcript": "Lecturer: Welcome to our seminar on southern African archaeology. Today I'm reporting back on our field trip to study prehistoric rock art in Namibia, particularly in the Brandberg Mountain region.\nNamibia is unique because it preserves both styles of prehistoric rock art in close proximity: rock paintings (created with mineral pigments such as red ochre and white clay) and rock engravings (pecked or incised directly into hard granite boulders).\nEarly European explorers in the 19th century assumed these artworks were merely decorative pictures of animals hunted for food. However, modern ethnographic and statistical analysis shows something very different.\nIn the Brandberg caves, over 80 per cent of the human figures are depicted in ceremonial postures, and the most frequently painted animal is the giraffe—not because giraffes were the main food source, but because indigenous San communities associated the giraffe with rainmaking rituals in an arid desert climate.", "questions": [{"q": "What makes Namibia particularly significant for rock art researchers?", "options": ["It preserves both rock paintings and rock engravings in close proximity", "All the paintings were made in the 20th century", "The caves are underwater"], "a": 0, "why": "The lecturer states Namibia is unique because it preserves both styles—rock paintings and rock engravings—in close proximity."}, {"q": "How were the prehistoric rock engravings created?", "options": ["Painted with oil brushes", "Pecked or incised directly into hard granite boulders", "Moulded from clay"], "a": 1, "why": "The lecturer explains rock engravings were 'pecked or incised directly into hard granite boulders'."}, {"q": "What mistaken assumption did 19th-century European explorers make about the rock art?", "options": ["That it was merely decorative pictures of animals hunted for food", "That it was written in Latin", "That it showed modern cities"], "a": 0, "why": "The lecturer notes early explorers assumed the artworks were merely decorative pictures of animals hunted for food."}, {"q": "Which animal is most frequently depicted in the Brandberg rock paintings?", "options": ["The lion", "The giraffe", "The elephant"], "a": 1, "why": "The lecturer says 'the most frequently painted animal is the giraffe'."}, {"q": "Why was the giraffe so important in San rock art?", "options": ["It was associated with rainmaking rituals in an arid climate", "It was used as a domestic pack animal", "Its skin was used for boats"], "a": 0, "why": "The lecturer explains San communities associated the giraffe with rainmaking rituals."}]}, {"id": "pkg-l19", "num": 47, "skill": "Listening", "book": "Cambridge 7", "source": "Cam 7 · Test 3 · Section 3", "title": "The Argo Robotic Float Project", "subtitle": "Autonomous ocean profiling floats tracking temperature & salinity", "minutes": 10, "transcript": "Tutor: Right, Anita, tell the seminar group about your research presentation on the 'Argo' ocean project.\nAnita: Thanks, Dr. Evans. The Argo project is an international collaboration that uses over 3,000 autonomous robotic floats deployed across the world's oceans to monitor climate change and ocean currents.\nHere is how each robotic float works: when launched from a research ship, the cylinder sinks to a depth of 2,000 metres. It drifts with the deep ocean currents for 9 days.\nThen, on the 10th day, an internal pump inflates an external bladder, causing the float to rise slowly to the surface. As it rises through the water column, sensors record continuous profiles of water temperature and salinity.\nOnce it breaks the surface, an antenna transmits all the data to a meteorological satellite within six hours, and then the float deflates its bladder and sinks back down to repeat the 10-day cycle for up to four years.", "questions": [{"q": "To what depth does an Argo robotic float sink when deployed?", "options": ["200 metres", "2,000 metres", "10,000 metres"], "a": 1, "why": "Anita explains: 'when launched from a research ship, the cylinder sinks to a depth of 2,000 metres.'"}, {"q": "How long does each complete drift-and-surface cycle last?", "options": ["24 hours", "10 days", "6 months"], "a": 1, "why": "It drifts for 9 days and rises on the 10th day to repeat the 10-day cycle."}, {"q": "What two ocean measurements do the sensors record as the float rises to the surface?", "options": ["Water temperature and salinity", "Wave height and fish population", "Oil deposits and gold"], "a": 0, "why": "Anita states: 'As it rises through the water column, sensors record continuous profiles of water temperature and salinity.'"}, {"q": "How does the float send its recorded data back to scientists on land?", "options": ["Via an antenna transmitting to a satellite when it surfaces", "Through an undersea copper cable", "Divers swim down to collect memory cards"], "a": 0, "why": "Anita says: 'Once it breaks the surface, an antenna transmits all the data to a meteorological satellite.'"}, {"q": "What is the typical operating lifespan of an Argo float?", "options": ["Up to four years", "Only one week", "Fifty years"], "a": 0, "why": "Anita concludes it repeats the cycle 'for up to four years'."}]}, {"id": "pkg-l20", "num": 48, "skill": "Listening", "book": "Cambridge 7", "source": "Cam 7 · Test 4 · Section 4", "title": "Monosodium Glutamate (MSG) & The Fifth Taste", "subtitle": "Kikunae Ikeda's 1908 discovery of umami and glutamate biochemistry", "minutes": 10, "transcript": "Lecturer: In today's food science lecture, we're examining Monosodium Glutamate—better known as MSG—and the fifth basic human taste, 'umami'.\nFor centuries, Japanese chefs used kombu, a type of sea kelp, to make soup stocks taste rich and savoury. In 1908, Professor Kikunae Ikeda at Tokyo Imperial University isolated the active compound in seaweed broth: the amino acid glutamate. He named this savoury taste 'umami', distinct from sweet, sour, salty, and bitter.\nTo make glutamate stable and easy to dissolve like table salt, Ikeda combined it with sodium—creating monosodium glutamate.\nMany people assume glutamate is purely artificial, yet natural free glutamate is abundant in foods we eat every day: ripe tomatoes contain 0.14 per cent, Roquefort and Parmesan cheese contain over 1.2 per cent, and human breast milk is rich in glutamate. Biochemically, our digestive system processes glutamate from MSG and glutamate from Parmesan cheese in the exact same way.", "questions": [{"q": "What ingredient did Professor Kikunae Ikeda study in 1908 to isolate glutamate?", "options": ["Kombu seaweed (sea kelp) broth", "Roasted coffee beans", "Cane sugar"], "a": 0, "why": "The lecturer states Ikeda isolated the active compound in kombu seaweed broth in 1908."}, {"q": "Why did Ikeda combine glutamate with sodium?", "options": ["To make it stable in storage and easy to dissolve like salt", "To turn it bright red", "To make it taste sweet"], "a": 0, "why": "The lecturer explains: 'To make glutamate stable and easy to dissolve like table salt, Ikeda combined it with sodium.'"}, {"q": "What does the word 'umami' refer to?", "options": ["The fifth basic savoury taste", "A Japanese cooking pot", "Sour citrus juice"], "a": 0, "why": "The lecturer says Ikeda named this fifth savoury taste 'umami'."}, {"q": "Which of the following natural foods has the highest concentration of free glutamate mentioned?", "options": ["Parmesan / Roquefort cheese (over 1.2%)", "Ripe tomatoes (0.14%)", "Distilled water (0%)"], "a": 0, "why": "The lecturer states Roquefort and Parmesan cheese contain over 1.2 per cent, compared to 0.14 per cent in tomatoes."}, {"q": "How does the human digestive system treat glutamate from MSG compared with natural glutamate in cheese?", "options": ["It processes both in the exact same way", "It rejects natural glutamate", "It stores MSG in the bones"], "a": 0, "why": "The lecturer concludes our digestive system processes glutamate from MSG and cheese in the exact same way."}]}, {"id": "pkg-l21", "num": 49, "skill": "Listening", "book": "Cambridge 8", "source": "Cam 8 · Test 1 · Section 2", "title": "The Dinosaur Museum Guided Visit", "subtitle": "Opening hours, visitor rules & school activity worksheets", "minutes": 10, "transcript": "Curator: Welcome to the Dinosaur Museum! Before your group goes into the main exhibition halls, let me give you some practical information.\nThe museum is open every day from 9:00 am until 8:00 pm, except on Mondays when we close earlier at 1:30 pm for maintenance.\nIf you have brought backpacks or large bags, please leave them in the free cloakroom next to the ticket desk, as large bags are not permitted inside the fossil galleries. Cameras and video recorders are welcome, provided you do not use flash photography near the delicate amber displays.\nIn Hall 2, you can use our touch-screen computers to build a 3D virtual dinosaur and test how fast it could run.\nFor school groups, please collect the 'Find the Footprint' quiz worksheet from the Information Desk; students who complete all 10 questions receive a fossil postcard before meeting back at the museum coach park at 4:15 pm.", "questions": [{"q": "At what time does the Dinosaur Museum close on Mondays?", "options": ["1:30 pm", "4:15 pm", "8:00 pm"], "a": 0, "why": "The curator states: 'except on Mondays when we close earlier at 1:30 pm for maintenance.'"}, {"q": "What must visitors do with backpacks and large bags?", "options": ["Leave them in the free cloakroom next to the ticket desk", "Carry them on their front", "Leave them on the tour bus"], "a": 0, "why": "The curator says: 'please leave them in the free cloakroom next to the ticket desk'."}, {"q": "What activity is available on the touch-screen computers in Hall 2?", "options": ["Building a 3D virtual dinosaur and testing its running speed", "Booking train tickets", "Ordering lunch from the cafe"], "a": 0, "why": "The curator notes in Hall 2 visitors can use touch-screen computers to build a 3D virtual dinosaur."}, {"q": "Where should school groups pick up their quiz worksheets?", "options": ["From the Information Desk", "From the coach driver", "In the car park"], "a": 0, "why": "The curator instructs school groups to collect the quiz worksheet from the Information Desk."}, {"q": "When should the group meet back at the museum coach park?", "options": ["At 1:30 pm", "At 4:15 pm", "At 8:00 pm"], "a": 1, "why": "The curator finishes: 'before meeting back at the museum coach park at 4:15 pm.'"}]}, {"id": "pkg-l22", "num": 50, "skill": "Listening", "book": "Cambridge 8", "source": "Cam 8 · Test 2 · Section 3", "title": "Asian Honey Bees in Australia", "subtitle": "Ecological risks, Varroa mites & crop pollination", "minutes": 10, "transcript": "Professor: Today we're discussing Grant's biology paper on the arrival of Asian honey bees in northern Australia. Grant, why are agricultural scientists so concerned?\nGrant: Well, Professor, Australia relies heavily on European honey bees—which were introduced in the 1820s—not just for commercial honey, but to pollinate fruit and nut orchards worth over 4 billion dollars a year, especially almonds and apples.\nIn 2007, a colony of Asian honey bees was found nesting in the mast of a ship in Cairns, Queensland. The problem is that Asian honey bees carry microscopic parasites called Varroa mites, which feed on bee larvae and transmit fatal viruses.\nWhile Asian bees have evolved grooming behaviour to brush off the mites, European honey bees have no natural defence: if Varroa mites spread to commercial hives, they can wipe out a colony within months. Quarantine officers are now monitoring floral feeding stations within a 50-kilometre radius of ports.", "questions": [{"q": "Why are European honey bees economically vital to Australian agriculture?", "options": ["They pollinate fruit and nut crops worth over $4 billion a year", "They eat poisonous snakes", "They produce silk"], "a": 0, "why": "Grant explains Australia relies on European honey bees to pollinate fruit and nut orchards worth over 4 billion dollars a year."}, {"q": "Where was the 2007 Asian honey bee colony discovered in Queensland?", "options": ["In the mast of a ship in Cairns", "Inside an airport suitcase", "In a desert cave"], "a": 0, "why": "Grant states: 'In 2007, a colony of Asian honey bees was found nesting in the mast of a ship in Cairns.'"}, {"q": "What dangerous parasite do Asian honey bees carry?", "options": ["Varroa mites", "Tsetse flies", "Locusts"], "a": 0, "why": "Grant says Asian honey bees carry microscopic parasites called Varroa mites."}, {"q": "Why do Asian honey bees survive Varroa mites better than European honey bees?", "options": ["They have evolved grooming behaviour to brush off the mites", "They live underwater", "They do not have larvae"], "a": 0, "why": "Grant notes Asian bees have evolved grooming behaviour to brush off the mites, whereas European bees have no natural defence."}, {"q": "How are quarantine officers tracking the spread of the bees around ports?", "options": ["By monitoring floral feeding stations within a 50-kilometre radius", "By using satellite radar", "By interviewing orchard shoppers"], "a": 0, "why": "Grant says quarantine officers are monitoring floral feeding stations within a 50-kilometre radius of ports."}]}, {"id": "pkg-l23", "num": 51, "skill": "Listening", "book": "Cambridge 8", "source": "Cam 8 · Test 3 · Section 1", "title": "Rented Properties Enquiry: Central Apartment Search", "subtitle": "Steven Godfrey's rental budget & viewing schedule", "minutes": 10, "transcript": "Agent: Good morning, Burnham Lettings. How can I help you?\nClient: Hello, my name is Steven Godfrey. I'm moving to the city next month and looking to rent a two-bedroom property in the central district.\nAgent: Certainly, Mr. Godfrey. Besides two bedrooms, what are your essential requirements?\nClient: It must have a private garage because I drive to work, and my wife really wants a small garden, though a balcony would do if it's opposite a park.\nAgent: And what is your monthly budget?\nClient: I was hoping for around £600 a month, though I could stretch to a maximum of £850 if heating and water bills are reasonable.\nAgent: Well, I have a lovely ground-floor flat on Mead Street—that's M-E-A-D Street—for £780 a month. It has two bedrooms, a lock-up garage, and direct access to a shared walled garden.\nClient: That sounds promising! Could I arrange a viewing this Thursday at 2:15 pm?", "questions": [{"q": "How many bedrooms does Steven Godfrey require?", "options": ["One bedroom", "Two bedrooms", "Four bedrooms"], "a": 1, "why": "He states he is looking to rent a two-bedroom property."}, {"q": "Which feature is essential for Steven because he drives to work?", "options": ["A private garage", "A swimming pool", "An attic"], "a": 0, "why": "He says: 'It must have a private garage because I drive to work.'"}, {"q": "What is the maximum monthly rent Steven is willing to pay?", "options": ["£600", "£780", "£850"], "a": 2, "why": "He says he was hoping for £600, 'though I could stretch to a maximum of £850'."}, {"q": "On which street is the £780 ground-floor flat located?", "options": ["Mead Street", "Park Avenue", "Station Road"], "a": 0, "why": "The agent spells it out: 'Mead Street—that's M-E-A-D Street'."}, {"q": "When does Steven book the property viewing?", "options": ["Thursday at 2:15 pm", "Friday at 9:00 am", "Saturday at 6:00 pm"], "a": 0, "why": "He asks to arrange a viewing 'this Thursday at 2:15 pm'."}]}, {"id": "pkg-l24", "num": 52, "skill": "Listening", "book": "Cambridge 8", "source": "Cam 8 · Test 4 · Section 4", "title": "Australian Aboriginal Rock Paintings", "subtitle": "X-ray style art, mineral pigments & the Rainbow Serpent", "minutes": 10, "transcript": "Lecturer: Today's art history lecture focuses on Australian Aboriginal rock paintings in Arnhem Land in the Northern Territory, one of the longest continuous artistic traditions on Earth, dating back at least 40,000 years.\nBecause organic charcoal is rarely used in these paintings, archaeologists date them by analysing fossilised wasp nests and mineral crusts that formed over the pigment layers.\nOne of the most distinctive features of Arnhem Land art from the last 4,000 years is the 'X-ray style'. When artists painted barramundi fish, kangaroos, or turtles, they didn't just paint the outer silhouette; they meticulously drew the backbone, ribs, heart, and digestive organs inside the animal's body.\nWhy did they do this? Partly to teach young hunters anatomy and respect for the animal, and partly for spiritual renewal. Towering over many rock shelters is the 'Rainbow Serpent', a sacred ancestral creator spirit associated with the monsoon rains and seasonal fertility.", "questions": [{"q": "How do archaeologists determine the age of Arnhem Land paintings that lack charcoal?", "options": ["By analysing fossilised wasp nests and mineral crusts over the pigment", "By reading dates carved in English", "By asking modern tourists"], "a": 0, "why": "The lecturer explains archaeologists date them by analysing fossilised wasp nests and mineral crusts formed over the pigment."}, {"q": "What is the defining feature of the 'X-ray style' in Aboriginal rock art?", "options": ["Showing the internal skeleton, backbone, and organs inside the animal's body", "Painting only with fluorescent neon paint", "Drawing only geometric triangles"], "a": 0, "why": "The lecturer states artists drew the backbone, ribs, heart, and digestive organs inside the animal's body."}, {"q": "What was one practical purpose of painting internal anatomy in X-ray art?", "options": ["To teach young hunters animal anatomy and respect", "To train veterinary surgeons in hospitals", "To scare away birds"], "a": 0, "why": "The lecturer says it was partly to teach young hunters anatomy and respect for the animal."}, {"q": "What does the 'Rainbow Serpent' represent in Aboriginal mythology?", "options": ["An ancestral creator spirit linked to monsoon rains and fertility", "A modern railway line", "A desert sandstorm"], "a": 0, "why": "The lecturer describes the Rainbow Serpent as a sacred ancestral creator spirit associated with monsoon rains and fertility."}, {"q": "How far back does the Aboriginal rock painting tradition in northern Australia extend?", "options": ["At least 40,000 years", "About 400 years", "Since 1901"], "a": 0, "why": "The lecturer states it dates back 'at least 40,000 years'."}]}, {"id": "pkg-w1", "num": 53, "skill": "Writing", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Writing Task 1 (Academic)", "type": "task1_academic", "minutes": 20, "minWords": 150, "title": "Island Before and After Tourist Facilities", "subtitle": "Map comparison · Summarise main features & make comparisons", "prompt": "WRITING TASK 1 (Academic)\nYou should spend about 20 minutes on this task.\n\nThe two maps below show an island, before and after the construction of some tourist facilities.\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.\n\n[VISUAL SUMMARY OF MAPS — Island approx. 250m long]\n• BEFORE CONSTRUCTION:\n  - Completely undeveloped island surrounded by sea.\n  - A natural beach on the western tip.\n  - Scattered palm trees in the western and eastern sections; no buildings, roads, or pier.\n• AFTER CONSTRUCTION:\n  - Beach on the west now has a designated 'Swimming' area in the sea.\n  - Two clusters of hut-style 'Accommodation' built: one in the west near the beach (6 huts connected by footpath) and one in the centre of the island (9 huts arranged in a ring).\n  - A 'Reception' building constructed in the centre, with a 'Restaurant' directly to its north.\n  - A 'Pier' built on the southern coast for boats/yachts, connected by a 'Vehicle track' running north to the Reception and Restaurant.\n  - 'Footpaths' connect the accommodation huts, reception, and western beach.\n  - The eastern third of the island remains undeveloped with its original palm trees.", "modelBand": "7.5 (Upgraded Official Reference)", "modelAnswer": "The two maps illustrate how a small island, measuring approximately 250 metres in length, was transformed following the development of various tourist facilities.\n\nOverall, the once uninhabited island was converted into a resort accessible by boat, complete with accommodation, dining, and reception facilities. Despite extensive construction across the western and central sections, the eastern end of the island was left in its natural state.\n\nPrior to development, the island was entirely barren of infrastructure, featuring only a sandy beach on its western tip and a few clusters of palm trees in the west and east.\n\nFollowing the redevelopment, a pier was constructed on the southern shore to allow boats to dock. From this pier, a vehicle track leads directly north to a central reception block and a restaurant situated near the northern coast. Accommodation was added in two separate zones in the form of circular huts: six huts were built in the west near the beach, while nine more were erected to the east of the reception building. Footpaths were laid to link all accommodation units to the reception and to the western beach, where a designated swimming area was also established. Meanwhile, the eastern part of the island remained untouched.", "examinerNotes": "Official Cambridge Examiner Note: Clear overview comparing before and after states; accurate spatial vocabulary (western tip, southern shore, central reception block); effective distinction between vehicle tracks and footpaths; appropriate use of passive voice for constructions."}, {"id": "pkg-w2", "num": 54, "skill": "Writing", "book": "Cambridge 9", "source": "Cam 9 · Test 1 · Writing Task 2 (Essay)", "type": "task2", "minutes": 40, "minWords": 250, "title": "Foreign Language Learning at Primary vs Secondary School", "subtitle": "Advantages vs Disadvantages Essay · Education & child development", "prompt": "WRITING TASK 2\nYou should spend about 40 minutes on this task.\nWrite about the following topic:\n\nSome experts believe that it is better for children to begin learning a foreign language at primary school rather than secondary school.\nDo the advantages of this outweigh the disadvantages?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "modelBand": "8.5 (Official Cambridge Model Answer)", "modelAnswer": "Traditionally, children have begun studying foreign languages at secondary school, but introducing them earlier is recommended by some educationalists. This policy has been adopted by some educational authorities or individual schools, with both positive and negative outcomes.\n\nThe obvious argument in its favour is that young children pick up languages much more easily than teenagers. Their brains are still programmed to acquire their mother tongue, which facilitates learning another language, and unlike adolescents, they are not inhibited by self-consciousness.\n\nThe greater flexibility of the primary timetable allows for more frequent, shorter sessions and for a play-centred approach, thus maintaining learners' enthusiasm and progress. Their command of the language in later life will benefit from this early exposure, while learning other languages subsequently will be easier for them. They may also gain a better understanding of other cultures.\n\nThere are, however, some disadvantages. Primary school teachers are generalists, and may not have the necessary language skills themselves. If specialists have to be brought in to deliver these sessions, the flexibility referred to above is diminished. If primary language teaching is not standardised, secondary schools could be faced with a great variety of levels in different languages within their intake, resulting in a classroom experience which undoes the earlier gains. There is no advantage if enthusiastic primary pupils become demotivated as soon as they change schools. However, these issues can be addressed strategically within the policy adopted.\n\nAnything which encourages language learning benefits society culturally and economically, and early exposure to language learning contributes to this. Young children's innate abilities should be harnessed to make these benefits more achievable.", "examinerNotes": "Official Cambridge Model Answer: Notice how the writer addresses both advantages (neurological plasticity, lack of self-consciousness, timetable flexibility) and disadvantages (specialist teacher shortages, lack of standardisation at secondary intake), before showing why the advantages outweigh the drawbacks when managed strategically."}, {"id": "pkg-w3", "num": 55, "skill": "Writing", "book": "Cambridge 9", "source": "Cam 9 · Test 2 · Writing Task 2 (Essay)", "type": "task2", "minutes": 40, "minWords": 250, "title": "Compulsory Unpaid Community Service in High School", "subtitle": "Opinion Essay (Agree/Disagree) · Youth education & society", "prompt": "WRITING TASK 2\nYou should spend about 40 minutes on this task.\nWrite about the following topic:\n\nSome people believe that unpaid community service should be a compulsory part of high school programmes (for example working for a charity, improving the neighbourhood or teaching sports to younger children).\nTo what extent do you agree or disagree?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "modelBand": "8.0 (Official Cambridge Sample Answer)", "modelAnswer": "It has been suggested that high school students should be involved in unpaid community services as a compulsory part of high school programmes. Most of the colleges are already providing opportunities to gain work experience, however these are not compulsory. In my opinion, sending students to work in community services is a good idea as it can provide them with many lots of valuable skills.\n\nLife skills are very important and by doing voluntary work, students can learn how to communicate with others and work in a team but also how to manage their time and improve their organisational skills. Nowadays, unfortunately, teenagers do not have many after-school activities. After-school clubs are no longer that popular and students mostly go home and sit in front of the TV, browse internet or play video games.\n\nBy giving them compulsory work activities with charitable or community organisations, they will be encouraged to do something more creative. Skills gained through compulsory work will not only be an asset on their CV but also increase their employability. Students will also gain more respect towards work and money as they will realise that it is not that easy to earn them and hopefully will learn to spend them in a more practical way.\n\nHealthy life balance and exercise are strongly promoted by the NHS, and therefore any kind of spare time charity work will prevent from sitting and doing nothing. It could also possibly reduce the crime level in the high school age group. If students have activities to do, they will not be bored and come up with silly ideas which can be dangerous for them or their surroundings.\n\nIn conclusion, I think this is a very good idea, and I hope this programme will be put into action for high schools and colleges shortly.", "examinerNotes": "Official Cambridge Examiner Comment (Band 8.0): The answer addresses all parts of the prompt sufficiently, focusing on the benefits for students. Ideas are logically ordered and cohesion is consistently well managed. A wide range of vocabulary is used to articulate meanings precisely (asset on their CV, increase their employability)."}, {"id": "pkg-w4", "num": 56, "skill": "Writing", "book": "Cambridge 9", "source": "Cam 9 · GT Test A · Writing Task 1 (Letter)", "type": "task1_general", "minutes": 20, "minWords": 150, "title": "Requesting Time Off Work from Your Manager", "subtitle": "General Training Formal/Semi-Formal Letter · Workplace communication", "prompt": "WRITING TASK 1 (General Training)\nYou should spend about 20 minutes on this task.\n\nYou are working for a company. You need to take some time off work and want to ask your manager about this.\nWrite a letter to your manager. In your letter:\n• explain why you want to take time off work\n• give details of the amount of time you need\n• suggest how your work could be covered while you are away\n\nWrite at least 150 words. You do NOT need to write any addresses.\nBegin your letter as follows: Dear ............ ,", "modelBand": "8.5 (Official Cambridge Model Answer)", "modelAnswer": "Dear Jennifer,\n\nI am writing to request some unpaid leave next month.\n\nMy parents' 60th wedding anniversary is on March 21st, and they are planning to celebrate this significant achievement with all their children and grandchildren. To do this, they have rented a house big enough to accommodate the whole family.\n\nTo participate in this special occasion, I would need to be away from work for four days, from Monday 19th to Thursday 23rd. My schedule for that week is relatively light, apart from two meetings with clients. Netta would be able to attend these in my place, as she has had previous dealings with both companies and knows the relevant staff there. I have no other urgent work commitments at that time.\n\nI would be very grateful if you could allow me this time. These few days are very important to my parents and the whole family, and it would be a way to thank them for all the support they have given me.\n\nBest wishes,\nAlex", "examinerNotes": "Official Cambridge Model Answer: Notice how each bullet point is given its own clear paragraph, the tone is polite and professional (semi-formal to a known manager), and concrete dates and colleague handover arrangements are specified without bracketed placeholders."}, {"id": "pkg-w5", "num": 57, "skill": "Writing", "book": "Cambridge 13", "source": "Cam 13 · Test 1 · Writing Task 1 (Academic)", "type": "task1_academic", "minutes": 20, "minWords": 150, "title": "City Hospital Road Access (2007 vs 2010)", "subtitle": "Map comparison · Infrastructure, roundabouts, bus station & car parks", "prompt": "WRITING TASK 1 (Academic)\nYou should spend about 20 minutes on this task.\n\nThe two maps below show road access to a city hospital in 2007 and in 2010.\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\n\nWrite at least 150 words.\n\n[VISUAL SUMMARY OF MAPS — City Hospital Road Access]\n• 2007 LAYOUT:\n  - 'City Hospital' is surrounded by a circular 'Ring Road'.\n  - 'Hospital Road' runs north from 'City Road' to the Ring Road.\n  - Six 'Bus stops' (three on each side) are located along Hospital Road.\n  - A single combined 'Car park: staff and public' is located to the east of Hospital Road, accessed via Hospital Road.\n• 2010 LAYOUT:\n  - Two 'Roundabouts' have been added on Hospital Road: one at the junction with Ring Road (north) and one at the junction with City Road (south).\n  - The six bus stops on Hospital Road were removed and replaced by a large 'Bus station' on the west side of Hospital Road, connected to both roundabouts.\n  - The old car park on the east of Hospital Road became a 'Staff car park' only.\n  - A new 'Public car park' was constructed on the eastern side of the City Hospital, accessed directly from the Ring Road.", "modelBand": "8.0 (High-Band Reference Answer)", "modelAnswer": "The two maps illustrate the changes made to transport infrastructure and road access around a city hospital between 2007 and 2010.\n\nOverall, the hospital's road network was significantly upgraded over the three-year period to improve traffic flow and transport capacity, primarily through the addition of two roundabouts, a dedicated bus station, and separate parking facilities for staff and the public.\n\nIn 2007, City Hospital was encircled by a Ring Road, which was connected to City Road in the south via Hospital Road. Along both sides of Hospital Road, there were six individual bus stops. To the east of Hospital Road stood a single car park shared by both hospital staff and members of the public, with its entrance on Hospital Road.\n\nBy 2010, two roundabouts had been constructed at either end of Hospital Road — one where it met City Road and another at its junction with the Ring Road. The six roadside bus stops were removed and replaced by a dedicated bus station situated to the west of Hospital Road, linked directly to both new roundabouts. Additionally, parking arrangements were separated: the original car park east of Hospital Road was designated exclusively for staff, while a new public car park was built on the eastern side of the hospital, accessed from the Ring Road.", "examinerNotes": "High-Band Reference Note: Contrasts the 2007 layout with the 2010 upgrades systematically; uses precise spatial prepositions (encircled by, at either end, to the west of, designated exclusively for)."}, {"id": "pkg-w6", "num": 58, "skill": "Writing", "book": "Cambridge 13", "source": "Cam 13 · Test 2 · Writing Task 2 (Essay)", "type": "task2", "minutes": 40, "minWords": 250, "title": "Too Many Choices in Modern Society", "subtitle": "Opinion Essay (To what extent do you agree or disagree?) · Consumerism & lifestyle", "prompt": "WRITING TASK 2\nYou should spend about 40 minutes on this task.\nWrite about the following topic:\n\nSome people believe that nowadays we have too many choices.\nTo what extent do you agree or disagree with this statement?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "modelBand": "7.5 (Upgraded Official Sample Answer)", "modelAnswer": "The question of whether modern society offers excessive choice is complex, as the impact of abundance depends heavily on the area of life being considered. While I believe having a wide array of options is highly beneficial in crucial domains such as education and nutrition, I agree that consumer media and retail often overwhelm individuals with unnecessary alternatives.\n\nIn fundamental areas of personal development, a broad range of choices empowers individuals to fulfil their potential. In higher education and career paths, for instance, young people today are no longer restricted to the trades of their parents. Universities offer specialised degrees ranging from biotechnology to digital design, allowing students to align their studies with their specific aptitudes. Similarly, in supermarkets, a diverse selection of food accommodates people with allergies, ethical diets, or varied family preferences.\n\nConversely, in entertainment and consumer goods, the proliferation of choice has reached a point of diminishing returns. Streaming platforms and television networks now offer hundreds of channels and thousands of titles, which frequently leads to decision fatigue and sedentary habits rather than genuine satisfaction. Likewise, when purchasing everyday items such as smartphones or clothing, consumers are bombarded with dozens of nearly identical models, creating anxiety over making the wrong purchase.\n\nIn conclusion, we cannot generalise that all modern choices are excessive. Where variety supports individual freedom, health, and career fulfilment, it is a welcome advance; however, in commercial entertainment and retail, the sheer volume of options has indeed become overwhelming.", "examinerNotes": "Examiner Commentary: This balanced response directly addresses 'To what extent' by distinguishing between meaningful life choices (education, nutrition) and overwhelming consumer choices (television/streaming, retail), supported by concrete examples."}, {"id": "pkg-w7", "num": 59, "skill": "Writing", "book": "Cambridge 5", "source": "Cam 5 · Test 1 · Academic Writing Task 1", "title": "Ageing Population Proportions (Japan, Sweden & USA 1940–2040)", "subtitle": "Academic Task 1: Line graph & table comparing population aged 65+", "minutes": 20, "type": "task1_academic", "minWords": 150, "prompt": "WRITING TASK 1 (Academic — Cambridge 5 Test 1)\nYou should spend about 20 minutes on this task.\n\nThe graph below shows the proportion of the population aged 65 and over between 1940 and 2040 in three different countries: the USA, Sweden, and Japan.\nSummary Data Reference:\n• 1940: USA (9%), Sweden (7%), Japan (5%).\n• 1980: USA (15%), Sweden (14%), Japan (4.5%).\n• 2000: Sweden (14%), USA (14%), Japan (10%).\n• 2040 Projection: Japan surges to 27%, Sweden reaches 25%, and the USA reaches 23%.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\nWrite at least 150 words.", "modelBand": "8.5", "modelAnswer": "The line graph compares the percentage of elderly citizens aged 65 and above in the United States, Sweden, and Japan over a 100-year period from 1940 to 2040.\n\nOverall, the proportion of senior citizens is projected to increase substantially in all three nations over the century. Although Japan had the lowest percentage of elderly people for most of the twentieth century, it is forecast to experience the most dramatic surge after 2000, overtaking both Sweden and the USA by 2040.\n\nIn 1940, roughly 9% of Americans and 7% of Swedes were aged 65 or over, compared with only 5% in Japan. Over the following five decades, the figures for the USA and Sweden climbed steadily, reaching approximately 15% and 14% respectively by 1980, before plateauing through the year 2000. By contrast, Japan's elderly share remained below 5% until the late 1980s, after which it doubled to 10% by 2000.\n\nLooking ahead to 2040, demographic ageing will accelerate across all three countries. Sweden's elderly population will rise to 25%, slightly ahead of the USA at 23%. Most strikingly, Japan's 65-plus demographic will nearly triple between 2000 and 2040, peaking at 27%—the highest of the three nations.", "examinerNotes": "Band 8.5 Academic Task 1: Clear macro-overview highlighting the upward trend across all three countries and Japan's dramatic reversal from lowest in 1940 to highest in 2040."}, {"id": "pkg-w8", "num": 60, "skill": "Writing", "book": "Cambridge 5", "source": "Cam 5 · Test 2 · Writing Task 2", "title": "Taking a Gap Year Between High School and University", "subtitle": "Task 2 Essay: Advantages vs Disadvantages of working or travelling for a year", "minutes": 40, "type": "task2", "minWords": 250, "prompt": "WRITING TASK 2 (Cambridge 5 Test 2)\nYou should spend about 40 minutes on this task.\n\nIn some countries, young people are encouraged to work or travel for a year between finishing high school and starting university studies.\nDiscuss the advantages and disadvantages for young people who decide to do this.\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "modelBand": "8.0", "modelAnswer": "Taking a 'gap year' to work or travel between secondary school and university has become a common rite of passage in many societies. While a year away from formal study carries certain academic and financial risks, I believe that a well-structured gap year offers invaluable maturity and practical perspective.\n\nOn the positive side, spending twelve months in the workforce or exploring unfamiliar cultures fosters independence and self-reliance. Many eighteen-year-olds leave high school having followed a tightly regimented routine without ever managing a budget or solving real-world problems. Working in a part-time job or volunteering abroad allows school-leavers to test their career interests before committing to an expensive three- or four-year degree. For instance, a student who interns at a hospital or tech startup during a gap year often enters university with far clearer motivation and stronger time-management skills than peers who transition straight from school exams.\n\nConversely, an unplanned gap year can have drawbacks. The primary risk is a loss of academic momentum. After a year without reading dense texts or writing essays, some young people find it difficult to readjust to rigorous university study, particularly in subjects like mathematics or engineering. Furthermore, international travel can be costly, potentially leaving students in debt before their freshmen lectures even begin.\n\nIn conclusion, the value of a gap year depends heavily on how purposefully it is spent. Provided that young people set clear goals—such as saving money, learning a language, or gaining work experience—the personal growth and clarity they acquire far outweigh the temporary pause in their academic timetable.", "examinerNotes": "Band 8.0 Essay: Balanced evaluation of both benefits (independence, career clarity) and drawbacks (loss of study momentum, expense), anchored by a nuanced conclusion."}, {"id": "pkg-w9", "num": 61, "skill": "Writing", "book": "Cambridge 5", "source": "Cam 5 · Test 3 · Academic Writing Task 1", "title": "Proposed Supermarket Sites in Garlsdon (Map Comparison)", "subtitle": "Academic Task 1: Comparing Site S1 (Countryside) vs Site S2 (Town Centre)", "minutes": 20, "type": "task1_academic", "minWords": 150, "prompt": "WRITING TASK 1 (Academic — Cambridge 5 Test 3)\nYou should spend about 20 minutes on this task.\n\nThe map below shows two possible sites (S1 and S2) for the construction of a new supermarket in the town of Garlsdon (population 65,000).\nMap Details:\n• Site S1: Located in the countryside to the north-west of Garlsdon, near the housing estate and on both the railway line and main road to Hindon (12 km away, pop. 10,000).\n• Site S2: Located right in the traffic-free town centre of Garlsdon, surrounded by the industrial zone to the north and south, connected by main roads to Bransdon (16 km, pop. 15,000) and Cransdon (25 km, pop. 29,000), and bisected by the railway.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\nWrite at least 150 words.", "modelBand": "8.0", "modelAnswer": "The map illustrates two potential locations, S1 and S2, proposed for building a new supermarket in the town of Garlsdon, which has a population of 65,000.\n\nOverall, the primary difference between the two options lies in their accessibility and surroundings: S1 is situated in the open countryside on the north-western outskirts, whereas S2 is positioned centrally within Garlsdon's traffic-free town centre.\n\nLooking first at Site S1, it lies in the countryside just north-west of Garlsdon's main residential housing area. Because it sits directly alongside both the railway line and the main road leading to Hindon (12 km away, population 10,000), S1 would be easily accessible by car and train for residents of Hindon and northern Garlsdon.\n\nBy contrast, Site S2 is located in the very heart of Garlsdon's town centre, flanked by industrial zones to the north and south. Although S2 is closer to the railway line and equidistant from the larger neighbouring towns of Bransdon (16 km, population 15,000) and Cransdon (25 km, population 29,000), the town centre itself is a traffic-free zone. Consequently, shoppers could not drive directly to S2 and would need to rely on rail or pedestrian access.", "examinerNotes": "Band 8.0 Map Report: Accurately integrates spatial prepositions, distances, population figures, and the crucial traffic-free town centre constraint."}, {"id": "pkg-w10", "num": 62, "skill": "Writing", "book": "Cambridge 5", "source": "Cam 5 · Test 4 · Writing Task 2", "title": "Innate Personality vs Upbringing and Experience", "subtitle": "Task 2 Essay: Discuss both views on whether character is fixed at birth or shaped by life", "minutes": 40, "type": "task2", "minWords": 250, "prompt": "WRITING TASK 2 (Cambridge 5 Test 4)\nYou should spend about 40 minutes on this task.\n\nResearch indicates that the characteristics we are born with have much more influence on our personality and development than any experiences we may have in our life.\nWhich do you consider to be the major influence?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "modelBand": "8.5", "modelAnswer": "The question of whether human personality is predominantly determined by genetic inheritance ('nature') or shaped by environmental experiences ('nurture') has long divided psychologists. While biological traits establish our baseline temperament, I contend that family upbringing, education, and life experiences exert the decisive influence on who we ultimately become.\n\nAdmittedly, genetic research—particularly twin studies—demonstrates that infants are not born as blank slates. Identical twins raised apart often share striking similarities in introversion, emotional sensitivity, and musical or athletic aptitude. These inherited predispositions provide the raw material of character, explaining why two siblings growing up in the same household may react very differently to stress or novelty from an early age.\n\nNevertheless, a genetic predisposition is merely a potential, not a fixed destiny. How a child's innate traits develop depends overwhelmingly on the social environment. A child born with a shy or anxious temperament, for example, can grow into a confident public speaker if supported by encouraging parents and inclusive teachers. Conversely, even the most naturally gifted individual may struggle to thrive if raised in an environment of neglect or deprivation. Furthermore, adults continually reshape their habits, values, and emotional resilience through travel, career challenges, and conscious self-reflection.\n\nIn conclusion, while inherited genetics set the initial stage for our temperament, it is the richness of our upbringing, culture, and personal choices that writes the play. Nurture therefore remains the primary architect of adult personality and character.", "examinerNotes": "Band 8.5 Essay: Sophisticated vocabulary ('blank slates', 'inherited predispositions', 'primary architect') and clear concession-rebuttal structure."}, {"id": "pkg-w11", "num": 63, "skill": "Writing", "book": "Cambridge 7", "source": "Cam 7 · Test 1 · Academic Writing Task 1", "title": "Consumer Expenditure on Five Goods in Four European Countries", "subtitle": "Academic Task 1: Table comparing spending on film, toys, CDs, perfumes & tennis racquets", "minutes": 20, "type": "task1_academic", "minWords": 150, "prompt": "WRITING TASK 1 (Academic — Cambridge 7 Test 1)\nYou should spend about 20 minutes on this task.\n\nThe table below gives information on consumer spending on different items in four different countries in 1998 (in millions of pounds sterling).\nData Summary:\n• Britain: Photographic film (172), Toys (168), CDs (163), Perfumes (156), Tennis racquets (150), Books (157).\n• France: Photographic film (165), Toys (158), CDs (158), Perfumes (145), Tennis racquets (145), Books (153).\n• Italy: Photographic film (157), Toys (158), CDs (150), Perfumes (150), Tennis racquets (155), Books (150).\n• Germany: Photographic film (145), Toys (144), CDs (143), Perfumes (148), Tennis racquets (149), Books (163).\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\nWrite at least 150 words.", "modelBand": "8.0", "modelAnswer": "The table compares consumer expenditure (in millions of pounds sterling) across six categories of leisure and personal goods in Britain, France, Italy, and Germany in 1998.\n\nOverall, British consumers outspent the other three nations in almost every category, whereas Germany recorded the lowest expenditure overall, with the notable exception of books. Across Britain, France, and Italy, photographic film and toys were the most popular purchases.\n\nIn Britain, spending was highest on photographic film at £172 million, closely followed by toys (£168 million) and CDs (£163 million). Even Britain's lowest category, tennis racquets (£150 million), exceeded Germany's spending in five of the six product types. France followed a similar pattern to Britain, allocating its largest budgets to photographic film (£165 million) and equal sums of £158 million to toys and CDs, while spending the least on perfumes and tennis racquets (£145 million each).\n\nItaly and Germany displayed distinct preferences. Italian shoppers spent the most on toys (£158 million) and photographic film (£157 million), and outspent all other nations on tennis racquets (£155 million). By contrast, German consumers spent the least on toys (£144 million) and CDs (£143 million), but topped all four countries in book expenditure at £163 million.", "examinerNotes": "Band 8.0 Table Report: Avoids mechanical row-by-row listing by grouping countries and highlighting maxima, minima, and exceptions (Germany's book spending and Italy's tennis racquets)."}, {"id": "pkg-w12", "num": 64, "skill": "Writing", "book": "Cambridge 7", "source": "Cam 7 · Test 2 · Writing Task 2", "title": "Fixed Punishments vs Considering the Circumstances of a Crime", "subtitle": "Task 2 Essay: Discuss both views on mandatory sentencing vs judicial discretion", "minutes": 40, "type": "task2", "minWords": 250, "prompt": "WRITING TASK 2 (Cambridge 7 Test 2)\nYou should spend about 40 minutes on this task.\n\nSome people believe that there should be fixed punishments for each type of crime. Others, however, argue that the circumstances of an individual crime, and the motivation for committing it, should always be taken into account when deciding on the punishment.\nDiscuss both these views and give your own opinion.\n\nWrite at least 250 words.", "modelBand": "8.5", "modelAnswer": "Whether the justice system should impose mandatory fixed sentences for every offence or allow judges to tailor punishments to individual circumstances is a central debate in legal philosophy. While fixed sentencing offers consistency and deterrence, I firmly believe that true justice requires examining the offender's intent and context.\n\nProponents of fixed punishments argue that predetermined penalties guarantee equality before the law and streamline court proceedings. When every burglary or assault carries an automatic sentence, there is minimal room for judicial bias, corruption, or disparities between lenient and harsh judges. Furthermore, a clear, non-negotiable tariff may act as a stronger deterrent because potential offenders know the exact consequence of breaking the law in advance.\n\nHowever, treating all crimes of the same category as identical ignores crucial moral differences. In reality, two acts that fall under the same legal label can differ vastly in culpability. For example, a person who steals food out of desperation to feed a starving family does not pose the same threat to society as a professional criminal who shoplifts for profit. Similarly, an act of violence committed in self-defence or under extreme provocation cannot justly receive the same sentence as a premeditated attack. Allowing judges discretion to weigh mitigating factors—such as age, remorse, mental health, and prior record—ensures that the punishment fits both the crime and the rehabilitation needs of the individual.\n\nIn conclusion, although statutory sentencing guidelines are useful for setting minimum and maximum boundaries, rigid fixed punishments are too blunt an instrument. Courts must retain the flexibility to consider motivation and context if the law is to remain both fair and humane.", "examinerNotes": "Band 8.5 Essay: Precise legal and academic lexis ('equality before the law', 'judicial discretion', 'culpability', 'mitigating factors', 'premeditated')."}, {"id": "pkg-w13", "num": 65, "skill": "Writing", "book": "Cambridge 7", "source": "Cam 7 · Test 4 · Academic Writing Task 1", "title": "Electricity Production by Fuel Source in Australia & France (1980 vs 2000)", "subtitle": "Academic Task 1: Four pie charts comparing Coal, Nuclear, Hydro, Oil & Natural Gas", "minutes": 20, "type": "task1_academic", "minWords": 150, "prompt": "WRITING TASK 1 (Academic — Cambridge 7 Test 4)\nYou should spend about 20 minutes on this task.\n\nThe pie charts below show units of electricity production by fuel source in Australia and France in 1980 and 2000.\nSummary Data:\n• Australia 1980 (Total 100 units): Coal (50), Hydro Power (20), Natural Gas (20), Oil (10), Nuclear (0).\n• Australia 2000 (Total 170 units): Coal (130 units — 76%), Hydro Power (36 units — 21%), Natural Gas (2), Oil (2), Nuclear (0).\n• France 1980 (Total 90 units): Coal (25), Oil (20), Natural Gas (25), Nuclear Power (15), Hydro Power (5).\n• France 2000 (Total 180 units): Nuclear Power (126 units — 70%), Coal (25), Oil (25), Hydro (2), Natural Gas (2).\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\nWrite at least 150 words.", "modelBand": "8.5", "modelAnswer": "The four pie charts compare the amount of electricity generated from five fuel sources in Australia and France between 1980 and 2000.\n\nOverall, total electricity production nearly doubled in both nations over the twenty-year period, rising from 100 to 170 units in Australia and from 90 to 180 units in France. However, their energy strategies diverged sharply: Australia became overwhelmingly reliant on coal, whereas France shifted dramatically toward nuclear power.\n\nIn 1980, Australia generated half of its 100 units from coal (50 units), supplemented by equal shares of hydro power and natural gas (20 units each) and 10 units of oil. By 2000, coal generation in Australia had more than doubled to 130 of the 170 total units (over 75%), and hydro power rose to 36 units, while oil and natural gas fell to a negligible 2 units each. Australia used no nuclear power in either year.\n\nBy contrast, France had a balanced energy mix in 1980, producing 25 units each from coal and natural gas, 20 units from oil, 15 units from nuclear power, and 5 units from hydro. By 2000, nuclear power in France had expanded more than eightfold to 126 units—accounting for 70% of France's 180 units—while coal and oil remained steady at 25 units each and natural gas and hydro dropped to 2 units apiece.", "examinerNotes": "Band 8.5 Pie Chart Report: Combines both total production growth and shifting fuel shares, contrasting Australia's reliance on coal with France's nuclear expansion."}, {"id": "pkg-w14", "num": 66, "skill": "Writing", "book": "Cambridge 8", "source": "Cam 8 · Test 1 · Academic Writing Task 1", "title": "Causes of Worldwide Land Degradation by Region", "subtitle": "Academic Task 1: Pie chart & table comparing deforestation, over-cultivation & over-grazing", "minutes": 20, "type": "task1_academic", "minWords": 150, "prompt": "WRITING TASK 1 (Academic — Cambridge 8 Test 1)\nYou should spend about 20 minutes on this task.\n\nThe pie chart below shows the main reasons why agricultural land becomes less productive. The table shows how these causes affected three regions of the world during the 1990s.\nSummary Data:\n• Worldwide Causes (Pie Chart): Over-grazing (35%), Deforestation (30%), Over-cultivation (28%), Other (7%).\n• Regional Table (% of land degraded in the 1990s):\n  - Europe: Total 23% degraded (9.8% Deforestation, 7.7% Over-cultivation, 5.5% Over-grazing).\n  - Oceania: Total 13% degraded (11.3% Over-grazing, 1.7% Deforestation, 0% Over-cultivation).\n  - North America: Total 5% degraded (3.3% Over-cultivation, 1.5% Over-grazing, 0.2% Deforestation).\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\nWrite at least 150 words.", "modelBand": "8.5", "modelAnswer": "The pie chart illustrates the primary global causes of farmland degradation, while the accompanying table compares the extent to which these factors impacted Europe, Oceania, and North America during the 1990s.\n\nOverall, over-grazing, deforestation, and over-cultivation account for over 90% of agricultural land degradation worldwide. Among the three regions examined, Europe suffered the highest proportion of degraded land in the 1990s, whereas North America was the least affected.\n\nGlobally, over-grazing by livestock is the leading cause of soil degradation at 35%, closely followed by deforestation (30%) and over-cultivation of crops (28%), with other unspecified factors making up just 7%.\n\nTurning to the regional breakdown, Europe experienced the most severe impact, with 23% of its agricultural land degraded—driven primarily by deforestation (9.8%) and over-cultivation (7.7%), alongside 5.5% from over-grazing. Oceania ranked second with 13% total land degradation, almost entirely attributable to over-grazing (11.3%), with only 1.7% caused by deforestation and none at all from over-cultivation. By contrast, North America had only 5% of its farmland degraded, resulting mainly from over-cultivation (3.3%) and over-grazing (1.5%).", "examinerNotes": "Band 8.5 Mixed-Chart Report: Seamlessly synthesizes the global pie chart with the regional table and highlights regional contrasts."}, {"id": "pkg-w15", "num": 67, "skill": "Writing", "book": "Cambridge 8", "source": "Cam 8 · Test 3 · Academic Writing Task 1", "title": "Cement & Concrete Production Process Diagrams", "subtitle": "Academic Task 1: Two process diagrams showing stages and equipment", "minutes": 20, "type": "task1_academic", "minWords": 150, "prompt": "WRITING TASK 1 (Academic — Cambridge 8 Test 3)\nYou should spend about 20 minutes on this task.\n\nThe diagrams below show the stages and equipment used in the cement-making process, and how cement is used to produce concrete for building purposes.\nProcess Details:\n• Diagram 1 (Cement Production): Step 1: Limestone and clay are crushed in a crusher to form powder → Step 2: Mixed in a mixer → Step 3: Passed through a rotating heater (kiln) with external heat → Step 4: Ground on a grinder → Step 5: Packed into bags as finished cement.\n• Diagram 2 (Concrete Production): 15% Cement, 10% Water, 25% Sand, and 50% Gravel (small stones) are poured into a rotating concrete mixer to produce ready-to-use concrete.\n\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant.\nWrite at least 150 words.", "modelBand": "8.5", "modelAnswer": "The two diagrams illustrate the industrial process of manufacturing cement from raw minerals and the subsequent method of mixing cement with other ingredients to produce concrete for construction.\n\nOverall, cement production is a multi-stage thermal and mechanical process involving five sequential steps, whereas concrete production is a simpler single-stage blending operation in which gravel makes up half of the final mixture.\n\nTo manufacture cement, two raw materials—limestone and clay—are first fed into a mechanical crusher, which pulverizes them into a fine powder. This powder is then thoroughly blended inside a cylindrical mixer before passing into a rotating heater, where it is heated to high temperatures by a flame at one end. Once heated, the resulting material is fed onto rollers in a grinder, which crushes it into smooth cement powder ready to be packed into bags for distribution.\n\nIn the second diagram, concrete is produced by combining four components inside a rotating concrete mixer. Small stones (gravel) constitute the largest share at 50% of the volume, alongside 25% sand, 15% cement, and 10% water. As the drum rotates, these four materials combine to form wet concrete.", "examinerNotes": "Band 8.5 Process Report: Exemplary use of passive voice ('are fed into', 'is then thoroughly blended', 'is produced by combining') and sequence markers."}, {"id": "pkg-w16", "num": 68, "skill": "Writing", "book": "Cambridge 8", "source": "Cam 8 · Test 3 · Writing Task 2", "title": "Increasing Petrol Prices to Solve Traffic and Pollution Problems", "subtitle": "Task 2 Essay: To what extent do you agree or disagree?", "minutes": 40, "type": "task2", "minWords": 250, "prompt": "WRITING TASK 2 (Cambridge 8 Test 3)\nYou should spend about 40 minutes on this task.\n\nIncreasing the price of petrol is the best way to solve growing traffic and pollution problems.\nTo what extent do you agree or disagree?\nWhat other measures do you think might be effective?\n\nGive reasons for your answer and include any relevant examples from your own knowledge or experience.\nWrite at least 250 words.", "modelBand": "8.5", "modelAnswer": "Rising urban congestion and vehicular air pollution have prompted economists to propose higher fuel taxes as a primary policy remedy. While raising petrol prices can curb unnecessary car journeys to some extent, I disagree that it is the single best solution; lasting progress requires investing in affordable public transit and clean-energy infrastructure.\n\nAdmittedly, increasing the cost of petrol creates an immediate financial incentive for motorists to rethink their driving habits. When fuel becomes expensive, commuters are more likely to carpool, combine shopping trips, or choose more fuel-efficient vehicles, which reduces carbon emissions in the short term.\n\nHowever, relying solely on higher petrol taxes is both socially regressive and ineffective where no transport alternatives exist. In many suburban and rural areas without reliable bus or rail links, driving to work or school is a necessity rather than a luxury; consequently, higher fuel prices simply penalize low-income households without taking cars off the road.\n\nTo tackle traffic and pollution at their root, governments should implement a combination of practical alternatives. First, expanding rapid transit networks—such as dedicated bus lanes, light rail, and safe cycling corridors—gives citizens a faster, cheaper option than driving. Second, subsidies for electric vehicles and nationwide charging stations can decarbonize road transport directly. Finally, urban congestion charges in city centres can fund greener buses and trams.\n\nIn conclusion, while fuel pricing has a supporting role to play, it is far from the best standalone measure. Only by providing convenient public transport and accelerating the shift to clean vehicles can cities sustainably solve traffic and pollution.", "examinerNotes": "Band 8.5 Essay: Directly answers both questions in the prompt ('To what extent do you agree?' and 'What other measures might be effective?')."}, {"id": "pkg-s1", "num": 69, "skill": "Speaking", "book": "Cambridge 6", "source": "Cam 6 · Test 2 · Speaking Parts 1–3", "title": "Musical Instruments & Keeping Healthy", "subtitle": "Part 1: Music · Part 2: Something healthy you enjoy doing · Part 3: Modern lifestyles", "minutes": 14, "part1": ["Which musical instrument do you like listening to most? [Why?]", "Have you ever learned to play a musical instrument? [Which one?]"
